syntax = "proto3";

package opentelemetry.proto.collector.logs.v1;

// Wire-compatible subset of OTLP logs v1. The collector does not consume
// other fields. See https://github.com/open-telemetry/opentelemetry-proto.
message ExportLogsServiceRequest {
  repeated ResourceLogs resource_logs = 1;
}

message ResourceLogs {
  Resource resource = 1;
  repeated ScopeLogs scope_logs = 2;
}

message Resource {
  repeated KeyValue attributes = 1;
}

message ScopeLogs {
  InstrumentationScope scope = 1;
  repeated LogRecord log_records = 2;
}

message InstrumentationScope {
  string name = 1;
}

message LogRecord {
  AnyValue body = 5;
  repeated KeyValue attributes = 6;
}

message KeyValue {
  string key = 1;
  AnyValue value = 2;
}

message AnyValue {
  oneof value {
    string string_value = 1;
    int64 int_value = 3;
  }
}
