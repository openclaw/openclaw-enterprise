message GetGatewayInfoRequest {}
message GetGatewayInfoResponse {
  ServiceStatus status = 1;
  string gateway_version = 2;
  repeated NegotiatedExtensionInfo extensions = 4;
}
message NegotiatedExtensionInfo {
  uint32 kind = 1;
  string configured_name = 2;
  string implementation_name = 3;
  string implementation_version = 4;
  uint32 protocol_major = 5;
  uint32 protocol_minor = 6;
  repeated string supported_capabilities = 7;
  repeated string required_capabilities = 8;
}
message GetSandboxPolicyStatusRequest {
  string sandbox = 1;
  uint32 version = 2;
  bool global = 3;
  WorkspaceSelector workspace_scope = 4;
}
message GetSandboxPolicyStatusResponse {
  SandboxPolicyRevision revision = 1;
  uint32 active_version = 2;
  // Supplier extension fields, absent from stock v0.1.4. Protected execution
  // requires their negotiated capabilities and rejects missing observations.
  LoadedEnforcementEvidence loaded_enforcement = 3;
  LoadedPolicyObservationV1 loaded_policy_observation = 4;
}
// Source revision is unchanged; enforcement identifies the effective policy.
// Field 3 above retains its source == effective semantics.
message LoadedPolicyObservationV1 {
  string source_policy_hash = 1;
  SandboxPolicy effective_policy = 2;
  LoadedEnforcementEvidence enforcement = 3;
  string inert_provider_rule = 4;
  // Ed25519 public key observed on the gateway current supervisor session.
  bytes registered_exchange_public_key = 5;
}
// Additive supplier contract: current accepted registration after runtime installation.
message LoadedEnforcementEvidence {
  string sandbox_id = 1;
  string instance_id = 2;
  uint32 policy_version = 3;
  string policy_hash = 4;
  uint64 config_revision = 5;
  uint64 provider_env_revision = 6;
  repeated string enforced_capabilities = 7;
}
message SandboxPolicyRevision {
  reserved 5, 6;
  reserved "created_at_ms", "loaded_at_ms";
  uint32 version = 1;
  string policy_hash = 2;
  PolicyStatus status = 3;
  string load_error = 4;
  google.protobuf.Timestamp created_time = 105;
  google.protobuf.Timestamp loaded_time = 106;
  SandboxPolicy policy = 7;
  map<string, string> provenance = 8;
}

message CredentialConnector {
