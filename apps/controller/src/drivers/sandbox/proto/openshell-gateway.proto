// Upstream v0.1.4 (5a7728c3): ExecSandbox and credential retrieval retain
// their independent operations and original field numbers.
// Draft and update policy RPCs match the pinned v0.1.4 wire fixture.
message GetDraftPolicyRequest { string sandbox = 1; string status_filter = 2; WorkspaceSelector workspace_scope = 3; }
message GetDraftPolicyResponse { repeated PolicyChunk chunks = 1; uint64 draft_version = 3; }
message PolicyChunk {
  string id = 1; string status = 2; string rule_name = 3; NetworkPolicyRule proposed_rule = 4;
  string rationale = 5; int32 hit_count = 13; string binary = 16;
}
enum PolicyStatus { POLICY_STATUS_UNSPECIFIED = 0; POLICY_STATUS_PENDING = 1; POLICY_STATUS_LOADED = 2; POLICY_STATUS_FAILED = 3; POLICY_STATUS_SUPERSEDED = 4; }
message UpdateConfigRequest { string sandbox = 1; SandboxPolicy policy = 2; uint64 expected_resource_version = 8; map<string,string> annotations = 9; WorkspaceSelector workspace_scope = 10; string request_id = 11; }
message UpdateConfigResponse { uint32 version = 1; string policy_hash = 2; }
message ExecSandboxRequest {
  reserved 5;
  reserved "timeout_seconds";
  string sandbox = 1;
  repeated string command = 2;
  string workdir = 3;
  map<string, string> environment = 4;
  bytes stdin = 6;
  bool tty = 7;
  uint32 cols = 8;
  uint32 rows = 9;
  bool no_login_shell = 10;
  string request_id = 11;
  WorkspaceSelector workspace_scope = 12;
  google.protobuf.Duration execution_timeout = 105;
}

message ExecSandboxStdout { bytes data = 1; }

message ExecSandboxStderr { bytes data = 1; }

message ExecSandboxExit { int32 exit_code = 1; }

message ExecSandboxEvent {
  oneof payload {
    ExecSandboxStdout stdout = 1;
    ExecSandboxStderr stderr = 2;
    ExecSandboxExit exit = 3;
  }
}

