packages:
  - apps/controller
  - packages/utils
  - packages/contracts
  - packages/occ
  - packages/iam
  - packages/audit
  - "!legacy/**"

# Wait seven days before accepting registry releases, including locked versions.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
verifyDepsBeforeRun: error

allowBuilds:
  esbuild: true
  protobufjs: true
