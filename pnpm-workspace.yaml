packages:
  - apps/controller
  - packages/utils
  - packages/contracts
  - packages/occ
  - packages/iam
  - packages/audit
  - "!legacy/**"

# Running scripts must not implicitly reinstall the prepared dependency graph.
verifyDepsBeforeRun: false

# Wait seven days before accepting registry releases, including locked versions.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false

allowBuilds:
  esbuild: true
  protobufjs: true
