[package]
name = "strands-credential-proxy"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"

[dependencies]
strands-box-egress-gateway = { path = "build-input/strands-box/crates/egress-gateway", features = ["request-exchange"] }
strands-box-policy = { path = "build-input/strands-box/crates/policy", features = ["egress-adapter"] }
anyhow = "1"
base64 = "0.22"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "client", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
prost = "0.14"
prost-types = "0.14"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time", "io-util", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-stream = "0.1"
tonic = { version = "0.14", features = ["tls-ring"] }
tonic-prost = "0.14"
uuid = { version = "1", features = ["v4", "v7"] }
webpki-roots = "1"
zeroize = "1"

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
rcgen = "0.14"
tempfile = "3"

[profile.distribution]
inherits = "dev"
debug = 0
incremental = false
strip = "debuginfo"
