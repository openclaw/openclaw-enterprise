  <text class="section" x="48" y="136">OCE INSTALLATION</text>
  <text class="small" x="1032" y="136" text-anchor="end">Namespace boundaries isolate tenants</text>

  <rect class="plane" x="48" y="166" width="480" height="402" rx="6"/>
  <text class="heading" x="72" y="201">Control plane</text>
  <rect class="platform" x="72" y="224" width="196" height="94" rx="6"/>
  <text class="label" x="88" y="257">API and console</text>
  <text class="body" x="88" y="289">Desired state</text>
  <rect class="platform" x="308" y="224" width="196" height="94" rx="6"/>
  <text class="label" x="326" y="257">Worker</text>
  <text class="body" x="326" y="289">Claims work</text>
  <rect class="platform" x="72" y="420" width="196" height="110" rx="6"/>
  <text class="label" x="88" y="454">PostgreSQL</text>
  <text class="body" x="88" y="485">Persistent state</text>
  <text class="body" x="88" y="510">and work</text>
  <rect class="platform" x="308" y="420" width="196" height="70" rx="6"/>
  <text class="label" x="326" y="462">Compute Driver</text>

  <rect class="plane" x="576" y="166" width="456" height="402" rx="6"/>
  <text class="heading" x="600" y="201">Data plane</text>
  <rect class="boundary" x="600" y="224" width="408" height="198" rx="6"/>
  <text class="label" x="620" y="252">Agent workload</text>
  <rect class="runtime" x="614" y="267" width="380" height="140" rx="6"/>
  <text class="body" x="630" y="292" font-weight="700">Sandbox</text>
  <rect class="boundary" x="628" y="304" width="352" height="89" rx="6"/>
  <text class="label" x="644" y="332">Harness</text>
  <text class="body" x="644" y="358">Model and tool execution</text>
  <text class="small" x="644" y="382">Workspace and secrets</text>
