<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-labelledby="title description">
  <title id="title">OpenClaw Enterprise target architecture</title>
  <desc id="description">The OCE Installation contains the control plane on the left and data plane on the right. The control plane contains the API and console, PostgreSQL, worker, and Compute Driver. Compute manages an Agent workload containing a Sandbox and Harness. Tool Gateway and Agent Identity are planned additions below the workload. Inference and tools sit to the right of the Installation. Model Registry and Router are planned. A planned shared context layer and an observability and audit layer span the width below the Installation. Application tracing is planned. Dashed borders and arrows mark planned components and connections.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#66717d"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #202a35; }
      .heading { font-size: 24px; font-weight: 700; }
      .label { font-size: 21px; font-weight: 700; }
      .body { font-size: 18px; }
      .small { font-size: 16px; fill: #536171; }
      .section { font-size: 17px; font-weight: 700; letter-spacing: 2px; }
      .boundary { fill: #fff; stroke: #aab5bf; stroke-width: 1.5; }
      .plane { fill: #f6f8fa; stroke: #c6cfd7; stroke-width: 1.5; }
      .platform { fill: #e8eef5; stroke: #7d91a8; stroke-width: 1.5; }
      .runtime { fill: #e4efeb; stroke: #78968b; stroke-width: 1.5; }
      .external { fill: #f2eef5; stroke: #95859f; stroke-width: 1.5; }
      .planned { fill: #f3f4f6; stroke: #7f8c9b; stroke-width: 1.5; stroke-dasharray: 6 5; }
      .connection { fill: none; stroke: #66717d; stroke-width: 2; marker-end: url(#arrow); }
      .pending { stroke-dasharray: 6 5; }
      .badge { font-size: 16px; font-weight: 700; fill: #536171; }
    </style>
  </defs>
  <rect width="1500" height="850" fill="#fff"/>

