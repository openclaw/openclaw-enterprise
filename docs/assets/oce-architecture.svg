  <text class="heading" x="1144" y="451">Tools and integrations</text>
  <text class="body" x="1144" y="496">MCP servers</text>
  <text class="body" x="1144" y="529">Custom and third-party tools</text>

  <path class="connection" d="M 178 72 V 86 H 36 V 271 H 72"/>
  <path class="connection" d="M 170 318 V 420"/>
  <text class="small" x="182" y="371">commit</text>
  <path class="connection" d="M 268 478 H 288 V 271 H 308" marker-start="url(#arrow)"/>
  <path class="connection" d="M 406 318 V 420"/>
  <path class="connection" d="M 504 455 H 552 V 352 H 600"/>
  <text class="small" x="552" y="340" text-anchor="middle">lifecycle</text>
