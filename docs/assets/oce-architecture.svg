  <text class="badge" x="830" y="522">Planned</text>

  <rect class="external" x="1120" y="166" width="356" height="206" rx="6"/>
  <text class="heading" x="1144" y="203">Inference</text>
  <rect class="planned" x="1140" y="224" width="316" height="76" rx="5"/>
