  <path class="connection pending" d="M 911 470 V 422"/>
  <path class="connection pending" d="M 980 327 H 1088 V 262 H 1140"/>
  <path class="connection pending" d="M 1298 300 V 320"/>
  <path class="connection pending" d="M 697 538 V 552 H 1090 V 491 H 1120"/>

  <rect class="planned" x="24" y="614" width="1032" height="88" rx="6"/>
  <text class="heading" x="48" y="647">Context</text>
  <text class="badge" x="1032" y="647" text-anchor="end">Shared context layer · Planned</text>
  <text class="body" x="48" y="681">Knowledge retrieval and grounding</text>
  <text class="body" x="600" y="681">Session history and long-term memory</text>

  <rect class="runtime" x="24" y="720" width="1032" height="88" rx="6"/>
  <text class="heading" x="48" y="753">Observability and audit</text>
  <text class="small" x="1032" y="753" text-anchor="end">Control plane · Agents · inference · tools · context</text>
  <text class="body" x="48" y="787">Metrics and logs · Traces planned</text>
  <text class="small" x="1032" y="787" text-anchor="end">Coverage extends as planned services are added</text>

  <path class="connection pending" d="M 1120 633 H 1174"/>
