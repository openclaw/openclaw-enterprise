name: Set up test Docker
description: Install the Docker version required by the production Fluentd logging options.
inputs:
  setup-buildx:
    description: Set to 'false' to skip creating the Buildx builder.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Stop the preinstalled Docker daemon
      shell: bash
      run: sudo systemctl stop docker.service docker.socket
    - name: Install pinned Docker Engine
      id: engine
      uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6 # v5.7.0
      with:
        version: v29.9.2
        set-host: true
    - name: Expose the daemon at the production socket path
      shell: bash
      env:
        TEST_DOCKER_SOCKET_URL: ${{ steps.engine.outputs.sock }}
      run: |
        docker_socket_path="${TEST_DOCKER_SOCKET_URL#unix://}"
        test -S "$docker_socket_path"
        # Production Compose mounts this socket; CLI and controller must use one daemon.
        sudo ln -sfn "$docker_socket_path" /var/run/docker.sock
        test "$(docker version --format '{{.Server.Version}}')" = "29.9.2"
    # GitHub-hosted and Blacksmith runners are per-job VMs, so skip the builder
    # removal (it ran before Docker stopped, 8-33 s); a persistent runner would
    # accumulate buildx_buildkit_* containers.
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      if: ${{ inputs.setup-buildx != 'false' }}
      with:
        cleanup: false
