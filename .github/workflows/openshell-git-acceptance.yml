name: OpenShell Git Acceptance

# Opt-in and advisory: occ dev up's OpenShell Git route against stock OpenShell 0.1.4, a
# synthetic GitHub origin and a stand-in model. Not a required check and not part of Full
# Integration's aggregate until its runtime and stability are known on hosted runners.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openshell-git-acceptance-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: "1"
  NODE_VERSION: "24.16.0"

jobs:
  acceptance:
    name: OpenShell Git route acceptance
    # Sandboxes need Landlock ABI v3 (Linux 6.2+); hosted Ubuntu 22.04 runners run a 6.x kernel.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/setup-pnpm-store-cache
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-mode: restore
      - run: pnpm install --frozen-lockfile
      - name: Set up CI tools
        run: bash scripts/ci/setup-tools.sh k3d
      - name: Pull Docker Hub images through a mirror
        run: bash scripts/ci/docker-hub-mirror.sh setup
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cleanup: false
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Enable Kubernetes bridge packet filtering
        run: |
          if [[ ! -e /proc/sys/net/bridge/bridge-nf-call-iptables ]]; then
            sudo modprobe br_netfilter
          fi
          sudo sysctl -w net.bridge.bridge-nf-call-iptables=1
      - name: Build OCC CLI
        run: go build -trimpath -o bin/occ ./cmd/occ
      - name: Build checkout images
        run: node scripts/ci/first-agent-smoke.mjs prepared-git-images
      - name: Clone, push, draft, refusal and withdrawal through the route
        env:
          OCC_DEVELOPMENT_K3S_IMAGE: docker.io/rancher/k3s:v1.35.9-k3s1@sha256:ec9868c6a38d4e8c1869832fb5fd1eb8473c39794a0b44d2b952e7ba911951bc
        run: node scripts/ci/openshell-git-installed.mjs
      - name: Upload the acceptance receipt
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: openshell-git-installed
          path: ${{ runner.temp }}/results/openshell-git-installed.json
          if-no-files-found: error
          retention-days: 7
