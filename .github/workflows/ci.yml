name: CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "1"
  NODE_VERSION: "24.16.0"

jobs:
  audit:
    name: Suite Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Set up workflow tools
        run: bash scripts/ci/setup-tools.sh workflows
      - name: Lint workflow definitions
        run: actionlint .github/workflows/*.yml
      - name: Audit suite manifest and workflows
        run: node scripts/ci/run-tests.mjs audit

  pr-safe:
    name: ${{ matrix.title }}
    runs-on: ubuntu-24.04
    needs: audit
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: checks-baseline
            title: Checks, Conformance, Browser
            profile: baseline
            timeout: 25
          - lane: postgres
            title: PostgreSQL
            profile: postgres
            timeout: 25
          - lane: images-packaging
            title: Images and Packaging
            profile: images
            timeout: 45
          - lane: k3d-fixture-configuration
            title: k3d Fixture and Configuration
            profile: k3d
            timeout: 45
          - lane: logging-collector
            title: Logging Collector
            profile: images
            timeout: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/run-ci-lane
        with:
          lane: ${{ matrix.lane }}
          profile: ${{ matrix.profile }}
          node-version: ${{ env.NODE_VERSION }}
          artifact-prefix: ci-results

  ci-required:
    name: CI Required
    runs-on: ubuntu-24.04
    needs:
      - audit
      - pr-safe
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: ci-results-*
          path: ${{ runner.temp }}/results
          merge-multiple: true
      - name: Write selected job state
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const needs = JSON.parse(process.env.NEEDS_JSON);
          const lanes = ["checks-baseline", "postgres", "images-packaging", "k3d-fixture-configuration", "logging-collector"];
          const expanded = { audit: needs.audit };
          for (const lane of lanes) {
            expanded[lane] = { result: needs["pr-safe"]?.result ?? "missing" };
          }
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/needs.json`, JSON.stringify(expanded));
          NODE
      - name: Aggregate CI results
        run: node scripts/ci/run-tests.mjs aggregate ci --results-dir "$RUNNER_TEMP/results" --needs "$RUNNER_TEMP/needs.json"
