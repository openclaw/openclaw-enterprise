name: CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "1"
  NODE_VERSION: "24.16.0"

jobs:
  impact:
    name: CI Impact
    runs-on: ubuntu-22.04
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      lanes: ${{ steps.select.outputs.lanes }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      fixture: ${{ steps.matrix.outputs.fixture }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: select
        env:
          IMPACT_ACTION: select
        run: |
          # The workflow itself is PR-controlled; independent required-workflow
          # enforcement is needed to protect this bootstrap from workflow edits.
          policy=$(mktemp "$RUNNER_TEMP/ci-impact-policy.XXXXXX.mjs")
          trap 'rm -f "$policy"' EXIT
          trusted_policy() {
            reason=bootstrap_non_pr_event
            [ "${GITHUB_EVENT_NAME:-}" = pull_request ] || return 1
            reason=bootstrap_event_unavailable
            base=$(jq -er '.pull_request.base.sha | select(type == "string")' "$GITHUB_EVENT_PATH") || return 1
            head=$(jq -er '.pull_request.head.sha | select(type == "string")' "$GITHUB_EVENT_PATH") || return 1
            reason=bootstrap_invalid_identity
            oid='^([0-9a-f]{40}|[0-9a-f]{64})$'
            [[ $base =~ $oid && $head =~ $oid && ${GITHUB_SHA:-} =~ $oid ]] || return 1
            reason=bootstrap_git_inspection_failed
            actual=$(git rev-parse --verify 'HEAD^{commit}') || return 1
            reason=bootstrap_checkout_mismatch
            [ "$actual" = "$GITHUB_SHA" ] || return 1
            reason=bootstrap_git_inspection_failed
            parents=$(git show -s --format=%P "$GITHUB_SHA") || return 1
            reason=bootstrap_checkout_mismatch
            [[ $parents =~ ^([0-9a-f]{40}|[0-9a-f]{64})\ ([0-9a-f]{40}|[0-9a-f]{64})$ ]] || return 1
            [ "${BASH_REMATCH[2]}" = "$head" ] || return 1
            merge_base=${BASH_REMATCH[1]}
            reason=bootstrap_git_inspection_failed
            git cat-file -e "$merge_base^{commit}" && git cat-file -e "$head^{commit}" || return 1
            # GitHub merges onto the base tip at merge time; base.sha lags it
            # when the base moved after the push and is then not fetched.
            reason=bootstrap_checkout_mismatch
            if [ "$base" != "$merge_base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
              git merge-base --is-ancestor "$base" "$merge_base" || return 1
            fi
            reason=bootstrap_git_inspection_failed
            entry=$(git ls-tree "$merge_base" -- scripts/ci/impact.mjs) || return 1
            reason=bootstrap_policy_unavailable
            [[ $entry =~ ^100644\ blob\ ([0-9a-f]{40}|[0-9a-f]{64})[[:space:]]scripts/ci/impact\.mjs$ ]] || return 1
            reason=bootstrap_git_inspection_failed
            git cat-file blob "${BASH_REMATCH[1]}" > "$policy" || return 1
            reason=bootstrap_policy_unavailable
            [ -s "$policy" ]
          }
          if trusted_policy; then
            if [ "$IMPACT_ACTION" = select ]; then
              node "$policy" --github-output "$GITHUB_OUTPUT"
            elif [ "$EXPECTED_MODE" = tests ]; then
              node "$policy" --verify-mode tests --lanes "$EXPECTED_LANES"
            else
              node "$policy" --verify-mode "$EXPECTED_MODE"
            fi
          elif [ "$IMPACT_ACTION" = select ]; then
            printf 'CI impact: full (trusted base policy unavailable)\n'
            printf 'mode=full\nreason=%s\n' "$reason" >> "$GITHUB_OUTPUT"
          else
            [ "$EXPECTED_MODE" = full ] || exit 1
            printf 'CI impact: full (trusted base policy unavailable)\n'
          fi

      # One row per pr-safe lane (runtime-image-fixture is its own job). Full
      # mode runs every row; tests mode runs the rows the policy selected.
      # The baseline tests are split in two, balanced by measured file
      # durations; only part 1 runs the type and Go CLI checks (Static Checks
      # runs lint, format, OpenAPI and docs beside the lanes).
      # Image Runtime Startup is split from Images and Packaging, which it
      # would otherwise lengthen by about five minutes. The runtime image
      # startup tests are split in two, balanced by measured case durations;
      # only part 1 runs the Codex sandbox, so only it needs the k3d tools for
      # the seccomp profile.
      # Runners: the k3d fixture and observability lanes use blacksmith
      # 32vcpu (8 CPUs). Its kernel enforces the NetworkPolicy proofs: with
      # K3s policy enforcement disabled, production-network-access fails
      # every deny case there. It ran these lanes about a minute faster than
      # ubuntu-22.04 (4 CPUs). Both Image Runtime Startup lanes use 32vcpu
      # too: their preparation is faster there, and Startup 2 runs its three
      # files at once. Image Model Probes stays on 16vcpu: its one case waits
      # out the 110 s model probe cap at 500m on any runner. The other lanes
      # use blacksmith 16vcpu, which exposes 4 CPUs to the job (8vcpu exposes
      # 2) and rarely waits for a runner (on 10-08/09, 15 % of 8vcpu jobs
      # waited over a minute, none on 16vcpu). A label no runner serves
      # leaves the job queued, so use only labels already in use here.
      - id: matrix
        name: Build lane matrix
        env:
          SELECT_MODE: ${{ steps.select.outputs.mode }}
          SELECT_LANES: ${{ steps.select.outputs.lanes }}
          LANE_TABLE: |
            [
              {"lane": "checks-baseline-1", "title": "Checks and Conformance 1", "profile": "baseline", "timeout": 25, "runner": "blacksmith-16vcpu-ubuntu-2404"},
              {"lane": "checks-baseline-2", "title": "Checks and Conformance 2", "profile": "baseline", "timeout": 25, "runner": "blacksmith-16vcpu-ubuntu-2404"},
              {"lane": "checks-browser", "title": "Console Browser", "profile": "baseline", "timeout": 25, "runner": "blacksmith-16vcpu-ubuntu-2404"},
              {"lane": "checks-browser-2", "title": "Console Browser 2", "profile": "baseline", "timeout": 25, "runner": "blacksmith-16vcpu-ubuntu-2404"},
              {"lane": "postgres", "title": "PostgreSQL Migrations", "profile": "postgres", "timeout": 25, "runner": "blacksmith-16vcpu-ubuntu-2404"},
              {"lane": "postgres-application", "title": "PostgreSQL Application", "profile": "postgres", "timeout": 25, "runner": "blacksmith-16vcpu-ubuntu-2404"},
              {"lane": "postgres-auth", "title": "PostgreSQL Authentication", "profile": "postgres", "timeout": 25, "runner": "blacksmith-16vcpu-ubuntu-2404"},
              {"lane": "postgres-platform", "title": "PostgreSQL Platform", "profile": "postgres", "timeout": 25, "runner": "blacksmith-16vcpu-ubuntu-2404"},
              {"lane": "images-packaging", "title": "Images and Packaging", "profile": "full", "timeout": 45, "runner": "blacksmith-16vcpu-ubuntu-2404"},
              {"lane": "images-model-probes", "title": "Image Model Probes", "profile": "images", "timeout": 25, "runner": "blacksmith-16vcpu-ubuntu-2404"},
              {"lane": "images-runtime-startup", "title": "Image Runtime Startup", "profile": "full", "timeout": 30, "runner": "blacksmith-32vcpu-ubuntu-2404"},
              {"lane": "images-runtime-startup-2", "title": "Image Runtime Startup 2", "profile": "images", "timeout": 30, "runner": "blacksmith-32vcpu-ubuntu-2404"},
              {"lane": "k3d-fixture-configuration", "title": "k3d Fixture and Configuration", "profile": "k3d", "timeout": 45, "runner": "blacksmith-32vcpu-ubuntu-2404"},
              {"lane": "k3d-fixture-state", "title": "k3d State and Lifecycle", "profile": "k3d", "timeout": 45, "runner": "blacksmith-32vcpu-ubuntu-2404"},
              {"lane": "k3d-fixture-plugins", "title": "k3d Plugin Status", "profile": "k3d", "timeout": 45, "runner": "blacksmith-32vcpu-ubuntu-2404"},
              {"lane": "k3d-observability", "title": "Production Observability", "profile": "k3d", "timeout": 45, "runner": "blacksmith-32vcpu-ubuntu-2404"},
              {"lane": "logging-collector", "title": "Logging Collector", "profile": "images", "timeout": 30, "runner": "blacksmith-16vcpu-ubuntu-2404"},
              {"lane": "repository-credentials-container", "title": "Repository Credentials", "profile": "images", "timeout": 40, "runner": "blacksmith-16vcpu-ubuntu-2404"},
              {"lane": "repository-credentials-platform", "title": "Repository Credentials Platform", "profile": "k3d", "timeout": 60, "runner": "blacksmith-16vcpu-ubuntu-2404"}
            ]
        run: |
          table=$(jq -ce 'if type == "array" and length > 0 then . else error("invalid lane table") end' <<<"$LANE_TABLE")
          if [ "$SELECT_MODE" = tests ]; then
            lanes=$(jq -ce 'if type == "array" and length > 0 and all(.[]; type == "string") then . else error("invalid lanes") end' <<<"$SELECT_LANES")
            # Every selected lane needs a runner; CI Required checks each one's results.
            jq -e --argjson table "$table" 'all(.[]; . as $lane | $lane == "runtime-image-fixture" or ($table | any(.[]; .lane == $lane)))' <<<"$lanes" >/dev/null
            matrix=$(jq -ce --argjson lanes "$lanes" '[.[] | select(.lane as $lane | $lanes | any(.[]; . == $lane))] | if length > 0 then . else error("no matrix lanes") end' <<<"$table")
            fixture=$(jq -r 'if any(.[]; . == "runtime-image-fixture") then "true" else "false" end' <<<"$lanes")
          else
            matrix=$table
            fixture=true
          fi
          printf 'matrix=%s\nfixture=%s\n' "$matrix" "$fixture" >> "$GITHUB_OUTPUT"

      - name: Summarize impact selection
        if: ${{ always() }}
        env:
          SELECT_OUTCOME: ${{ steps.select.outcome }}
          SELECT_MODE: ${{ steps.select.outputs.mode }}
          SELECT_REASON: ${{ steps.select.outputs.reason }}
          SELECT_LANES: ${{ steps.select.outputs.lanes }}
          MATRIX_OUTCOME: ${{ steps.matrix.outcome }}
        run: |
          # Output only fixed literals, even when workflow inputs are untrusted.
          mode=unavailable
          reason=unavailable
          if [ "$SELECT_OUTCOME" = success ]; then
            case "$SELECT_MODE" in
              docs|full|tests) mode="$SELECT_MODE" ;;
            esac
            case "$mode:$SELECT_REASON" in
              docs:docs_only) reason=docs_only ;;
              tests:tests_only) reason=tests_only ;;
              full:non_pr_event) reason=non_pr_event ;;
              full:bootstrap_non_pr_event) reason=bootstrap_non_pr_event ;;
              full:invalid_event) reason=invalid_event ;;
              full:invalid_identity) reason=invalid_identity ;;
              full:event_unavailable) reason=event_unavailable ;;
              full:bootstrap_event_unavailable) reason=bootstrap_event_unavailable ;;
              full:bootstrap_invalid_identity) reason=bootstrap_invalid_identity ;;
              full:checkout_mismatch) reason=checkout_mismatch ;;
              full:bootstrap_checkout_mismatch) reason=bootstrap_checkout_mismatch ;;
              full:git_inspection_failed) reason=git_inspection_failed ;;
              full:bootstrap_git_inspection_failed) reason=bootstrap_git_inspection_failed ;;
              full:bootstrap_policy_unavailable) reason=bootstrap_policy_unavailable ;;
              full:malformed_diff) reason=malformed_diff ;;
              full:empty_diff) reason=empty_diff ;;
              full:unsupported_change) reason=unsupported_change ;;
              full:filename_not_utf8) reason=filename_not_utf8 ;;
              full:ineligible_change) reason=ineligible_change ;;
              full:manifest_change) reason=manifest_change ;;
              full:manifest_unavailable) reason=manifest_unavailable ;;
              full:unmapped_test) reason=unmapped_test ;;
              full:referenced_test) reason=referenced_test ;;
            esac
          fi
          lanes=
          if [ "$mode:$reason" = tests:tests_only ]; then
            lanes=unavailable
            # Only lane names the matrix step accepted; never raw selector output.
            if [ "$MATRIX_OUTCOME" = success ] && [[ $SELECT_LANES =~ ^\[\"[a-z0-9-]+\"(,\"[a-z0-9-]+\")*\]$ ]]; then
              lanes=$(jq -r 'join(", ")' <<<"$SELECT_LANES")
            fi
          fi
          {
            printf '### CI impact selection (advisory)\n\n'
            printf 'Mode: %s\n\n' "$mode"
            printf 'Reason category: %s\n\n' "$reason"
            if [ -n "$lanes" ]; then
              printf 'Selected lanes: %s\n\n' "$lanes"
            fi
            printf 'This PR-controlled workflow is not trusted enforcement.\n'
          } >> "$GITHUB_STEP_SUMMARY"

  native-images:
    name: Native Container Verification
    if: ${{ github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/container-check.yml
    with:
      source_sha: ${{ github.sha }}
      ci_run_id: ${{ github.run_id }}
      ci_attempt: ${{ github.run_attempt }}
      node_base_image: ${{ vars.CONTAINER_NODE_BASE_IMAGE }}

  audit:
    name: Suite Audit
    # 16vcpu rarely waits for a runner (see the CI Impact lane table).
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Set up workflow tools
        run: bash scripts/ci/setup-tools.sh workflows
      - name: Lint workflow definitions
        run: actionlint .github/workflows/*.yml
      - name: Audit suite manifest and workflows
        run: node scripts/ci/run-tests.mjs audit

  static-checks:
    name: Static Checks
    needs: impact
    # Workspace boundary, lint, format, OpenAPI and documentation checks need no
    # test fixture, so they run beside the test lanes in every mode instead of
    # before Checks and Conformance 1's tests (about 40 s of its critical path).
    if: ${{ needs.impact.outputs.mode == 'docs' || needs.impact.outputs.mode == 'full' || needs.impact.outputs.mode == 'tests' }}
    # 16vcpu rarely waits for a runner (see the CI Impact lane table).
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify checkout source
        run: test "$(git rev-parse --verify 'HEAD^{commit}')" = "$GITHUB_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: ./.github/actions/setup-pnpm-store-cache
        with:
          node-version: ${{ env.NODE_VERSION }}
          # This job only restores the store; it has no save step.
          cache-mode: restore
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run workspace boundary check
        run: pnpm check:workspace
      - name: Run lint check
        run: pnpm lint
      - name: Check formatting
        run: pnpm format:check
      - name: Run OpenAPI check
        run: pnpm openapi:check
      - name: Check and build documentation
        run: pnpm docs:install && pnpm docs:check && pnpm docs:build

  affected-packages:
    name: Affected Packages (advisory)
    needs: impact
    if: ${{ github.event_name == 'pull_request' && needs.impact.outputs.mode == 'full' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: ./.github/actions/setup-pnpm-store-cache
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-mode: "off"
      - name: Report affected workspace packages
        if: ${{ always() }}
        run: |
          # Print to the log too: step summaries are not readable through the API.
          report=$(node scripts/ci/pnpm-impact.mjs --summary) || report='Affected workspace packages: unavailable.'
          printf '%s\n' "$report"
          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            printf '%s\n' "$report" >> "$GITHUB_STEP_SUMMARY" || true
          fi

  pr-safe:
    name: ${{ matrix.title }}
    needs: impact
    if: ${{ needs.impact.outputs.mode == 'full' || needs.impact.outputs.mode == 'tests' }}
    # Each CI Impact lane-table row names its runner.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        # Lane rows live in the CI Impact "Build lane matrix" step.
        include: ${{ fromJSON(needs.impact.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/run-ci-lane
        with:
          lane: ${{ matrix.lane }}
          profile: ${{ matrix.profile }}
          node-version: ${{ env.NODE_VERSION }}
          artifact-prefix: ci-results
          # Static Checks runs them in this workflow.
          static-checks: "false"
      - name: Upload repository credential image identities
        if: always() && matrix.lane == 'repository-credentials-container'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-repository-credentials-images
          path: ${{ runner.temp }}/state/repository-credentials-images.json
          if-no-files-found: error
          retention-days: 7

  runtime-image-fixture:
    name: Runtime Image Fixture
    needs: impact
    if: ${{ needs.impact.outputs.mode == 'full' || (needs.impact.outputs.mode == 'tests' && needs.impact.outputs.fixture == 'true') }}
    # GitHub-hosted jobs receive a fresh VM and the job's existing Docker engine.
    # Only this lane writes fixture tags; its process awaits each Docker command.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # The fixture builds FROM a Docker Hub base image on the Engine's own
      # builder; pull it through mirror.gcr.io without the runner's Docker Hub
      # sign-in (finding 977).
      - name: Pull Docker Hub images through a mirror
        run: bash scripts/ci/docker-hub-mirror.sh setup
      - uses: ./.github/actions/run-ci-lane
        with:
          lane: runtime-image-fixture
          profile: postgres
          node-version: ${{ env.NODE_VERSION }}
          artifact-prefix: ci-results
      - name: Show Docker Hub pull endpoints
        if: ${{ !cancelled() }}
        run: bash scripts/ci/docker-hub-mirror.sh report

  # Real Keycloak OIDC proof in full-mode PR CI and on pushes to main.
  # Deliberately not a CI Required dependency until it has soaked on main.
  keycloak-oidc:
    name: Keycloak OIDC
    needs: impact
    if: ${{ needs.impact.outputs.mode == 'full' }}
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/run-ci-lane
        with:
          lane: keycloak-oidc
          profile: postgres
          node-version: ${{ env.NODE_VERSION }}
          artifact-prefix: keycloak-results

  # Real Local Setup install on every PR and merge, with a stand-in model
  # provider and no secrets. Deliberately not a CI Required dependency yet.
  first-agent-smoke:
    name: First Agent Smoke
    needs: impact
    if: ${{ needs.impact.outputs.mode == 'full' }}
    # Local Setup refuses gateway trust unless NetworkPolicies are enforced,
    # which needs the bridge netfilter support of this runner kernel.
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      # The runner starts with about 90 GB free; the smoke uses far less, so it
      # skips the SDK removal the large image lanes need.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up CI tools
        run: bash scripts/ci/setup-tools.sh k3d
      # Pull Docker Hub images through mirror.gcr.io without the runner's
      # Docker Hub sign-in (finding 973). This restarts the Engine, so it runs
      # before Buildx starts its builder container.
      - name: Pull Docker Hub images through a mirror
        run: bash scripts/ci/docker-hub-mirror.sh setup
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # GitHub-hosted runners are per-job VMs; removing the builder took 8-33 s,
          # which a superseding run also waits for on cancellation.
          cleanup: false
          # The builder container pulls base images itself, not through the engine.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Enable Kubernetes bridge packet filtering
        run: |
          if [[ ! -e /proc/sys/net/bridge/bridge-nf-call-iptables ]]; then
            sudo modprobe br_netfilter
          fi
          sudo sysctl -w net.bridge.bridge-nf-call-iptables=1
      - name: Build OCC CLI
        run: go build -trimpath -o bin/occ ./cmd/occ
      - name: Expose image cache credentials
        id: image-cache
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const token = process.env.ACTIONS_RUNTIME_TOKEN;
            const url = process.env.ACTIONS_RESULTS_URL;
            if (!token || !url) {
              throw new Error('GitHub Actions cache credentials are unavailable');
            }
            core.setSecret(token);
            core.setOutput('token', token);
            core.setOutput('url', url);
      - name: Build checkout images
        env:
          ACTIONS_RUNTIME_TOKEN: ${{ steps.image-cache.outputs.token }}
          ACTIONS_RESULTS_URL: ${{ steps.image-cache.outputs.url }}
        run: node scripts/ci/first-agent-smoke.mjs images
      - name: Install, deploy, chat, stop and start
        run: node scripts/ci/first-agent-smoke.mjs run
      - name: Show Docker Hub pull endpoints
        if: ${{ !cancelled() }}
        run: bash scripts/ci/docker-hub-mirror.sh report

  ci-required:
    name: CI Required
    runs-on: ubuntu-22.04
    needs:
      - impact
      - audit
      - static-checks
      - pr-safe
      - runtime-image-fixture
    # always(): a failed or skipped dependency must still produce a failed
    # CI Required, never a skipped (passing) one.
    if: always()
    steps:
      # A push that supersedes this run waits until this run has finished
      # cancelling. cancelled() is false in a job that starts after the
      # cancellation, so test the dependencies: fail at once instead of checking
      # out and verifying jobs that never finished. Later steps then skip.
      - name: Fail when a required job was cancelled
        if: contains(needs.*.result, 'cancelled')
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          jq -r 'to_entries[] | select(.value.result == "cancelled") | "::error::\(.key) was cancelled (superseded run, manual cancel, or timeout-minutes exceeded; see that job)."' <<<"$NEEDS_JSON"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify selected mode
        env:
          IMPACT_ACTION: verify
          EXPECTED_MODE: ${{ needs.impact.outputs.mode }}
          EXPECTED_LANES: ${{ needs.impact.outputs.lanes }}
        run: |
          # The workflow itself is PR-controlled; independent required-workflow
          # enforcement is needed to protect this bootstrap from workflow edits.
          policy=$(mktemp "$RUNNER_TEMP/ci-impact-policy.XXXXXX.mjs")
          trap 'rm -f "$policy"' EXIT
          trusted_policy() {
            reason=bootstrap_non_pr_event
            [ "${GITHUB_EVENT_NAME:-}" = pull_request ] || return 1
            reason=bootstrap_event_unavailable
            base=$(jq -er '.pull_request.base.sha | select(type == "string")' "$GITHUB_EVENT_PATH") || return 1
            head=$(jq -er '.pull_request.head.sha | select(type == "string")' "$GITHUB_EVENT_PATH") || return 1
            reason=bootstrap_invalid_identity
            oid='^([0-9a-f]{40}|[0-9a-f]{64})$'
            [[ $base =~ $oid && $head =~ $oid && ${GITHUB_SHA:-} =~ $oid ]] || return 1
            reason=bootstrap_git_inspection_failed
            actual=$(git rev-parse --verify 'HEAD^{commit}') || return 1
            reason=bootstrap_checkout_mismatch
            [ "$actual" = "$GITHUB_SHA" ] || return 1
            reason=bootstrap_git_inspection_failed
            parents=$(git show -s --format=%P "$GITHUB_SHA") || return 1
            reason=bootstrap_checkout_mismatch
            [[ $parents =~ ^([0-9a-f]{40}|[0-9a-f]{64})\ ([0-9a-f]{40}|[0-9a-f]{64})$ ]] || return 1
            [ "${BASH_REMATCH[2]}" = "$head" ] || return 1
            merge_base=${BASH_REMATCH[1]}
            reason=bootstrap_git_inspection_failed
            git cat-file -e "$merge_base^{commit}" && git cat-file -e "$head^{commit}" || return 1
            # GitHub merges onto the base tip at merge time; base.sha lags it
            # when the base moved after the push and is then not fetched.
            reason=bootstrap_checkout_mismatch
            if [ "$base" != "$merge_base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
              git merge-base --is-ancestor "$base" "$merge_base" || return 1
            fi
            reason=bootstrap_git_inspection_failed
            entry=$(git ls-tree "$merge_base" -- scripts/ci/impact.mjs) || return 1
            reason=bootstrap_policy_unavailable
            [[ $entry =~ ^100644\ blob\ ([0-9a-f]{40}|[0-9a-f]{64})[[:space:]]scripts/ci/impact\.mjs$ ]] || return 1
            reason=bootstrap_git_inspection_failed
            git cat-file blob "${BASH_REMATCH[1]}" > "$policy" || return 1
            reason=bootstrap_policy_unavailable
            [ -s "$policy" ]
          }
          if trusted_policy; then
            if [ "$IMPACT_ACTION" = select ]; then
              node "$policy" --github-output "$GITHUB_OUTPUT"
            elif [ "$EXPECTED_MODE" = tests ]; then
              node "$policy" --verify-mode tests --lanes "$EXPECTED_LANES"
            else
              node "$policy" --verify-mode "$EXPECTED_MODE"
            fi
          elif [ "$IMPACT_ACTION" = select ]; then
            printf 'CI impact: full (trusted base policy unavailable)\n'
            printf 'mode=full\nreason=%s\n' "$reason" >> "$GITHUB_OUTPUT"
          else
            [ "$EXPECTED_MODE" = full ] || exit 1
            printf 'CI impact: full (trusted base policy unavailable)\n'
          fi
      - name: Validate selected job state
        if: ${{ !cancelled() && !contains(needs.*.result, 'cancelled') }}
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
          EXPECTED_MODE: ${{ needs.impact.outputs.mode }}
          EXPECTED_LANES: ${{ needs.impact.outputs.lanes }}
        run: |
          printf '%s' "$NEEDS_JSON" > "$RUNNER_TEMP/raw-needs.json"
          if [ "$EXPECTED_MODE" = tests ]; then
            node scripts/ci/impact-gate.mjs --needs "$RUNNER_TEMP/raw-needs.json" --mode tests --output "$RUNNER_TEMP/needs.json" --lanes "$EXPECTED_LANES"
          else
            node scripts/ci/impact-gate.mjs --needs "$RUNNER_TEMP/raw-needs.json" --mode "$EXPECTED_MODE" --output "$RUNNER_TEMP/needs.json"
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: ${{ !cancelled() && !contains(needs.*.result, 'cancelled') && (needs.impact.outputs.mode == 'full' || needs.impact.outputs.mode == 'tests') }}
        with:
          pattern: ci-results-*
          path: ${{ runner.temp }}/results
          merge-multiple: true
      - name: Aggregate CI results
        if: ${{ !cancelled() && !contains(needs.*.result, 'cancelled') && (needs.impact.outputs.mode == 'full' || needs.impact.outputs.mode == 'tests') }}
        env:
          EXPECTED_MODE: ${{ needs.impact.outputs.mode }}
          EXPECTED_LANES: ${{ needs.impact.outputs.lanes }}
        run: |
          if [ "$EXPECTED_MODE" = tests ]; then
            node scripts/ci/run-tests.mjs aggregate ci --results-dir "$RUNNER_TEMP/results" --needs "$RUNNER_TEMP/needs.json" --lanes "$EXPECTED_LANES"
          else
            node scripts/ci/run-tests.mjs aggregate ci --results-dir "$RUNNER_TEMP/results" --needs "$RUNNER_TEMP/needs.json"
          fi
