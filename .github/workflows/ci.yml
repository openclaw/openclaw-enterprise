name: CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "1"
  NODE_VERSION: "24.16.0"

jobs:
  native-images:
    name: Native Container Verification
    if: ${{ github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/container-check.yml
    with:
      source_sha: ${{ github.sha }}
      ci_run_id: ${{ github.run_id }}
      ci_attempt: ${{ github.run_attempt }}
      node_base_image: ${{ vars.CONTAINER_NODE_BASE_IMAGE }}

  audit:
    name: Suite Audit
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Set up workflow tools
        run: bash scripts/ci/setup-tools.sh workflows
      - name: Lint workflow definitions
        run: actionlint .github/workflows/*.yml
      - name: Audit suite manifest and workflows
        run: node scripts/ci/run-tests.mjs audit

  pr-safe:
    name: ${{ matrix.title }}
    # NetworkPolicy proofs need a runner kernel with bridge netfilter support.
    runs-on: ${{ (startsWith(matrix.lane, 'k3d-fixture-') || matrix.lane == 'k3d-observability') && 'ubuntu-22.04' || matrix.lane == 'repository-credentials-platform' && 'blacksmith-16vcpu-ubuntu-2404' || 'blacksmith-8vcpu-ubuntu-2404' }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: checks-baseline
            title: Checks, Conformance, Browser
            profile: baseline
            timeout: 25
          - lane: postgres
            title: PostgreSQL Migrations
            profile: postgres
            timeout: 25
          - lane: postgres-application
            title: PostgreSQL Application
            profile: postgres
            timeout: 25
          - lane: images-packaging
            title: Images and Packaging
            profile: full
            timeout: 45
          - lane: k3d-fixture-configuration
            title: k3d Fixture and Configuration
            profile: k3d
            timeout: 45
          - lane: k3d-fixture-state
            title: k3d State and Lifecycle
            profile: k3d
            timeout: 45
          - lane: k3d-fixture-plugins
            title: k3d Plugin Status
            profile: k3d
            timeout: 45
          - lane: k3d-observability
            title: Production Observability
            profile: k3d
            timeout: 45
          - lane: logging-collector
            title: Logging Collector
            profile: images
            timeout: 30
          - lane: repository-credentials-container
            title: Repository Credentials
            profile: images
            timeout: 40
          - lane: repository-credentials-platform
            title: Repository Credentials Platform
            profile: k3d
            timeout: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/run-ci-lane
        with:
          lane: ${{ matrix.lane }}
          profile: ${{ matrix.profile }}
          node-version: ${{ env.NODE_VERSION }}
          artifact-prefix: ci-results
      - name: Upload repository credential image identities
        if: always() && matrix.lane == 'repository-credentials-container'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-repository-credentials-images
          path: ${{ runner.temp }}/state/repository-credentials-images.json
          if-no-files-found: error
          retention-days: 7

  runtime-image-fixture:
    name: Runtime Image Fixture
    # GitHub-hosted jobs receive a fresh VM and the job's existing Docker engine.
    # Only this lane writes fixture tags; its process awaits each Docker command.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/run-ci-lane
        with:
          lane: runtime-image-fixture
          profile: postgres
          node-version: ${{ env.NODE_VERSION }}
          artifact-prefix: ci-results

  ci-required:
    name: CI Required
    runs-on: ubuntu-22.04
    needs:
      - audit
      - pr-safe
      - runtime-image-fixture
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: ci-results-*
          path: ${{ runner.temp }}/results
          merge-multiple: true
      - name: Write selected job state
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const needs = JSON.parse(process.env.NEEDS_JSON);
          const lanes = ["checks-baseline", "postgres", "postgres-application", "images-packaging", "k3d-fixture-configuration", "k3d-fixture-state", "k3d-fixture-plugins", "k3d-observability", "logging-collector", "repository-credentials-container", "repository-credentials-platform"];
          const expanded = { audit: needs.audit, "runtime-image-fixture": needs["runtime-image-fixture"] };
          for (const lane of lanes) {
            expanded[lane] = { result: needs["pr-safe"]?.result ?? "missing" };
          }
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/needs.json`, JSON.stringify(expanded));
          NODE
      - name: Aggregate CI results
        run: node scripts/ci/run-tests.mjs aggregate ci --results-dir "$RUNNER_TEMP/results" --needs "$RUNNER_TEMP/needs.json"
