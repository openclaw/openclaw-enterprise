name: CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "1"
  NODE_VERSION: "24.16.0"

jobs:
  impact:
    name: CI Impact
    runs-on: ubuntu-22.04
    outputs:
      mode: ${{ steps.select.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: select
        env:
          IMPACT_ACTION: select
        run: |
          # The workflow itself is PR-controlled; independent required-workflow
          # enforcement is needed to protect this bootstrap from workflow edits.
          policy=$(mktemp "$RUNNER_TEMP/ci-impact-policy.XXXXXX.mjs")
          trap 'rm -f "$policy"' EXIT
          trusted_policy() {
            reason=bootstrap_non_pr_event
            [ "${GITHUB_EVENT_NAME:-}" = pull_request ] || return 1
            reason=bootstrap_event_unavailable
            base=$(jq -er '.pull_request.base.sha | select(type == "string")' "$GITHUB_EVENT_PATH") || return 1
            head=$(jq -er '.pull_request.head.sha | select(type == "string")' "$GITHUB_EVENT_PATH") || return 1
            reason=bootstrap_invalid_identity
            oid='^([0-9a-f]{40}|[0-9a-f]{64})$'
            [[ $base =~ $oid && $head =~ $oid && ${GITHUB_SHA:-} =~ $oid ]] || return 1
            reason=bootstrap_git_inspection_failed
            actual=$(git rev-parse --verify 'HEAD^{commit}') || return 1
            reason=bootstrap_checkout_mismatch
            [ "$actual" = "$GITHUB_SHA" ] || return 1
            reason=bootstrap_git_inspection_failed
            parents=$(git show -s --format=%P "$GITHUB_SHA") || return 1
            reason=bootstrap_checkout_mismatch
            [ "$parents" = "$base $head" ] || return 1
            reason=bootstrap_git_inspection_failed
            git cat-file -e "$base^{commit}" && git cat-file -e "$head^{commit}" || return 1
            entry=$(git ls-tree "$base" -- scripts/ci/impact.mjs) || return 1
            reason=bootstrap_policy_unavailable
            [[ $entry =~ ^100644\ blob\ ([0-9a-f]{40}|[0-9a-f]{64})[[:space:]]scripts/ci/impact\.mjs$ ]] || return 1
            reason=bootstrap_git_inspection_failed
            git cat-file blob "${BASH_REMATCH[1]}" > "$policy" || return 1
            reason=bootstrap_policy_unavailable
            [ -s "$policy" ]
          }
          if trusted_policy; then
            if [ "$IMPACT_ACTION" = select ]; then
              node "$policy" --github-output "$GITHUB_OUTPUT"
            else
              node "$policy" --verify-mode "$EXPECTED_MODE"
            fi
          elif [ "$IMPACT_ACTION" = select ]; then
            printf 'CI impact: full (trusted base policy unavailable)\n'
            printf 'mode=full\nreason=%s\n' "$reason" >> "$GITHUB_OUTPUT"
          else
            [ "$EXPECTED_MODE" = full ] || exit 1
            printf 'CI impact: full (trusted base policy unavailable)\n'
          fi

      - name: Summarize impact selection
        if: ${{ always() }}
        env:
          SELECT_OUTCOME: ${{ steps.select.outcome }}
          SELECT_MODE: ${{ steps.select.outputs.mode }}
          SELECT_REASON: ${{ steps.select.outputs.reason }}
        run: |
          # Output only fixed literals, even when workflow inputs are untrusted.
          mode=unavailable
          reason=unavailable
          if [ "$SELECT_OUTCOME" = success ]; then
            case "$SELECT_MODE" in
              docs|full) mode="$SELECT_MODE" ;;
            esac
            case "$mode:$SELECT_REASON" in
              docs:docs_only) reason=docs_only ;;
              full:non_pr_event) reason=non_pr_event ;;
              full:bootstrap_non_pr_event) reason=bootstrap_non_pr_event ;;
              full:invalid_event) reason=invalid_event ;;
              full:invalid_identity) reason=invalid_identity ;;
              full:event_unavailable) reason=event_unavailable ;;
              full:bootstrap_event_unavailable) reason=bootstrap_event_unavailable ;;
              full:bootstrap_invalid_identity) reason=bootstrap_invalid_identity ;;
              full:checkout_mismatch) reason=checkout_mismatch ;;
              full:bootstrap_checkout_mismatch) reason=bootstrap_checkout_mismatch ;;
              full:git_inspection_failed) reason=git_inspection_failed ;;
              full:bootstrap_git_inspection_failed) reason=bootstrap_git_inspection_failed ;;
              full:bootstrap_policy_unavailable) reason=bootstrap_policy_unavailable ;;
              full:malformed_diff) reason=malformed_diff ;;
              full:empty_diff) reason=empty_diff ;;
              full:unsupported_change) reason=unsupported_change ;;
              full:filename_not_utf8) reason=filename_not_utf8 ;;
              full:ineligible_change) reason=ineligible_change ;;
            esac
          fi
          {
            printf '### CI impact selection (advisory)\n\n'
            printf 'Mode: %s\n\n' "$mode"
            printf 'Reason category: %s\n\n' "$reason"
            printf 'This PR-controlled workflow is not trusted enforcement.\n'
          } >> "$GITHUB_STEP_SUMMARY"

  native-images:
    name: Native Container Verification
    if: ${{ github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/container-check.yml
    with:
      source_sha: ${{ github.sha }}
      ci_run_id: ${{ github.run_id }}
      ci_attempt: ${{ github.run_attempt }}
      node_base_image: ${{ vars.CONTAINER_NODE_BASE_IMAGE }}

  audit:
    name: Suite Audit
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Set up workflow tools
        run: bash scripts/ci/setup-tools.sh workflows
      - name: Lint workflow definitions
        run: actionlint .github/workflows/*.yml
      - name: Audit suite manifest and workflows
        run: node scripts/ci/run-tests.mjs audit

  docs-checks:
    name: Documentation Checks
    needs: impact
    if: ${{ needs.impact.outputs.mode == 'docs' }}
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify checkout source
        run: test "$(git rev-parse --verify 'HEAD^{commit}')" = "$GITHUB_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: openclaw/openclaw/.github/actions/setup-pnpm-store-cache@ee0cf16623068ff535cc20f4a1ce175c8c5b8d25
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-mode: read-write
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check formatting
        run: pnpm format:check
      - name: Check and build documentation
        run: pnpm docs:install && pnpm docs:check && pnpm docs:build

  checks-baseline:
    name: Checks and Conformance
    needs: impact
    if: ${{ needs.impact.outputs.mode == 'full' }}
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/run-ci-lane
        with:
          lane: checks-baseline
          profile: baseline
          node-version: ${{ env.NODE_VERSION }}
          artifact-prefix: ci-results

  pr-safe:
    name: ${{ matrix.title }}
    needs: impact
    if: ${{ needs.impact.outputs.mode == 'full' }}
    # NetworkPolicy proofs need a runner kernel with bridge netfilter support.
    runs-on: ${{ (startsWith(matrix.lane, 'k3d-fixture-') || matrix.lane == 'k3d-observability') && 'ubuntu-22.04' || matrix.lane == 'repository-credentials-platform' && 'blacksmith-16vcpu-ubuntu-2404' || 'blacksmith-8vcpu-ubuntu-2404' }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: checks-browser
            title: Console Browser
            profile: baseline
            timeout: 25
          - lane: postgres
            title: PostgreSQL Migrations
            profile: postgres
            timeout: 25
          - lane: postgres-application
            title: PostgreSQL Application
            profile: postgres
            timeout: 25
          - lane: postgres-auth
            title: PostgreSQL Authentication
            profile: postgres
            timeout: 25
          - lane: images-packaging
            title: Images and Packaging
            profile: full
            timeout: 45
          - lane: images-model-probes
            title: Image Model Probes
            profile: images
            timeout: 25
          - lane: k3d-fixture-configuration
            title: k3d Fixture and Configuration
            profile: k3d
            timeout: 45
          - lane: k3d-fixture-state
            title: k3d State and Lifecycle
            profile: k3d
            timeout: 45
          - lane: k3d-fixture-plugins
            title: k3d Plugin Status
            profile: k3d
            timeout: 45
          - lane: k3d-observability
            title: Production Observability
            profile: k3d
            timeout: 45
          - lane: logging-collector
            title: Logging Collector
            profile: images
            timeout: 30
          - lane: repository-credentials-container
            title: Repository Credentials
            profile: images
            timeout: 40
          - lane: repository-credentials-platform
            title: Repository Credentials Platform
            profile: k3d
            timeout: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/run-ci-lane
        with:
          lane: ${{ matrix.lane }}
          profile: ${{ matrix.profile }}
          node-version: ${{ env.NODE_VERSION }}
          artifact-prefix: ci-results
      - name: Upload repository credential image identities
        if: always() && matrix.lane == 'repository-credentials-container'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-repository-credentials-images
          path: ${{ runner.temp }}/state/repository-credentials-images.json
          if-no-files-found: error
          retention-days: 7

  runtime-image-fixture:
    name: Runtime Image Fixture
    needs: impact
    if: ${{ needs.impact.outputs.mode == 'full' }}
    # GitHub-hosted jobs receive a fresh VM and the job's existing Docker engine.
    # Only this lane writes fixture tags; its process awaits each Docker command.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/run-ci-lane
        with:
          lane: runtime-image-fixture
          profile: postgres
          node-version: ${{ env.NODE_VERSION }}
          artifact-prefix: ci-results

  # Real Local Setup install on every PR and merge, with a stand-in model
  # provider and no secrets. Deliberately not a CI Required dependency yet.
  first-agent-smoke:
    name: First Agent Smoke
    needs: impact
    if: ${{ needs.impact.outputs.mode == 'full' }}
    # Local Setup refuses gateway trust unless NetworkPolicies are enforced,
    # which needs the bridge netfilter support of this runner kernel.
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      # The runner starts with about 90 GB free; the smoke uses far less, so it
      # skips the SDK removal the large image lanes need.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up CI tools
        run: bash scripts/ci/setup-tools.sh k3d
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Enable Kubernetes bridge packet filtering
        run: |
          if [[ ! -e /proc/sys/net/bridge/bridge-nf-call-iptables ]]; then
            sudo modprobe br_netfilter
          fi
          sudo sysctl -w net.bridge.bridge-nf-call-iptables=1
      - name: Build OCC CLI
        run: go build -trimpath -o bin/occ ./cmd/occ
      - name: Expose image cache credentials
        id: image-cache
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const token = process.env.ACTIONS_RUNTIME_TOKEN;
            const url = process.env.ACTIONS_RESULTS_URL;
            if (!token || !url) {
              throw new Error('GitHub Actions cache credentials are unavailable');
            }
            core.setSecret(token);
            core.setOutput('token', token);
            core.setOutput('url', url);
      - name: Build checkout images
        env:
          ACTIONS_RUNTIME_TOKEN: ${{ steps.image-cache.outputs.token }}
          ACTIONS_RESULTS_URL: ${{ steps.image-cache.outputs.url }}
        run: node scripts/ci/first-agent-smoke.mjs images
      - name: Install, deploy, chat, stop and start
        run: node scripts/ci/first-agent-smoke.mjs run

  ci-required:
    name: CI Required
    runs-on: ubuntu-22.04
    needs:
      - impact
      - audit
      - docs-checks
      - checks-baseline
      - pr-safe
      - runtime-image-fixture
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify selected mode
        env:
          IMPACT_ACTION: verify
          EXPECTED_MODE: ${{ needs.impact.outputs.mode }}
        run: |
          # The workflow itself is PR-controlled; independent required-workflow
          # enforcement is needed to protect this bootstrap from workflow edits.
          policy=$(mktemp "$RUNNER_TEMP/ci-impact-policy.XXXXXX.mjs")
          trap 'rm -f "$policy"' EXIT
          trusted_policy() {
            reason=bootstrap_non_pr_event
            [ "${GITHUB_EVENT_NAME:-}" = pull_request ] || return 1
            reason=bootstrap_event_unavailable
            base=$(jq -er '.pull_request.base.sha | select(type == "string")' "$GITHUB_EVENT_PATH") || return 1
            head=$(jq -er '.pull_request.head.sha | select(type == "string")' "$GITHUB_EVENT_PATH") || return 1
            reason=bootstrap_invalid_identity
            oid='^([0-9a-f]{40}|[0-9a-f]{64})$'
            [[ $base =~ $oid && $head =~ $oid && ${GITHUB_SHA:-} =~ $oid ]] || return 1
            reason=bootstrap_git_inspection_failed
            actual=$(git rev-parse --verify 'HEAD^{commit}') || return 1
            reason=bootstrap_checkout_mismatch
            [ "$actual" = "$GITHUB_SHA" ] || return 1
            reason=bootstrap_git_inspection_failed
            parents=$(git show -s --format=%P "$GITHUB_SHA") || return 1
            reason=bootstrap_checkout_mismatch
            [ "$parents" = "$base $head" ] || return 1
            reason=bootstrap_git_inspection_failed
            git cat-file -e "$base^{commit}" && git cat-file -e "$head^{commit}" || return 1
            entry=$(git ls-tree "$base" -- scripts/ci/impact.mjs) || return 1
            reason=bootstrap_policy_unavailable
            [[ $entry =~ ^100644\ blob\ ([0-9a-f]{40}|[0-9a-f]{64})[[:space:]]scripts/ci/impact\.mjs$ ]] || return 1
            reason=bootstrap_git_inspection_failed
            git cat-file blob "${BASH_REMATCH[1]}" > "$policy" || return 1
            reason=bootstrap_policy_unavailable
            [ -s "$policy" ]
          }
          if trusted_policy; then
            if [ "$IMPACT_ACTION" = select ]; then
              node "$policy" --github-output "$GITHUB_OUTPUT"
            else
              node "$policy" --verify-mode "$EXPECTED_MODE"
            fi
          elif [ "$IMPACT_ACTION" = select ]; then
            printf 'CI impact: full (trusted base policy unavailable)\n'
            printf 'mode=full\nreason=%s\n' "$reason" >> "$GITHUB_OUTPUT"
          else
            [ "$EXPECTED_MODE" = full ] || exit 1
            printf 'CI impact: full (trusted base policy unavailable)\n'
          fi
      - name: Validate selected job state
        if: always()
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
          EXPECTED_MODE: ${{ needs.impact.outputs.mode }}
        run: |
          printf '%s' "$NEEDS_JSON" > "$RUNNER_TEMP/raw-needs.json"
          node scripts/ci/impact-gate.mjs --needs "$RUNNER_TEMP/raw-needs.json" --mode "$EXPECTED_MODE" --output "$RUNNER_TEMP/needs.json"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: ${{ always() && needs.impact.outputs.mode == 'full' }}
        with:
          pattern: ci-results-*
          path: ${{ runner.temp }}/results
          merge-multiple: true
      - name: Aggregate CI results
        if: ${{ always() && needs.impact.outputs.mode == 'full' }}
        run: |
          node scripts/ci/run-tests.mjs aggregate ci --results-dir "$RUNNER_TEMP/results" --needs "$RUNNER_TEMP/needs.json"
