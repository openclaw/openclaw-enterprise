name: Full Integration

on:
  workflow_dispatch:
    inputs:
      lane:
        description: Integration lane to run (all runs every lane).
        required: true
        default: docker-model
        type: choice
        options:
          - qa-matrix
          - docker-model
          - k3d-model
          - gateway-routing
          - production-tui
          - slack
          - provider-account
          - openshell
          - helper-timeout
          - dev-up-k3d
          - skipper-prepared-git-installed
          - logging-collector
          - k3d-otel
          - all
      qa_repository_fixture:
        description: Repository credential fixture for qa-matrix (including all).
        required: true
        default: default
        type: choice
        options:
          - default
          - isolated

permissions:
  contents: read
  actions: read
  deployments: read

concurrency:
  group: ${{ inputs.lane == 'dev-up-k3d' && format('full-integration-dev-up-k3d-{0}', github.ref) || inputs.lane == 'skipper-prepared-git-installed' && format('full-integration-skipper-prepared-git-installed-{0}', github.ref) || 'full-integration' }}
  cancel-in-progress: false

env:
  CI: "1"
  NODE_VERSION: "24.16.0"

jobs:
  preflight:
    name: Dispatch Preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      run_all: ${{ steps.select.outputs.run_all }}
      selected_lane: ${{ steps.select.outputs.selected_lane }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate lane and environment policy
        id: select
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_LANE: ${{ inputs.lane }}
        run: |
          node scripts/ci/full-integration-preflight.mjs

  pr-safe-same-sha:
    name: Same-SHA ${{ matrix.title }}
    # The lanes ci.yml runs on blacksmith 32vcpu run there too (its kernel enforces the k3d
    # lanes' NetworkPolicy checks; Image Runtime Startup 2 runs four files at once, PostgreSQL
    # Application and the Checks and Conformance and Console Browser lanes up to eight). The
    # demo lane, which PR CI does not run, stays on ubuntu-22.04. PostgreSQL Authentication
    # launches Chromium with its sandbox on, which hosted ubuntu-24.04 refuses ("Chromium
    # sandboxing failed!"), so it runs on ci.yml's blacksmith 16vcpu runner (finding 1383).
    runs-on: ${{ (startsWith(matrix.lane, 'k3d-fixture-') || matrix.lane == 'k3d-observability' || startsWith(matrix.lane, 'images-runtime-startup') || matrix.lane == 'postgres-application' || startsWith(matrix.lane, 'checks-baseline-') || startsWith(matrix.lane, 'checks-browser')) && 'blacksmith-32vcpu-ubuntu-2404' || matrix.lane == 'k3d-observability-demo' && 'ubuntu-22.04' || matrix.lane == 'postgres-auth' && 'blacksmith-16vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
    needs: preflight
    if: needs.preflight.outputs.run_all == 'true'
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: checks-baseline-1
            title: Checks and Conformance 1
            profile: baseline
            timeout: 25
          - lane: checks-baseline-2
            title: Checks and Conformance 2
            profile: baseline
            timeout: 25
          - lane: checks-browser
            title: Console Browser
            profile: baseline
            timeout: 25
          - lane: checks-browser-2
            title: Console Browser 2
            profile: baseline
            timeout: 25
          - lane: postgres
            title: PostgreSQL Migrations
            profile: postgres
            timeout: 25
          - lane: postgres-application
            title: PostgreSQL Application
            profile: postgres
            timeout: 25
          - lane: postgres-auth
            title: PostgreSQL Authentication
            profile: postgres
            timeout: 25
          - lane: postgres-platform
            title: PostgreSQL Platform
            profile: postgres
            timeout: 25
          - lane: images-packaging
            title: Images and Packaging
            profile: full
            timeout: 45
          - lane: images-model-probes
            title: Image Model Probes
            profile: images
            timeout: 25
          - lane: images-runtime-startup
            title: Image Runtime Startup
            profile: full
            timeout: 30
          - lane: images-runtime-startup-2
            title: Image Runtime Startup 2
            profile: images
            timeout: 30
          - lane: images-runtime-startup-3
            title: Image Runtime Startup 3
            profile: images
            timeout: 30
          - lane: k3d-fixture-configuration
            title: k3d Fixture and Configuration
            profile: k3d
            timeout: 45
          - lane: k3d-fixture-state
            title: k3d State and Lifecycle
            profile: k3d
            timeout: 45
          - lane: k3d-fixture-plugins
            title: k3d Plugin Status
            profile: k3d
            timeout: 45
          - lane: k3d-observability-demo
            title: Demo Observability Smoke
            profile: k3d
            timeout: 20
          - lane: k3d-observability
            title: Production Observability
            profile: k3d
            timeout: 45
          - lane: logging-collector
            title: Logging Collector
            profile: images
            timeout: 30
          - lane: repository-credentials-container
            title: Repository Credentials
            profile: images
            timeout: 40
          - lane: keycloak-oidc
            title: Keycloak OIDC
            profile: postgres
            timeout: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/run-ci-lane
        with:
          lane: ${{ matrix.lane }}
          profile: ${{ matrix.profile }}
          node-version: ${{ env.NODE_VERSION }}
          artifact-prefix: full-results
          job-timeout-minutes: ${{ matrix.timeout }}
      - name: Upload repository credential image identities
        if: always() && matrix.lane == 'repository-credentials-container'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: full-repository-credentials-images
          path: ${{ runner.temp }}/state/repository-credentials-images.json
          if-no-files-found: error
          retention-days: 7

  runtime-image-fixture:
    name: Runtime Image Fixture
    runs-on: ubuntu-22.04
    needs: preflight
    if: needs.preflight.outputs.run_all == 'true'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Pull Docker Hub images through a mirror
        run: bash scripts/ci/docker-hub-mirror.sh setup
      - uses: ./.github/actions/run-ci-lane
        with:
          lane: runtime-image-fixture
          profile: postgres
          node-version: ${{ env.NODE_VERSION }}
          artifact-prefix: full-results
          job-timeout-minutes: 60
      - name: Show Docker Hub pull endpoints
        if: ${{ !cancelled() }}
        run: bash scripts/ci/docker-hub-mirror.sh report

  docker-model:
    name: Docker Model Runtime
    runs-on: ubuntu-24.04
    needs: preflight
    if: inputs.lane == 'all' || inputs.lane == 'docker-model'
    timeout-minutes: 40
    environment: integration-model
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OCC_TEST_OPENAI_MODEL: ${{ vars.OCC_TEST_OPENAI_MODEL }}
      OCC_DOCKER_RUNTIME_IMAGE: ${{ vars.OCC_DOCKER_RUNTIME_IMAGE }}
      NODE_BASE_IMAGE: ${{ vars.NODE_BASE_IMAGE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/run-ci-lane
        with:
          lane: docker-model
          profile: images
          node-version: ${{ env.NODE_VERSION }}
          artifact-prefix: full-results
          job-timeout-minutes: 40

  k3d-model:
    name: k3d Model Runtime
    runs-on: ubuntu-24.04
    needs: preflight
    if: inputs.lane == 'all' || inputs.lane == 'k3d-model'
    timeout-minutes: 120
    environment: integration-model
    env:
      CI_RUNNER_TEST_TIMEOUT_MS: "5400000"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OCC_TEST_OPENAI_MODEL: ${{ vars.OCC_TEST_OPENAI_MODEL }}
      OCC_TEST_KUBERNETES_GATEWAY_IMAGE: ${{ vars.OCC_TEST_KUBERNETES_GATEWAY_IMAGE }}
      OCC_TEST_KUBERNETES_AGENT_IMAGE: ${{ vars.OCC_TEST_KUBERNETES_AGENT_IMAGE }}
      NODE_BASE_IMAGE: ${{ vars.NODE_BASE_IMAGE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/run-ci-lane
        with:
          lane: k3d-model
          profile: full
          node-version: ${{ env.NODE_VERSION }}
          artifact-prefix: full-results
          job-timeout-minutes: 120

  gateway-routing:
    name: Gateway Routing
    runs-on: ubuntu-24.04
    needs: preflight
    if: inputs.lane == 'all' || inputs.lane == 'gateway-routing'
    timeout-minutes: 35
    environment: integration-routing
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OCC_TEST_OPENAI_MODEL: ${{ vars.OCC_TEST_OPENAI_MODEL }}
      OCC_TEST_KUBERNETES_GATEWAY_IMAGE: ${{ vars.OCC_TEST_KUBERNETES_GATEWAY_IMAGE }}
      OCC_TEST_KUBERNETES_AGENT_IMAGE: ${{ vars.OCC_TEST_KUBERNETES_AGENT_IMAGE }}
      NODE_BASE_IMAGE: ${{ vars.CONTAINER_NODE_BASE_IMAGE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/run-ci-lane
        with:
          lane: gateway-routing
          profile: full
          node-version: ${{ env.NODE_VERSION }}
          artifact-prefix: full-results
          job-timeout-minutes: 35

  production-tui:
    name: Production TUI
    runs-on: ubuntu-24.04
    needs: preflight
    if: inputs.lane == 'all' || inputs.lane == 'production-tui'
    timeout-minutes: 50
    environment: integration-model
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OCC_TEST_OPENAI_MODEL: ${{ vars.OCC_TEST_OPENAI_MODEL }}
      OCC_TEST_PRODUCTION_CONTROLLER_IMAGE: ${{ vars.OCC_TEST_PRODUCTION_CONTROLLER_IMAGE }}
      OCC_TEST_KUBERNETES_RUNTIME_IMAGE: ${{ vars.OCC_TEST_KUBERNETES_RUNTIME_IMAGE }}
      OCC_TEST_PRODUCTION_POSTGRES_IMAGE: ${{ vars.OCC_TEST_PRODUCTION_POSTGRES_IMAGE }}
      OCC_TEST_PRODUCTION_NODE_IMAGE: ${{ vars.OCC_TEST_PRODUCTION_NODE_IMAGE }}
      NODE_BASE_IMAGE: ${{ vars.NODE_BASE_IMAGE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/run-ci-lane
        with:
          lane: production-tui
          profile: full
          node-version: ${{ env.NODE_VERSION }}
          artifact-prefix: full-results
          job-timeout-minutes: 50

  slack:
    name: Slack Live
    runs-on: ubuntu-24.04
    needs: preflight
    if: inputs.lane == 'all' || inputs.lane == 'slack'
    timeout-minutes: 35
    environment: integration-slack
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OCC_TEST_OPENAI_MODEL: ${{ vars.OCC_TEST_OPENAI_MODEL }}
      NODE_BASE_IMAGE: ${{ vars.CONTAINER_NODE_BASE_IMAGE }}
      OCC_TEST_KUBERNETES_GATEWAY_IMAGE: ${{ vars.OCC_TEST_KUBERNETES_GATEWAY_IMAGE }}
      OCC_TEST_KUBERNETES_AGENT_IMAGE: ${{ vars.OCC_TEST_KUBERNETES_AGENT_IMAGE }}
      OCC_TEST_SLACK_PROXY_URL: ${{ vars.OCC_TEST_SLACK_PROXY_URL }}
      OCC_TEST_SLACK_CHANNEL_ID: ${{ vars.OCC_TEST_SLACK_CHANNEL_ID }}
      OCC_TEST_SLACK_SENDER_BOT_TOKEN: ${{ secrets.OCC_TEST_SLACK_SENDER_BOT_TOKEN }}
      SLACK_APP_TOKEN: ${{ secrets.SLACK_APP_TOKEN }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/run-ci-lane
        with:
          lane: slack
          profile: full
          node-version: ${{ env.NODE_VERSION }}
          artifact-prefix: full-results
          job-timeout-minutes: 35

  provider-account:
    name: Provider Account
    runs-on: blacksmith-8vcpu-ubuntu-2404
    needs: preflight
    if: inputs.lane == 'all' || inputs.lane == 'provider-account'
    timeout-minutes: 25
    environment: integration-provider-account
    env:
      OCC_TEST_OPENAI_MODEL: ${{ vars.OCC_TEST_OPENAI_MODEL }}
      OCC_TEST_KUBERNETES_GATEWAY_IMAGE: ${{ vars.OCC_TEST_KUBERNETES_GATEWAY_IMAGE }}
      OCC_TEST_KUBERNETES_AGENT_IMAGE: ${{ vars.OCC_TEST_KUBERNETES_AGENT_IMAGE }}
      OCC_TEST_CHATGPT_WORKSPACE_ID: ${{ vars.OCC_TEST_CHATGPT_WORKSPACE_ID }}
      OCC_TEST_CHATGPT_ADMIN_KEY_JSON: ${{ secrets.OCC_TEST_CHATGPT_ADMIN_KEY_JSON }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Materialize provider admin key
        run: |
          install -m 0700 -d "$RUNNER_TEMP/secrets"
          test -n "${OCC_TEST_CHATGPT_ADMIN_KEY_JSON:-}"
          printf '%s' "$OCC_TEST_CHATGPT_ADMIN_KEY_JSON" > "$RUNNER_TEMP/secrets/chatgpt-admin-key.json"
          chmod 0600 "$RUNNER_TEMP/secrets/chatgpt-admin-key.json"
          echo "OCC_TEST_CHATGPT_ADMIN_KEY_PATH=$RUNNER_TEMP/secrets/chatgpt-admin-key.json" >> "$GITHUB_ENV"
      - uses: ./.github/actions/run-ci-lane
        with:
          lane: provider-account
          profile: full
          node-version: ${{ env.NODE_VERSION }}
          artifact-prefix: full-results
          job-timeout-minutes: 25

  openshell:
    name: OpenShell
    runs-on: ubuntu-24.04
    needs: preflight
    if: inputs.lane == 'all' || inputs.lane == 'openshell'
    timeout-minutes: 120
    environment: integration-openshell
    env:
      NODE_BASE_IMAGE: ${{ vars.CONTAINER_NODE_BASE_IMAGE }}
      CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OCC_TEST_OPENAI_MODEL: ${{ vars.OCC_TEST_OPENAI_MODEL }}
      OCC_TEST_OPENSHELL_SECRET_PROJECTION: ${{ vars.OCC_TEST_OPENSHELL_SECRET_PROJECTION || '1' }}
      OCC_TEST_KUBERNETES_GATEWAY_IMAGE: ${{ vars.OCC_TEST_KUBERNETES_GATEWAY_IMAGE }}
      OCC_TEST_KUBERNETES_AGENT_IMAGE: ${{ vars.OCC_TEST_KUBERNETES_AGENT_IMAGE }}
      OCC_TEST_OPENSHELL_GATEWAY_IMAGE: ${{ vars.OCC_TEST_OPENSHELL_GATEWAY_IMAGE }}
      OCC_TEST_OPENSHELL_SANDBOX_IMAGE: ${{ vars.OCC_TEST_OPENSHELL_SANDBOX_IMAGE }}
      OCC_TEST_OPENSHELL_SUPERVISOR_IMAGE: ${{ vars.OCC_TEST_OPENSHELL_SUPERVISOR_IMAGE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/run-ci-lane
        with:
          lane: openshell
          profile: full
          node-version: ${{ env.NODE_VERSION }}
          artifact-prefix: full-results
          job-timeout-minutes: 120

  k3d-otel:
    name: k3d OTEL
    runs-on: ubuntu-24.04
    needs: preflight
    if: inputs.lane == 'all' || inputs.lane == 'k3d-otel'
    timeout-minutes: 65
    environment: integration-otel
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OCC_TEST_OPENAI_MODEL: ${{ vars.OCC_TEST_OPENAI_MODEL }}
      OCC_TEST_KUBERNETES_GATEWAY_IMAGE: ${{ vars.OCC_TEST_KUBERNETES_GATEWAY_IMAGE }}
      OCC_TEST_KUBERNETES_AGENT_IMAGE: ${{ vars.OCC_TEST_KUBERNETES_AGENT_IMAGE }}
      NODE_BASE_IMAGE: ${{ vars.NODE_BASE_IMAGE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/run-ci-lane
        with:
          lane: k3d-otel
          profile: full
          node-version: ${{ env.NODE_VERSION }}
          artifact-prefix: full-results
          job-timeout-minutes: 65

  helper-timeout:
    name: Helper Timeout
    runs-on: ubuntu-24.04
    needs: preflight
    if: inputs.lane == 'all' || inputs.lane == 'helper-timeout'
    # Its one test spends 300 s; the lane deadline stops tests five minutes before this.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/run-ci-lane
        with:
          lane: helper-timeout
          profile: baseline
          node-version: ${{ env.NODE_VERSION }}
          artifact-prefix: full-results
          job-timeout-minutes: 15

  logging-collector:
    name: Logging Collector
    runs-on: ubuntu-24.04
    needs: preflight
    if: inputs.lane == 'logging-collector'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/run-ci-lane
        with:
          lane: logging-collector
          profile: images
          node-version: ${{ env.NODE_VERSION }}
          artifact-prefix: full-results
          job-timeout-minutes: 30

  dev-up-k3d:
    name: Local Kubernetes Installation
    runs-on: ubuntu-22.04
    needs: preflight
    if: inputs.lane == 'all' || inputs.lane == 'dev-up-k3d'
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Pull Docker Hub images through a mirror
        run: bash scripts/ci/docker-hub-mirror.sh setup
      - uses: ./.github/actions/run-ci-lane
        with:
          lane: dev-up-k3d
          profile: full
          node-version: ${{ env.NODE_VERSION }}
          artifact-prefix: full-results
          job-timeout-minutes: 180
      - name: Show Docker Hub pull endpoints
        if: ${{ !cancelled() }}
        run: bash scripts/ci/docker-hub-mirror.sh report

  skipper-prepared-git-installed:
    name: Installed Skipper private Git and live withdrawal
    needs: preflight
    if: inputs.lane == 'all' || inputs.lane == 'skipper-prepared-git-installed'
    # The First Agent Smoke runner supports the packaged Codex sandbox and k3d policy.
    # Only synthetic, job-local model and private Git credentials enter this installation.
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/setup-pnpm-store-cache
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-mode: restore
      - run: pnpm install --frozen-lockfile
      - name: Set up CI tools
        run: bash scripts/ci/setup-tools.sh k3d
      # Pull Docker Hub images through mirror.gcr.io without the runner's
      # Docker Hub sign-in (finding 973). This restarts the Engine, so it runs
      # before Buildx starts its builder container.
      - name: Pull Docker Hub images through a mirror
        run: bash scripts/ci/docker-hub-mirror.sh setup
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cleanup: false
          # The builder container pulls base images itself, not through the engine.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Enable Kubernetes bridge packet filtering
        run: |
          if [[ ! -e /proc/sys/net/bridge/bridge-nf-call-iptables ]]; then
            sudo modprobe br_netfilter
          fi
          sudo sysctl -w net.bridge.bridge-nf-call-iptables=1
      - name: Build OCC CLI
        run: go build -trimpath -o bin/occ ./cmd/occ
      - name: Expose image cache credentials
        id: image-cache
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const token = process.env.ACTIONS_RUNTIME_TOKEN;
            const url = process.env.ACTIONS_RESULTS_URL;
            if (!token || !url) {
              throw new Error('GitHub Actions cache credentials are unavailable');
            }
            core.setSecret(token);
            core.setOutput('token', token);
            core.setOutput('url', url);
      - name: Build checkout images
        env:
          ACTIONS_RUNTIME_TOKEN: ${{ steps.image-cache.outputs.token }}
          ACTIONS_RESULTS_URL: ${{ steps.image-cache.outputs.url }}
        run: node scripts/ci/first-agent-smoke.mjs prepared-git-images
      - name: Prove native private Git and withdrawal on the same installed Agent
        env:
          OCC_DEVELOPMENT_K3S_IMAGE: docker.io/rancher/k3s:v1.35.9-k3s1@sha256:ec9868c6a38d4e8c1869832fb5fd1eb8473c39794a0b44d2b952e7ba911951bc
        run: |
          host=$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}')
          OCC_DEVELOPMENT_PREPARED_GIT_HOST_IP="$host" \
            node scripts/qualification/skipper-private-git-fixture.mjs --team-review -- node scripts/ci/skipper-prepared-git-installed.mjs
          echo 'Private Git origin, synthetic issuer and credential inputs removed.' >> "$GITHUB_STEP_SUMMARY"
      # The runner writes only verified test metadata here, after checking proof and cleanup.
      - name: Upload selected test and cleanup outcome
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: full-results-skipper-prepared-git-installed
          path: ${{ runner.temp }}/results/skipper-prepared-git-installed.json
          overwrite: true
          if-no-files-found: error
          retention-days: 7

  full-aggregate:
    name: Full Integration Aggregate
    runs-on: ubuntu-24.04
    needs:
      - preflight
      - pr-safe-same-sha
      - runtime-image-fixture
      - docker-model
      - k3d-model
      - gateway-routing
      - production-tui
      - slack
      - provider-account
      - openshell
      - k3d-otel
      - helper-timeout
      - logging-collector
      - qa-matrix
      - dev-up-k3d
      - skipper-prepared-git-installed
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      # The action retries after a pause and says why.
      - name: Download full integration results
        uses: ./.github/actions/download-results
        with:
          pattern: full-results-*
          path: ${{ runner.temp }}/results
      - name: Write selected job state
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
          LANE: ${{ inputs.lane }}
          SELECTED_LANE: ${{ needs.preflight.outputs.selected_lane || inputs.lane }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const needs = JSON.parse(process.env.NEEDS_JSON);
          const lane = process.env.SELECTED_LANE || process.env.LANE;
          const out = { preflight: needs.preflight };
          if (lane === "all") {
            out["runtime-image-fixture"] = needs["runtime-image-fixture"] ?? { result: "missing" };
            for (const name of ["checks-baseline-1", "checks-baseline-2", "checks-browser", "checks-browser-2", "postgres", "postgres-application", "postgres-auth", "postgres-platform", "images-packaging", "images-model-probes", "images-runtime-startup", "images-runtime-startup-2", "images-runtime-startup-3", "k3d-fixture-configuration", "k3d-fixture-state", "k3d-fixture-plugins", "k3d-observability", "k3d-observability-demo", "logging-collector", "repository-credentials-container", "keycloak-oidc"]) {
              out[name] = { result: needs["pr-safe-same-sha"]?.result ?? "missing" };
            }
          } else if (lane === "logging-collector") {
            out["logging-collector"] = needs["logging-collector"] ?? { result: "missing" };
          }
          for (const name of ["qa-matrix", "dev-up-k3d", "skipper-prepared-git-installed", "docker-model", "k3d-model", "gateway-routing", "production-tui", "slack", "provider-account", "openshell", "helper-timeout", "k3d-otel"]) {
            if (lane === "all" || lane === name) {
              out[name] = needs[name] ?? { result: "missing" };
            }
          }
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/needs.json`, JSON.stringify(out));
          NODE
      - name: Aggregate targeted runtime results
        if: needs.preflight.outputs.run_all != 'true'
        run: node scripts/ci/run-tests.mjs aggregate "${{ needs.preflight.outputs.selected_lane || inputs.lane }}" --results-dir "$RUNNER_TEMP/results" --needs "$RUNNER_TEMP/needs.json"
      - name: Aggregate full suite
        if: needs.preflight.outputs.run_all == 'true'
        run: node scripts/ci/run-tests.mjs aggregate full --results-dir "$RUNNER_TEMP/results" --needs "$RUNNER_TEMP/needs.json"

  qa-matrix:
    name: Shipped Installation QA Matrix
    runs-on: blacksmith-16vcpu-ubuntu-2404
    needs: [preflight, slack]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && (inputs.lane == 'all' || inputs.lane == 'qa-matrix') }}
    timeout-minutes: 240
    environment: integration-qa
    env:
      # The Compose launcher otherwise resolves the +v1.35 K3s channel online (update.k3s.io).
      # Keep in step with defaultK3sImage in scripts/ci/prepare.mjs. Job-scoped: dev-up.test.mjs
      # in checks-baseline-1 asserts the +v1.35 default.
      OCC_DEVELOPMENT_K3S_IMAGE: docker.io/rancher/k3s:v1.35.9-k3s1@sha256:ec9868c6a38d4e8c1869832fb5fd1eb8473c39794a0b44d2b952e7ba911951bc
      OCC_TEST_QA_INSTALLATION: all
      OCC_TEST_QA_PRESET: all
      OCC_TEST_QA_SCENARIOS: all
      OCC_TEST_QA_OPENAI_MODEL: ${{ vars.OCC_TEST_QA_OPENAI_MODEL }}
      OCC_TEST_QA_CODEX_MODEL: ${{ vars.OCC_TEST_QA_CODEX_MODEL }}
      OCC_TEST_QA_SLACK_CHANNEL_ID: ${{ vars.OCC_TEST_QA_SLACK_CHANNEL_ID }}
      OCC_TEST_CODEX_CALENDAR_TOOL_NAME: ${{ vars.OCC_TEST_CODEX_CALENDAR_TOOL_NAME }}
      OCC_TEST_CODEX_CALENDAR_RESULT_EXPECT: ${{ vars.OCC_TEST_CODEX_CALENDAR_RESULT_EXPECT }}
      OCC_TEST_CODEX_CALENDAR_PROMPT: ${{ vars.OCC_TEST_CODEX_CALENDAR_PROMPT }}
      OCC_TEST_QA_REPOSITORY_AUTHORIZED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Materialize approved QA credentials
        if: inputs.qa_repository_fixture == 'default'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
          SLACK_APP_TOKEN: ${{ secrets.SLACK_APP_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_SENDER_TOKEN: ${{ secrets.SLACK_SENDER_TOKEN }}
          REPOSITORY_OBSERVER_TOKEN: ${{ secrets.REPOSITORY_OBSERVER_TOKEN }}
          REPOSITORY_REGISTRY_JSON: ${{ secrets.REPOSITORY_REGISTRY_JSON }}
          REPOSITORY_APP_KEY: ${{ secrets.REPOSITORY_APP_KEY }}
          REPOSITORY_UPSTREAM_CIDRS_JSON: ${{ vars.REPOSITORY_UPSTREAM_CIDRS_JSON }}
        run: node scripts/ci/qa-matrix-credentials.mjs
      - name: Materialize isolated QA repository credentials
        if: inputs.qa_repository_fixture == 'isolated'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
          SLACK_APP_TOKEN: ${{ secrets.SLACK_APP_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_SENDER_TOKEN: ${{ secrets.SLACK_SENDER_TOKEN }}
          QA_REPOSITORY_FIXTURE: isolated
          QA_ISOLATED_REPOSITORY_FULL_NAME: ${{ vars.QA_ISOLATED_REPOSITORY_FULL_NAME }}
          REPOSITORY_REGISTRY_JSON: ${{ secrets.QA_ISOLATED_REPOSITORY_REGISTRY_JSON }}
          REPOSITORY_APP_KEY: ${{ secrets.QA_ISOLATED_REPOSITORY_APP_KEY }}
          REPOSITORY_UPSTREAM_CIDRS_JSON: ${{ vars.REPOSITORY_UPSTREAM_CIDRS_JSON }}
        run: node scripts/ci/qa-matrix-credentials.mjs
      - uses: ./.github/actions/run-ci-lane
        with:
          lane: qa-matrix
          profile: full
          node-version: ${{ env.NODE_VERSION }}
          artifact-prefix: full-results
          job-timeout-minutes: 240
      - name: Retain QA outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: qa-matrix-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qa-matrix-evidence/*.json
          if-no-files-found: warn
          retention-days: 7
      - name: Remove workflow credential inputs
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/qa-matrix-credentials"
