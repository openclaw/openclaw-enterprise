name: Full Integration

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      lane:
        description: Integration lane to run (all runs every lane).
        required: true
        default: docker-model
        type: choice
        options:
          - qa-matrix
          - docker-model
          - k3d-model
          - gateway-routing
          - production-tui
          - slack
          - openshell
          - helper-timeout
          - dev-up-k3d
          - skipper-prepared-git-installed
          - logging-collector
          - k3d-otel
          - all

permissions:
  contents: read
  actions: read
  deployments: read

env:
  CI: "1"
  NODE_VERSION: "24.22.1"

jobs:
  manual-approval:
    name: Approve manual integration
    if: ${{ github.repository == 'openclaw/openclaw-enterprise' && github.ref == 'refs/heads/main' && github.ref_type == 'branch' && github.run_attempt == '1' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    environment: integration-main-approval
    steps:
      - name: Record required team approval
        run: echo "Required team approval received; preflight verifies the dispatcher."

  preflight:
    needs: manual-approval
    if: ${{ !cancelled() && github.repository == 'openclaw/openclaw-enterprise' && github.ref == 'refs/heads/main' && github.ref_type == 'branch' && ((github.event_name == 'schedule' && needs.manual-approval.result == 'skipped') || (github.event_name == 'workflow_dispatch' && (github.run_attempt != '1' || needs.manual-approval.result == 'success'))) }}
    name: Dispatch Preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      run_all: ${{ steps.select.outputs.run_all }}
      selected_lane: ${{ steps.select.outputs.selected_lane }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Set up scheduled admission runtime
        if: github.event_name == 'schedule'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Validate lane and environment policy
        id: select
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_LANE: ${{ inputs.lane }}
        run: |
          node scripts/ci/full-integration-preflight.mjs

  execute:
    name: Execute
    needs: preflight
    if: ${{ !cancelled() && github.repository == 'openclaw/openclaw-enterprise' && github.ref == 'refs/heads/main' && github.ref_type == 'branch' && needs.preflight.result == 'success' && ((github.event_name == 'schedule' && github.run_attempt == '1' && needs.preflight.outputs.selected_lane == 'all') || (github.event_name == 'workflow_dispatch' && github.run_attempt == '1' && needs.preflight.outputs.selected_lane != '' && needs.preflight.outputs.selected_lane != 'docs' && needs.preflight.outputs.selected_lane == inputs.lane)) }}
    concurrency:
      # Only an eligible full tick enters the automatic execution queue.
      group: ${{ github.event_name == 'workflow_dispatch' && format('full-integration-manual-{0}', github.run_id) || 'full-integration' }}
      cancel-in-progress: false
    uses: ./.github/workflows/full-integration-execution.yml
    with:
      lane: ${{ inputs.lane || '' }}
    secrets: inherit

  reject-selection:
    name: Reject missing or inconsistent selection
    needs: preflight
    if: ${{ !cancelled() && needs.preflight.result == 'success' && !((github.event_name == 'schedule' && (needs.preflight.outputs.selected_lane == 'all' || needs.preflight.outputs.selected_lane == 'skip')) || (github.event_name == 'workflow_dispatch' && needs.preflight.outputs.selected_lane != '' && needs.preflight.outputs.selected_lane != 'docs' && needs.preflight.outputs.selected_lane == inputs.lane)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Report invalid admission
        run: |
          echo "::error::Preflight did not publish a matching supported lane. Start a new workflow run."
          exit 1
