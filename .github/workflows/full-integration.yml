name: Full Integration
run-name: ${{ inputs.network_proxy_acceptance && inputs.network_proxy_clearance_run != '' && format('Network Proxy Clearance 9ffc8947c06954644ceb08da25164adbc8a184ab run {0} attempt {1}', inputs.network_proxy_clearance_run, inputs.network_proxy_clearance_attempt) || inputs.network_proxy_acceptance && 'Network Proxy Acceptance 9ffc8947c06954644ceb08da25164adbc8a184ab' || github.workflow }}

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      lane:
        description: Integration lane to run (all runs every lane).
        required: true
        default: docker-model
        type: choice
        options:
          - qa-matrix
          - docker-model
          - k3d-model
          - gateway-routing
          - production-tui
          - slack
          - openshell
          - helper-timeout
          - dev-up-k3d
          - skipper-prepared-git-installed
          - logging-collector
          - k3d-otel
          - all
      network_proxy_acceptance:
        description: Run one-off acceptance for PR 6856 at the approved exact head (Slack lane only).
        required: false
        default: false
        type: boolean
      network_proxy_clearance_run:
        description: Independently verified teardown clearance for an earlier acceptance run (requires acceptance mode).
        required: false
        default: ""
        type: string
      network_proxy_clearance_attempt:
        description: Exact attempt of the acceptance run being cleared.
        required: false
        default: "1"
        type: string

permissions:
  contents: read
  actions: read
  deployments: read

env:
  CI: "1"
  NODE_VERSION: "24.22.1"

jobs:
  manual-approval:
    name: ${{ inputs.network_proxy_clearance_run != '' && format('Approve teardown run {0} attempt {1} source 9ffc8947c06954644ceb08da25164adbc8a184ab', inputs.network_proxy_clearance_run, inputs.network_proxy_clearance_attempt) || inputs.network_proxy_acceptance && 'Approve PR 6856 9ffc8947 acceptance (subscriptions unknown; off-channel risk)' || 'Approve manual integration' }}
    if: ${{ github.repository == 'openclaw/openclaw-enterprise' && github.ref == 'refs/heads/main' && github.ref_type == 'branch' && github.run_attempt == '1' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    environment: integration-main-approval
    steps:
      - name: Record required team approval
        run: echo "Required team approval received; preflight verifies the dispatcher."
      - name: Record accepted subscription uncertainty
        if: ${{ inputs.network_proxy_acceptance && inputs.network_proxy_clearance_run == '' }}
        run: echo "Protected approval binds the exact green PR 6856 candidate as fully privileged trusted same-UID code. The user gave informed authorization for the intended seven-post budget. Receiver subscriptions, off-channel writes, and transient between-poll posts/deletions are unobservable; the ledger is observational and is not a Slack-side hard cap."

  preflight:
    needs: manual-approval
    if: ${{ !cancelled() && github.repository == 'openclaw/openclaw-enterprise' && github.ref == 'refs/heads/main' && github.ref_type == 'branch' && ((github.event_name == 'schedule' && needs.manual-approval.result == 'skipped') || (github.event_name == 'workflow_dispatch' && (github.run_attempt != '1' || needs.manual-approval.result == 'success'))) }}
    name: Dispatch Preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      run_all: ${{ steps.select.outputs.run_all }}
      selected_lane: ${{ steps.select.outputs.selected_lane }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Set up preflight runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Validate lane and environment policy
        id: select
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_LANE: ${{ inputs.lane }}
          INPUT_NETWORK_PROXY_ACCEPTANCE: ${{ inputs.network_proxy_acceptance }}
          INPUT_NETWORK_PROXY_CLEARANCE_RUN: ${{ inputs.network_proxy_clearance_run }}
          INPUT_NETWORK_PROXY_CLEARANCE_ATTEMPT: ${{ inputs.network_proxy_clearance_attempt }}
        run: |
          node scripts/ci/full-integration-preflight.ts
      - name: Scheduled preflight diagnostic (${{ steps.select.outputs.failure_stage || 'unknown' }})
        if: ${{ failure() && !cancelled() && github.event_name == 'schedule' && steps.select.outcome == 'failure' }}
        run: ":"

  execute:
    name: Execute
    needs: preflight
    if: ${{ !cancelled() && !inputs.network_proxy_acceptance && github.repository == 'openclaw/openclaw-enterprise' && github.ref == 'refs/heads/main' && github.ref_type == 'branch' && needs.preflight.result == 'success' && ((github.event_name == 'schedule' && github.run_attempt == '1' && needs.preflight.outputs.selected_lane == 'all') || (github.event_name == 'workflow_dispatch' && github.run_attempt == '1' && needs.preflight.outputs.selected_lane != '' && needs.preflight.outputs.selected_lane != 'docs' && needs.preflight.outputs.selected_lane == inputs.lane)) }}
    concurrency:
      # Only an eligible full tick enters the automatic execution queue.
      group: ${{ github.event_name == 'workflow_dispatch' && format('full-integration-manual-{0}', github.run_id) || 'full-integration' }}
      cancel-in-progress: false
    # GitHub statically validates every nested job, including skipped acceptance jobs.
    permissions:
      contents: read
      actions: read
      deployments: read
      pull-requests: read
      checks: read
    uses: ./.github/workflows/full-integration-execution.yml
    with:
      lane: ${{ inputs.lane || '' }}
    secrets: inherit

  execute-network-proxy-acceptance:
    name: Execute approved network proxy acceptance
    needs: preflight
    if: ${{ !cancelled() && inputs.network_proxy_acceptance == true && github.repository == 'openclaw/openclaw-enterprise' && github.ref == 'refs/heads/main' && github.ref_type == 'branch' && github.event_name == 'workflow_dispatch' && github.run_attempt == '1' && inputs.lane == 'slack' && needs.preflight.result == 'success' && needs.preflight.outputs.selected_lane == 'slack' }}
    permissions:
      contents: read
      actions: read
      deployments: read
      pull-requests: read
      checks: read
    uses: ./.github/workflows/full-integration-execution.yml
    with:
      lane: slack
      network_proxy_acceptance: true
      network_proxy_clearance_run: ${{ inputs.network_proxy_clearance_run }}
      network_proxy_clearance_attempt: ${{ inputs.network_proxy_clearance_attempt }}
    secrets: inherit

  reject-selection:
    name: Reject missing or inconsistent selection
    needs: preflight
    if: ${{ !cancelled() && needs.preflight.result == 'success' && !((github.event_name == 'schedule' && (needs.preflight.outputs.selected_lane == 'all' || needs.preflight.outputs.selected_lane == 'skip')) || (github.event_name == 'workflow_dispatch' && needs.preflight.outputs.selected_lane != '' && needs.preflight.outputs.selected_lane != 'docs' && needs.preflight.outputs.selected_lane == inputs.lane)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Report invalid admission
        run: |
          echo "::error::Preflight did not publish a matching supported lane. Start a new workflow run."
          exit 1
