name: Release OCC CLI

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full main source SHA and selected workflow revision
        required: true
        type: string
      ci_run_id:
        description: Successful main-push CI run for exactly source_sha
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    uses: ./.github/workflows/cli-release-prepare.yml
    permissions:
      actions: read
      contents: read
    with:
      source_sha: ${{ inputs.source_sha }}
      ci_run_id: ${{ inputs.ci_run_id }}

  publish:
    needs: prepare
    uses: ./.github/workflows/cli-release-publish.yml
    concurrency:
      group: enterprise-container-publish
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    with:
      source_sha: ${{ inputs.source_sha }}
      ci_run_id: ${{ inputs.ci_run_id }}
      ci_attempt: ${{ needs.prepare.outputs.ci_attempt }}
      artifact_name: ${{ needs.prepare.outputs.artifact_name }}
      artifact_run_id: ${{ format('{0}', github.run_id) }}
      sha256sums_digest: ${{ needs.prepare.outputs.sha256sums_digest }}
