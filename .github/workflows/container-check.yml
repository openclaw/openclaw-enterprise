name: Check Native Container Images

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Expected full source commit SHA (defaults to the selected ref's SHA)
        required: false
        type: string
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      ci_run_id:
        required: false
        type: string
      ci_attempt:
        required: false
        type: string
      node_base_image:
        required: false
        type: string
      assemble_images:
        description: Assemble the tested architectures for publication
        type: boolean
        default: false
      prepare_chart:
        description: Assemble both images and package the digest-pinned chart
        type: boolean
        default: false
    outputs:
      controller_digest:
        value: ${{ jobs.assemble.outputs.controller_digest }}
      runtime_digest:
        value: ${{ jobs.assemble.outputs.runtime_digest }}
      chart_sha256:
        value: ${{ jobs.chart.outputs.chart_sha256 }}
      version:
        value: ${{ jobs.chart.outputs.version }}

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
  CI_RUN_ID: ${{ inputs.ci_run_id }}
  CI_ATTEMPT: ${{ inputs.ci_attempt }}
  NODE_BASE_IMAGE: ${{ inputs.node_base_image }}

jobs:
  prepare:
    name: Prepare ${{ matrix.image }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        image: [controller, runtime]
        arch: [amd64, arm64]
        include:
          - image: controller
            file: Dockerfile
            target: runtime
          - image: runtime
            file: deploy/runtime/Dockerfile
            target: ""
          - arch: amd64
            runner: ${{ vars.CONTAINER_AMD64_RUNNER || 'blacksmith-16vcpu-ubuntu-2404' }}
          - arch: arm64
            runner: ${{ vars.CONTAINER_ARM64_RUNNER || 'blacksmith-8vcpu-ubuntu-2404-arm' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: ${{ inputs.source_sha != github.sha && inputs.source_sha != '' && '0' || '1' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.22.1"
      - name: Select image recipes and verify the source Node base
        run: node scripts/ci/container-release.ts select-source "$RUNNER_TEMP/release-source"
      - name: Pin image timestamps to the source commit
        run: |
          SOURCE_DATE_EPOCH="$(git show --no-patch --format=%ct "$SOURCE_SHA")"
          test -n "$SOURCE_DATE_EPOCH"
          printf 'SOURCE_DATE_EPOCH=%s\n' "$SOURCE_DATE_EPOCH" >> "$GITHUB_ENV"
      - name: Read the OpenClaw source pin
        if: ${{ matrix.image == 'runtime' }}
        id: openclaw-source
        run: |
          values="$(node scripts/lib/openclaw-source.ts build-args "$NATIVE_BUILD_CONTEXT/deploy/runtime/openclaw-source.json")"
          {
            echo 'build-args<<EOF'
            printf '%s\n' "$values"
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Report native runner resources
        env:
          PLATFORM: linux/${{ matrix.arch }}
        run: |
          node <<'NODE'
          const os = require("node:os");
          const arch = process.arch === "x64" ? "amd64" : process.arch;
          if (process.env.PLATFORM !== `linux/${arch}`) {
            throw new Error("Select a native Linux runner");
          }
          console.log({arch, cpus: os.availableParallelism(), memoryBytes: os.totalmem()});
          if (os.availableParallelism() < 4 || os.totalmem() < 12 * 1024 ** 3) {
            throw new Error("Container builds require at least 4 CPUs and 12 GiB RAM; select a larger runner");
          }
          NODE
          df -h / "$RUNNER_TEMP"
      - name: Reclaim unused toolchains on the standard AMD64 runtime runner
        if: ${{ matrix.image == 'runtime' && matrix.arch == 'amd64' && vars.CONTAINER_AMD64_RUNNER == 'ubuntu-24.04' }}
        env:
          OPENCLAW_CI_HEADROOM_LANE: container-runtime-build
        run: node scripts/ci/repository-platform-headroom.ts
      - name: Set up persistent Blacksmith Buildx cache
        if: ${{ startsWith(matrix.runner, 'blacksmith-') }}
        uses: useblacksmith/setup-docker-builder@06dd9c83a5d541274d2e3ac67625560979275267 # v2.3.0
        with:
          cache-key: openclaw-enterprise/${{ matrix.image }}-${{ matrix.arch }}
          max-parallelism: "2"
      - name: Set up portable Buildx builder
        if: ${{ !startsWith(matrix.runner, 'blacksmith-') }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2
      - name: Verify runtime source before image assembly
        if: ${{ matrix.image == 'runtime' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: ${{ env.NATIVE_BUILD_CONTEXT }}
          file: ${{ env.NATIVE_BUILD_CONTEXT }}/${{ matrix.file }}
          target: openclaw-bridge-tests
          platforms: linux/${{ matrix.arch }}
          build-args: |
            ${{ steps.openclaw-source.outputs.build-args }}
            NODE_BASE_IMAGE=${{ env.NODE_BASE_IMAGE }}
            OCC_BUILD_REVISION=${{ env.SOURCE_SHA }}
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          labels: |
            org.opencontainers.image.source=https://github.com/openclaw/openclaw-enterprise
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
          outputs: type=cacheonly
          cache-from: ${{ !startsWith(matrix.runner, 'blacksmith-') && format('type=gha,scope=enterprise-{0}-{1}-verification', matrix.image, matrix.arch) || '' }}
          cache-to: ${{ !startsWith(matrix.runner, 'blacksmith-') && format('type=gha,mode=max,scope=enterprise-{0}-{1}-verification', matrix.image, matrix.arch) || '' }}
          provenance: false
          push: false
      - name: Build native OCI image without publication
        id: build
        timeout-minutes: 60
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: ${{ env.NATIVE_BUILD_CONTEXT }}
          file: ${{ env.NATIVE_BUILD_CONTEXT }}/${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          build-args: |
            ${{ steps.openclaw-source.outputs.build-args }}
            NODE_BASE_IMAGE=${{ env.NODE_BASE_IMAGE }}
            OCC_BUILD_REVISION=${{ env.SOURCE_SHA }}
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          labels: |
            org.opencontainers.image.source=https://github.com/openclaw/openclaw-enterprise
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
          outputs: type=oci,dest=${{ runner.temp }}/oci,tar=false,rewrite-timestamp=true
          cache-from: ${{ !startsWith(matrix.runner, 'blacksmith-') && format('type=gha,scope=enterprise-{0}-{1}', matrix.image, matrix.arch) || '' }}
          cache-to: ${{ !startsWith(matrix.runner, 'blacksmith-') && format('type=gha,mode=max,scope=enterprise-{0}-{1}', matrix.image, matrix.arch) || '' }}
          provenance: false
          push: false
      - name: Record untested runtime build identity
        if: ${{ matrix.image == 'runtime' }}
        env:
          IMAGE: runtime
          PLATFORM: linux/${{ matrix.arch }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: node scripts/ci/container-release.ts record-build "$RUNNER_TEMP/oci"
      - name: Retain untested runtime for a fresh native runner
        if: ${{ matrix.image == 'runtime' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: built-runtime-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/oci
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Install existing smoke test prerequisites
        if: ${{ matrix.image == 'controller' }}
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install --no-install-recommends -y skopeo
          skopeo --version | grep -Fx 'skopeo version 1.13.3'
          corepack pnpm install --frozen-lockfile --ignore-scripts
      - name: Smoke the exact export on its native architecture
        if: ${{ matrix.image == 'controller' }}
        env:
          IMAGE: ${{ matrix.image }}
          PLATFORM: linux/${{ matrix.arch }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          CI_ATTEMPT: ${{ env.CI_ATTEMPT }}
        run: |
          node scripts/ci/container-release.ts smoke "$RUNNER_TEMP/oci"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ matrix.image == 'controller' }}
        with:
          name: platform-${{ matrix.image }}-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/oci
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  runtime-smoke:
    name: Smoke runtime (${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ${{ vars.CONTAINER_AMD64_RUNNER || 'blacksmith-16vcpu-ubuntu-2404' }}
          - arch: arm64
            runner: ${{ vars.CONTAINER_ARM64_RUNNER || 'blacksmith-8vcpu-ubuntu-2404-arm' }}
    env:
      IMAGE: runtime
      PLATFORM: linux/${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: ${{ inputs.source_sha != github.sha && inputs.source_sha != '' && '0' || '1' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.22.1"
      - name: Verify the selected source and Node base
        run: node scripts/ci/container-release.ts select-source
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: built-runtime-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/oci
      - name: Verify the runtime build and referenced OCI blobs
        id: verified
        run: node scripts/ci/container-release.ts verify-build "$RUNNER_TEMP/oci"
      - name: Install existing smoke test prerequisites
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install --no-install-recommends -y skopeo
          skopeo --version | grep -Fx 'skopeo version 1.13.3'
          corepack pnpm install --frozen-lockfile --ignore-scripts
      - name: Smoke the exact export on its native architecture
        env:
          IMAGE_DIGEST: ${{ steps.verified.outputs.digest }}
        run: |
          bash scripts/ci/setup-tools.sh k3d
          export PATH="$RUNNER_TEMP/bin:$PATH"
          export OPENCLAW_CI_NATIVE_PREPARATION_SUMMARY=1
          node scripts/ci/container-release.ts smoke "$RUNNER_TEMP/oci"
      - name: Clean up runtime smoke resources
        if: always()
        run: node scripts/ci/cleanup.ts --state "$RUNNER_TEMP/runtime-smoke-${{ matrix.arch }}.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platform-runtime-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/oci
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  assemble:
    name: Assemble ${{ matrix.image }} OCI image
    if: ${{ inputs.assemble_images || inputs.prepare_chart }}
    needs: [prepare, runtime-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      controller_digest: ${{ steps.seal.outputs.controller_digest }}
      runtime_digest: ${{ steps.seal.outputs.runtime_digest }}
    strategy:
      fail-fast: false
      matrix:
        image: [controller, runtime]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          fetch-depth: ${{ inputs.source_sha != github.sha && inputs.source_sha != '' && '0' || '1' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.22.1"
      - name: Verify the selected source and Node base
        run: node scripts/ci/container-release.ts select-source
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: platform-${{ matrix.image }}-amd64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/oci/amd64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: platform-${{ matrix.image }}-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/oci/arm64
      - name: Assemble and seal tested platform bytes without rebuilding
        id: seal
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          node scripts/ci/container-release.ts assemble "$RUNNER_TEMP/oci"
          IMAGE_DIGEST="$(sed -n 's/^digest=//p' "$GITHUB_OUTPUT")"
          export IMAGE_DIGEST
          node scripts/ci/container-release.ts seal "$RUNNER_TEMP/oci"
          echo "${IMAGE}_digest=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-${{ matrix.image }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/oci
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  chart:
    if: ${{ inputs.prepare_chart }}
    needs: assemble
    uses: ./.github/workflows/release-chart-prepare.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      ci_run_id: ${{ inputs.ci_run_id }}
      ci_attempt: ${{ inputs.ci_attempt }}
      node_base_image: ${{ inputs.node_base_image }}
      controller_digest: ${{ needs.assemble.outputs.controller_digest }}
      runtime_digest: ${{ needs.assemble.outputs.runtime_digest }}
