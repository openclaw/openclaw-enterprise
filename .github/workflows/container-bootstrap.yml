name: Bootstrap Enterprise Container Packages

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful main push run of CI for the selected workflow revision
        required: true
        type: string

permissions:
  contents: read

jobs:
  bootstrap:
    name: Bootstrap private GHCR packages with harmless markers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: container-publish
    concurrency:
      group: enterprise-container-publish
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.16.0"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Install OCI transport
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y skopeo
          skopeo --version | grep -Fx 'skopeo version 1.13.3'
      - name: Verify approval and bootstrap private packages
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.workflow_sha }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          GHCR_CONTROLLER_IMAGE: ${{ vars.GHCR_CONTROLLER_IMAGE }}
          GHCR_RUNTIME_IMAGE: ${{ vars.GHCR_RUNTIME_IMAGE }}
        run: node scripts/ci/container-bootstrap.mjs
