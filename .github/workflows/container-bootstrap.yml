name: Bootstrap Enterprise Container Packages

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful main push run of CI for the selected workflow revision
        required: true
        type: string

permissions:
  contents: read

jobs:
  bootstrap:
    name: Bootstrap GHCR packages with harmless markers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: container-publish
    concurrency:
      group: enterprise-container-publish
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.16.0"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Install OCI transport
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install --no-install-recommends -y skopeo
          skopeo --version | grep -Fx 'skopeo version 1.13.3'
      - name: Install pinned Helm
        run: |
          bash scripts/ci/download-pinned.sh \
            https://get.helm.sh/helm-v3.19.2-linux-amd64.tar.gz \
            "$RUNNER_TEMP/helm.tar.gz" \
            2114c9dea2844dce6d0ee2d792a9aae846be8cf53d5b19dc2988b5a0e8fec26e
          tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C "$RUNNER_TEMP" linux-amd64/helm
          echo "$RUNNER_TEMP/linux-amd64" >> "$GITHUB_PATH"
      - name: Validate source and bootstrap GHCR packages
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.workflow_sha }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          GHCR_CONTROLLER_IMAGE: ${{ vars.GHCR_CONTROLLER_IMAGE }}
          GHCR_RUNTIME_IMAGE: ${{ vars.GHCR_RUNTIME_IMAGE }}
        run: node scripts/ci/container-bootstrap.mjs
