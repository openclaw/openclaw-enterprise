# TODO: Remove this temporary diagnostic workflow after the hosted auth issue is resolved.
name: Temporary Provider Auth Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "24.16.0"

jobs:
  provider-auth-diagnostic:
    name: Provider Auth Diagnostic
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 10
    environment: integration-provider-account
    steps:
      - name: Require main source
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Provider auth diagnostic must run from main at the approved github.sha."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Probe ChatGPT admin credential boundary
        env:
          OCC_TEST_CHATGPT_WORKSPACE_ID: ${{ vars.OCC_TEST_CHATGPT_WORKSPACE_ID }}
          OCC_TEST_CHATGPT_ADMIN_KEY_JSON: ${{ secrets.OCC_TEST_CHATGPT_ADMIN_KEY_JSON }}
          OCC_DIAGNOSTIC_ADMIN_KEY_SHA256: ${{ secrets.OCC_DIAGNOSTIC_ADMIN_KEY_SHA256 }}
        run: |
          node <<'NODE'
          const { createHash } = await import("node:crypto");

          const maxResponseBytes = 4 * 1024 * 1024;
          const allowedErrorCodes = new Set([
            "invalid_api_key",
            "employee_api_key_requires_corporate_network",
            "ip_not_authorized",
            "ip_blocklisted",
            "insufficient_scope",
            "api_key_requires_allowed_network",
          ]);

          function requireEnv(name) {
            const value = process.env[name];
            if (typeof value !== "string" || value.trim().length === 0) {
              throw new Error(`${name} is required.`);
            }
            return value;
          }

          function sha256Hex(value) {
            return createHash("sha256").update(value).digest("hex");
          }

          function safeDiagnostic(diagnostic) {
            const safe = { keySha256Matches: diagnostic.keySha256Matches === true };
            if (Number.isInteger(diagnostic.status)) safe.status = diagnostic.status;
            if (allowedErrorCodes.has(diagnostic.upstreamErrorCode)) {
              safe.upstreamErrorCode = diagnostic.upstreamErrorCode;
            }
            if (/^(?:req_[a-f0-9]{32}|[a-f0-9]{8}(?:-[a-f0-9]{4}){3}-[a-f0-9]{12})$/i.test(diagnostic.requestId ?? "")) {
              safe.requestId = diagnostic.requestId;
            }
            if (/^[a-f0-9]{16}-[A-Z]{3}$/.test(diagnostic.cfRay ?? "")) {
              safe.cfRay = diagnostic.cfRay;
            }
            return safe;
          }

          async function boundedText(response) {
            const declared = Number(response.headers.get("content-length"));
            if (Number.isFinite(declared) && declared > maxResponseBytes) {
              throw new Error("response_too_large");
            }
            const reader = response.body?.getReader();
            if (!reader) return "";
            const chunks = [];
            let size = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              size += value.byteLength;
              if (size > maxResponseBytes) {
                throw new Error("response_too_large");
              }
              chunks.push(value);
            }
            return Buffer.concat(chunks).toString("utf8");
          }

          function upstreamErrorCode(responseText) {
            try {
              const parsed = JSON.parse(responseText);
              return typeof parsed?.error?.code === "string" ? parsed.error.code : undefined;
            } catch {
              return undefined;
            }
          }

          const key = requireEnv("OCC_TEST_CHATGPT_ADMIN_KEY_JSON").trim();
          const expectedDigest = requireEnv("OCC_DIAGNOSTIC_ADMIN_KEY_SHA256").trim();
          if (!/^[a-f0-9]{64}$/i.test(expectedDigest)) {
            throw new Error("OCC_DIAGNOSTIC_ADMIN_KEY_SHA256 must be a SHA-256 hex digest.");
          }
          const diagnostic = { keySha256Matches: sha256Hex(key) === expectedDigest.toLowerCase() };

          if (!diagnostic.keySha256Matches) {
            console.log(JSON.stringify(safeDiagnostic(diagnostic)));
            throw new Error("Provider credential digest mismatch.");
          }

          const workspace = requireEnv("OCC_TEST_CHATGPT_WORKSPACE_ID").trim();
          let response;
          try {
            response = await fetch(
              `https://api.chatgpt.com/v1/manage/workspaces/${encodeURIComponent(workspace)}/service-accounts?limit=1`,
              {
                method: "GET",
                headers: {
                  Authorization: `Bearer ${key}`,
                  Accept: "application/json",
                },
                redirect: "error",
                signal: AbortSignal.timeout(30_000),
              },
            );
          } catch {
            console.log(JSON.stringify(safeDiagnostic(diagnostic)));
            throw new Error("Provider auth diagnostic request failed.");
          }
          diagnostic.status = response.status;
          diagnostic.requestId = response.headers.get("x-request-id");
          diagnostic.cfRay = response.headers.get("cf-ray");
          let responseText;
          try {
            responseText = await boundedText(response);
          } catch {
            console.log(JSON.stringify(safeDiagnostic(diagnostic)));
            throw new Error("Provider auth diagnostic response read failed.");
          }
          if (!response.ok) diagnostic.upstreamErrorCode = upstreamErrorCode(responseText);
          console.log(JSON.stringify(safeDiagnostic(diagnostic)));
          if (!response.ok) {
            throw new Error("Provider auth diagnostic request failed.");
          }
          NODE
