name: Refresh contributors

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] only the trusted default branch is checked out
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contributors-${{ github.repository }}
  cancel-in-progress: false

jobs:
  refresh:
    if: >-
      github.repository == 'openclaw/openclaw-enterprise' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.pull_request.merged == true &&
        github.event.pull_request.base.ref == github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out the trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.22.1"
      - name: Refresh the contributor wall
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/update-contributors.ts
      - name: Propose the README update
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ github.token }}
          add-paths: README.md
          branch: automation/contributors
          base: ${{ github.event.repository.default_branch }}
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          commit-message: "docs: refresh contributor photos"
          title: "docs: refresh contributor photos"
          body: |
            Refresh the README from repository contributors and merged PR authors.
            Apply the reviewed account aliases and exclusions in `scripts/contributors.json`.

            Generated from the default branch by the contributor refresh workflow.
            Review the README diff and run the normal checks before merging.
