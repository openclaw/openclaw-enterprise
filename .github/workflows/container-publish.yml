name: Enterprise Containers

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full main SHA, which must equal the selected workflow revision
        required: true
        type: string
      ci_run_id:
        description: Successful main push run of CI for exactly source_sha
        required: true
        type: string
      image_tag:
        description: Mutable image tag (defaults to latest; overrides it when set)
        required: false
        type: string
      publish:
        description: Publish prepared images after automated validation
        required: true
        default: false
        type: boolean
      publish_chart:
        description: Also publish the Helm chart and OCE version tags (requires publish)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ inputs.source_sha }}
  CI_RUN_ID: ${{ inputs.ci_run_id }}
  NODE_BASE_IMAGE: ${{ vars.CONTAINER_NODE_BASE_IMAGE }}
  IMAGE_TAG: ${{ inputs.image_tag }}

# Hold the shared publication lock until both image and optional chart jobs finish.
# Preparation-only runs neither block publication nor cancel one another.
concurrency:
  group: ${{ inputs.publish && 'enterprise-container-publish' || format('enterprise-container-prepare-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      ci_attempt: ${{ steps.gate.outputs.ci_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.16.0"
      - name: Validate trusted source and exact successful CI
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ inputs.publish }}
        run: node scripts/ci/container-release.mjs validate

  prepare:
    needs: validate
    uses: ./.github/workflows/container-check.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      ci_run_id: ${{ inputs.ci_run_id }}
      ci_attempt: ${{ needs.validate.outputs.ci_attempt }}
      node_base_image: ${{ vars.CONTAINER_NODE_BASE_IMAGE }}

  assemble:
    name: Assemble ${{ matrix.image }} OCI image
    needs: [validate, prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: [controller, runtime]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.16.0"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: platform-${{ matrix.image }}-amd64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/oci/amd64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: platform-${{ matrix.image }}-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/oci/arm64
      - name: Assemble and seal tested platform bytes without rebuilding
        env:
          IMAGE: ${{ matrix.image }}
          CI_ATTEMPT: ${{ needs.validate.outputs.ci_attempt }}
        run: |
          node scripts/ci/container-release.mjs assemble "$RUNNER_TEMP/oci"
          IMAGE_DIGEST="$(sed -n 's/^digest=//p' "$GITHUB_OUTPUT")"
          export IMAGE_DIGEST
          node scripts/ci/container-release.mjs seal "$RUNNER_TEMP/oci"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-${{ matrix.image }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/oci
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish exact OCI digests to public GHCR
    if: ${{ inputs.publish }}
    needs: [validate, assemble]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: container-publish
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.16.0"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: container-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/prepared
      - name: Install OCI transport
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install --no-install-recommends -y skopeo
          skopeo --version | grep -Fx 'skopeo version 1.13.3'
      - name: Revalidate public packages, CI and bytes before transfer
        env:
          GH_TOKEN: ${{ github.token }}
          CI_ATTEMPT: ${{ needs.validate.outputs.ci_attempt }}
          GHCR_CONTROLLER_IMAGE: ${{ vars.GHCR_CONTROLLER_IMAGE }}
          GHCR_RUNTIME_IMAGE: ${{ vars.GHCR_RUNTIME_IMAGE }}
          PUBLISH: "true"
        run: node scripts/ci/container-release.mjs publish "$RUNNER_TEMP/prepared"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/prepared/publication.json
          if-no-files-found: error
          retention-days: 30

  publish-chart:
    name: Publish optional Helm chart and OCE version tags
    if: ${{ inputs.publish && inputs.publish_chart }}
    needs: [validate, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: container-publish
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.16.0"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: container-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/prepared
      - name: Install OCI transport
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install --no-install-recommends -y skopeo
          skopeo --version | grep -Fx 'skopeo version 1.13.3'
      - name: Install pinned Helm
        run: |
          bash scripts/ci/download-pinned.sh \
            https://get.helm.sh/helm-v3.19.2-linux-amd64.tar.gz \
            "$RUNNER_TEMP/helm.tar.gz" \
            2114c9dea2844dce6d0ee2d792a9aae846be8cf53d5b19dc2988b5a0e8fec26e
          tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C "$RUNNER_TEMP" linux-amd64/helm
          echo "$RUNNER_TEMP/linux-amd64" >> "$GITHUB_PATH"
      - name: Publish OCE chart and matching image version tags
        env:
          GH_TOKEN: ${{ github.token }}
          CI_ATTEMPT: ${{ needs.validate.outputs.ci_attempt }}
          GHCR_CONTROLLER_IMAGE: ${{ vars.GHCR_CONTROLLER_IMAGE }}
          GHCR_RUNTIME_IMAGE: ${{ vars.GHCR_RUNTIME_IMAGE }}
          PUBLISH: "true"
        run: node scripts/ci/chart-release.mjs publish "$RUNNER_TEMP/prepared"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chart-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/prepared/chart-publication.json
          if-no-files-found: error
          retention-days: 30

  summary:
    name: Report publication outcomes
    if: ${{ always() }}
    needs: [validate, prepare, assemble, publish, publish-chart]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Summarize image and chart results
        env:
          IMAGES_REQUESTED: ${{ inputs.publish }}
          CHART_REQUESTED: ${{ inputs.publish && inputs.publish_chart }}
          IMAGE_RESULT: ${{ needs.publish.result }}
          CHART_RESULT: ${{ needs.publish-chart.result }}
        run: |
          {
            echo '## Publication outcomes'
            echo "Images: requested=$IMAGES_REQUESTED, result=$IMAGE_RESULT"
            echo "Chart and OCE version tags: requested=$CHART_REQUESTED, result=$CHART_RESULT"
            echo 'See the publication job summaries and receipt artifacts for verified digests.'
          } >> "$GITHUB_STEP_SUMMARY"
