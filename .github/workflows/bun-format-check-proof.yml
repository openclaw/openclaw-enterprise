name: Bun formatter check proof

on:
  push:
    branches: [investigate/enterprise-bun-proof-20261102]

permissions:
  contents: read

env:
  PROOF_CANDIDATE_SHA: d7a25a56a590c275f1ab40d95ad420191fc3e111
  PROOF_BASELINE_SHA: 37691090205994957cbe4df506ee1315d5e29732

jobs:
  cold:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PROOF_MODE: cold
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.PROOF_CANDIDATE_SHA }}
          fetch-depth: 2
          path: source
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          package_json_file: source/package.json
      - name: Install baseline from empty task cache
        working-directory: source
        run: |
          test ! -e "$RUNNER_TEMP/checker-pnpm-store"
          time pnpm install --frozen-lockfile --ignore-scripts --store-dir "$RUNNER_TEMP/checker-pnpm-store"
      - name: Provision cold Bun without restoring a tool cache
        id: bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: source/.bun-version
          no-cache: true
      - name: Exact-head readonly checks and negative controls
        env:
          PROOF_BUN_CACHE_HIT: ${{ steps.bun.outputs.cache-hit }}
        run: node harness/.github/bun-format-check-proof.mjs
      - name: Focused native workflow contract tests
        working-directory: source
        run: node --test --test-name-pattern 'Suite Audit and Static Checks|every formatting check provisions' tests/integration/ci-impact.test.mjs
      - name: Save exact task-only dependency and reference content cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ runner.temp }}/checker-pnpm-store
            ${{ runner.temp }}/checker-content-cache
          key: bun-format-check-${{ github.sha }}
  restored:
    needs: cold
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PROOF_MODE: restored
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.PROOF_CANDIDATE_SHA }}
          fetch-depth: 2
          path: source
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          package_json_file: source/package.json
      - name: Restore exact task-only cache into fresh workspace
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ runner.temp }}/checker-pnpm-store
            ${{ runner.temp }}/checker-content-cache
          key: bun-format-check-${{ github.sha }}
          fail-on-cache-miss: true
      - name: Require actual dependency cache hit
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: test "$CACHE_HIT" = true
      - name: Install frozen dependencies into fresh source checkout
        working-directory: source
        run: time pnpm install --frozen-lockfile --ignore-scripts --store-dir "$RUNNER_TEMP/checker-pnpm-store"
      - name: Restore pinned Bun using the normal setup action
        id: bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: source/.bun-version
      - name: Exact-head readonly checks and negative controls
        env:
          PROOF_BUN_CACHE_HIT: ${{ steps.bun.outputs.cache-hit }}
        run: node harness/.github/bun-format-check-proof.mjs
