name: QA Matrix Advisory

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  push:
    branches:
      - main
  workflow_dispatch:
  # Every 6 hours, so the local installation rehearsal (skipped on push) runs on main without a label.
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

# Finish every main commit. For an opted-in PR, a new commit replaces the old run.
# An unrelated label event gets its own group so it cannot cancel that qualification.
concurrency:
  group: >-
    qa-advisory-${{ github.event_name }}-${{
      github.event_name == 'push' && github.sha ||
      github.event_name == 'pull_request' &&
      (github.event.action != 'labeled' || github.event.label.name == 'full-qa' || github.event.label.name == 'qa-openshell-compose' || github.event.label.name == 'qa-keycloak-installation' || github.event.label.name == 'qa-openclaw-model-ui') &&
      format('pr-{0}', github.event.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The ordinary PR signal is in ci.yml. The label requests extra coverage; it
  # does not grant trust. PR jobs use the normal pull_request merge commit
  # and the existing integration-qa-pr environment.
  # Push runs are paused until the integration-qa-pr credentials work again
  # (finding 2524: CODEX_ACCESS_TOKEN failed from 2026-10-23). The schedule,
  # full-qa and manual runs are unchanged. To run on every main push again, set
  # the repository variable QA_ADVISORY_ON_PUSH to 'true'. The other jobs need
  # this one, so they skip with it.
  eligibility:
    name: Select advisory QA
    if: >-
      (github.ref == 'refs/heads/main' &&
        ((github.event_name == 'push' && vars.QA_ADVISORY_ON_PUSH == 'true') ||
         github.event_name == 'schedule' ||
         (github.event_name == 'workflow_dispatch' && github.actor != 'dependabot[bot]'))) ||
      (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]' &&
        (github.event.action != 'labeled' || github.event.label.name == 'full-qa' || github.event.label.name == 'qa-openshell-compose' || github.event.label.name == 'qa-keycloak-installation' || github.event.label.name == 'qa-openclaw-model-ui') &&
        (contains(github.event.pull_request.labels.*.name, 'full-qa') ||
         contains(github.event.pull_request.labels.*.name, 'qa-openshell-compose') ||
         contains(github.event.pull_request.labels.*.name, 'qa-keycloak-installation') ||
         contains(github.event.pull_request.labels.*.name, 'qa-openclaw-model-ui')))
    runs-on: ubuntu-24.04
    outputs:
      openshell: ${{ steps.selection.outputs.openshell }}
      installation: ${{ steps.selection.outputs.installation }}
      qa: ${{ steps.selection.outputs.qa }}
      oidc: ${{ steps.selection.outputs.oidc }}
      focused: ${{ steps.selection.outputs.focused }}
      openshell-matrix: ${{ steps.selection.outputs.openshell-matrix }}
      installation-matrix: ${{ steps.selection.outputs.installation-matrix }}
      qa-matrix: ${{ steps.selection.outputs.qa-matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Select advisory jobs and record source
        id: selection
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { appendFileSync, readFileSync } from 'node:fs';
          import { basename } from 'node:path';

          const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const labels = new Set((event.pull_request?.labels ?? []).map(({ name }) => name.toLowerCase()));
          const full = process.env.GITHUB_EVENT_NAME !== 'pull_request' || labels.has('full-qa');
          const focused = !full;
          const select = (lane, requested) => {
            const files = JSON.parse(readFileSync(`scripts/ci/test-suites/${lane}.json`, 'utf8')).files;
            const paths = requested ?? files.map(({ path }) => path);
            assert(requested !== undefined || paths.length > 0, 'A full selection requires a nonempty manifest.');
            assert(paths.every((path) => files.filter((file) => file.path === path).length === 1), 'Each selected file must occur once in its manifest.');
            assert.equal(new Set(paths).size, paths.length, 'Selected files must be unique.');
            return paths.map((file) => ({ file, shard: basename(file).replace(/\.test\.(mjs|ts)$/, '') }));
          };
          let openshellFiles = [];
          let installationFiles = [];
          const qa = [];
          if (full) {
            openshellFiles = undefined;
            installationFiles = process.env.GITHUB_EVENT_NAME === 'push' ? [] : undefined;
            qa.push(...['compose', 'kubernetes'].map((installation) => ({ installation, preset: 'Codex', scenarios: 'console-secrets', focused: false })));
          } else {
            if (labels.has('qa-openshell-compose')) {
              openshellFiles.push('tests/integration/local-first-agent-openshell-real.test.mjs');
            }
            if (labels.has('qa-keycloak-installation')) {
              installationFiles.push('tests/integration/dev-up-k3d-keycloak-real.test.ts');
            }
            if (labels.has('qa-openclaw-model-ui')) {
              qa.push({ installation: 'kubernetes', preset: 'OpenClaw', scenarios: 'model-ui', focused: true });
            }
          }
          const openshell = select('openshell', openshellFiles);
          const installation = select('dev-up-k3d', installationFiles);
          const source = { sha: process.env.GITHUB_SHA, run: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT };
          if (focused) {
            assert.equal(process.env.GITHUB_REF, `refs/pull/${event.number}/merge`);
            assert.equal(execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(), source.sha);
            const headers = execFileSync('git', ['cat-file', '-p', 'HEAD'], { encoding: 'utf8' }).split('\n\n')[0];
            const parents = [...headers.matchAll(/^parent ([a-f0-9]{40})$/gm)].map((match) => match[1]);
            assert.deepEqual(parents, [event.pull_request.base.sha, event.pull_request.head.sha], 'PR merge parents must match the event base and head.');
            Object.assign(source, { pr: event.number, ref: process.env.GITHUB_REF, parents });
          }
          const groups = { openshell, installation, qa };
          for (const [name, include] of Object.entries(groups)) {
            appendFileSync(process.env.GITHUB_OUTPUT, `${name}=${include.length > 0}\n${name}-matrix=${JSON.stringify({ include })}\n`);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `oidc=${full}\nfocused=${focused}\n`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Advisory selection and source:\n\n\`\`\`json\n${JSON.stringify({ ...source, groups, oidc: full }, null, 2)}\n\`\`\`\n`);
          JS

  local-installation:
    name: QA advisory (local installation / ${{ matrix.shard }})
    needs: eligibility
    if: needs.eligibility.outputs.installation == 'true'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.eligibility.outputs.installation-matrix) }}
    timeout-minutes: 180
    env:
      CI: "1"
      NODE_BASE_IMAGE: ${{ vars.CONTAINER_NODE_BASE_IMAGE }}
      OCC_TEST_BROWSER_EXECUTABLE: ${{ needs.eligibility.outputs.focused == 'true' && '/usr/bin/google-chrome' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Pull Docker Hub images through a mirror
        run: bash scripts/ci/docker-hub-mirror.sh setup
      - uses: ./.github/actions/run-ci-lane
        with:
          lane: dev-up-k3d
          test-file: ${{ matrix.file }}
          profile: full
          node-version: "24.22.1"
          artifact-prefix: qa-advisory-local-installation-${{ matrix.shard }}
          job-timeout-minutes: 180
      - name: Show Docker Hub pull endpoints
        if: ${{ !cancelled() }}
        run: bash scripts/ci/docker-hub-mirror.sh report

  qa:
    name: QA advisory (${{ matrix.installation }})
    needs: eligibility
    if: needs.eligibility.outputs.qa == 'true'
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 120
    environment: integration-qa-pr
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.eligibility.outputs.qa-matrix) }}
    env:
      CI: "1"
      NODE_BASE_IMAGE: ${{ vars.CONTAINER_NODE_BASE_IMAGE }}
      # The Compose launcher otherwise resolves the +v1.35 K3s channel online (update.k3s.io).
      # Keep in step with defaultK3sImage in scripts/ci/prepare.mjs.
      OCC_DEVELOPMENT_K3S_IMAGE: docker.io/rancher/k3s:v1.35.9-k3s1@sha256:ec9868c6a38d4e8c1869832fb5fd1eb8473c39794a0b44d2b952e7ba911951bc
      OCC_TEST_QA_INSTALLATION: ${{ matrix.installation }}
      OCC_TEST_QA_PRESET: ${{ matrix.preset }}
      OCC_TEST_QA_SCENARIOS: ${{ matrix.scenarios }}
      OCC_TEST_QA_SOURCE_SHA: ${{ matrix.focused && github.sha || 'working-tree' }}
      OCC_TEST_QA_OPENAI_MODEL: ${{ matrix.focused && vars.OCC_TEST_OPENAI_MODEL || '' }}
      OCC_TEST_BROWSER_EXECUTABLE: ${{ matrix.focused && '/usr/bin/google-chrome' || '' }}
      OCC_TEST_QA_CODEX_MODEL: ${{ vars.OCC_TEST_QA_CODEX_MODEL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.22.1"
      - name: Materialize selected QA credentials
        if: ${{ !matrix.focused }}
        env:
          CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
        run: node scripts/ci/qa-matrix-credentials.mjs
      - name: Materialize focused OpenClaw credentials
        if: matrix.focused
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          assert(process.env.OPENAI_API_KEY?.trim(), 'Focused OpenClaw QA requires OPENAI_API_KEY.');
          assert(process.env.OCC_TEST_QA_OPENAI_MODEL?.trim(), 'Focused OpenClaw QA requires OCC_TEST_OPENAI_MODEL.');
          await import('./scripts/ci/qa-matrix-credentials.mjs');
          JS
      - uses: ./.github/actions/run-ci-lane
        with:
          lane: qa-matrix
          test-file: tests/integration/qa-matrix-real.test.mjs
          profile: full
          node-version: "24.22.1"
          artifact-prefix: qa-advisory-${{ matrix.installation }}
          job-timeout-minutes: 120
      - name: Summarize selected scenarios
        if: always()
        run: node scripts/ci/qa-matrix-summary.mjs
      - name: Retain QA outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: qa-advisory-${{ matrix.installation }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qa-matrix-evidence/*.json
          if-no-files-found: warn
          retention-days: 7
      - name: Remove workflow credential inputs
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/qa-matrix-credentials"

  oidc-agent-chat:
    name: QA advisory (OIDC Agent chat)
    needs: eligibility
    if: needs.eligibility.outputs.oidc == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: integration-qa-pr
    env:
      NODE_BASE_IMAGE: ${{ vars.CONTAINER_NODE_BASE_IMAGE }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OCC_TEST_OPENAI_MODEL: ${{ vars.OCC_TEST_OPENAI_MODEL }}
      OCC_TEST_BROWSER_EXECUTABLE: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/run-ci-lane
        with:
          lane: gateway-routing
          test-file: tests/integration/oidc-agent-chat-k3d-real.test.ts
          profile: full
          node-version: "24.22.1"
          artifact-prefix: qa-advisory-oidc-agent-chat
          job-timeout-minutes: 120

  openshell:
    name: QA advisory (OpenShell / ${{ matrix.shard }})
    needs: eligibility
    if: needs.eligibility.outputs.openshell == 'true'
    # OpenShell requires Landlock, which the Blacksmith kernel does not provide.
    # Each file gets a separate VM, Docker daemon, prepared cluster and private state.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: integration-qa-pr
    strategy:
      fail-fast: false
      # Bound provider concurrency while independent security workflows use separate clusters.
      max-parallel: 10
      matrix: ${{ fromJSON(needs.eligibility.outputs.openshell-matrix) }}
    env:
      # The packaged browser has Ubuntu's AppArmor user-namespace permission.
      OCC_TEST_BROWSER_EXECUTABLE: /usr/bin/google-chrome
      # The registered plugin-install case uses this admitted curated selection.
      OCC_TEST_CODEX_INSTALL_PLUGIN_ID: codex-plugin:linear@openai-curated-remote
      NODE_BASE_IMAGE: ${{ vars.CONTAINER_NODE_BASE_IMAGE }}
      CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OCC_TEST_OPENAI_MODEL: ${{ vars.OCC_TEST_OPENAI_MODEL }}
    steps:
      - name: Verify Landlock support
        run: |
          python3 - <<'PYTHON'
          import ctypes
          import os
          import platform

          assert platform.machine() == "x86_64", "This probe requires the x86_64 runner."
          # x86_64 __NR_landlock_create_ruleset, LANDLOCK_CREATE_RULESET_VERSION.
          libc = ctypes.CDLL(None, use_errno=True)
          abi = libc.syscall(444, 0, 0, 1)
          if abi < 3:
              raise SystemExit(f"OpenShell requires Landlock ABI >=3; got {abi}, errno={ctypes.get_errno()}")
          print(f"Kernel {os.uname().release}: Landlock ABI {abi}")
          PYTHON
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/run-ci-lane
        with:
          lane: openshell
          test-file: ${{ matrix.file }}
          profile: full
          node-version: "24.22.1"
          artifact-prefix: qa-advisory-${{ matrix.shard }}
          job-timeout-minutes: 120
