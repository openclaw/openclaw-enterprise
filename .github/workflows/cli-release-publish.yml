name: Publish OCC CLI

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      ci_run_id:
        required: true
        type: string
      ci_attempt:
        required: true
        type: string
      artifact_name:
        required: true
        type: string
      artifact_run_id:
        required: true
        type: string
      sha256sums_digest:
        required: true
        type: string

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ inputs.source_sha }}
  CI_RUN_ID: ${{ inputs.ci_run_id }}

jobs:
  publish:
    name: Publish verified CLI assets as a GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: container-publish
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.22.1"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.artifact_run_id }}
          name: ${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/occ-cli
      - name: Revalidate source and publish exact prepared bytes
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          CI_ATTEMPT: ${{ inputs.ci_attempt }}
          CLI_SHA256SUMS_DIGEST: ${{ inputs.sha256sums_digest }}
        run: node scripts/ci/cli-release.ts publish "$RUNNER_TEMP/occ-cli"
      - name: Report the tag and release assets after interrupted publication
        if: ${{ (failure() || cancelled()) && steps.publish.outcome != 'skipped' }}
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/cli-release.ts report
