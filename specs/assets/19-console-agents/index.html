<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  /><title>Agent management wireframes</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #fafbf9;
      color: #24332c;
      font: 15px system-ui;
    }
    button,
    input,
    select,
    textarea {
      font: inherit;
    }
    button {
      cursor: pointer;
      padding: 10px 16px;
      border: 1px solid #d5ded7;
      border-radius: 7px;
      background: white;
      color: inherit;
    }
    button:hover {
      background: #eaf1ec;
    }
    .primary {
      background: #195e4c;
      color: white;
    }
    .danger {
      color: #a02521;
      border-color: #a02521;
    }
    header {
      padding: 15px 24px;
      background: #203d32;
      color: white;
    }
    header small {
      color: #d0dfd5;
    }
    .states {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      padding: 15px 24px;
      background: #eff3ef;
      border-bottom: 1px solid #d5ded7;
    }
    .states button {
      padding: 7px 12px;
    }
    .shell {
      display: grid;
      grid-template-columns: 246px 1fr;
      min-height: 760px;
    }
    aside {
      padding: 28px 18px;
      background: #f0f3f0;
      border-right: 1px solid #d5ded7;
    }
    aside strong {
      display: block;
      margin-bottom: 30px;
    }
    aside p {
      padding: 12px;
      border-radius: 8px;
    }
    aside p:first-of-type {
      background: #dfeae2;
      color: #195e4c;
    }
    .account-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 13px;
      font-weight: 550;
    }
    .account-label {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .account-chevron {
      flex-shrink: 0;
    }
    main {
      padding: 28px 40px;
      max-width: 1350px;
      width: 100%;
    }
    h1 {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.7px;
      margin: 5px 0 8px;
    }
    h2 {
      font-size: 19px;
    }
    p {
      line-height: 1.6;
    }
    .muted,
    small {
      color: #647169;
    }
    .top,
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    .card {
      border: 1px solid #d5ded7;
      background: white;
      padding: 24px;
      border-radius: 12px;
      margin: 20px 0;
    }
    .notice {
      border: 1px solid #d7ddbd;
      background: #f8faec;
      padding: 15px 18px;
      border-radius: 8px;
      margin: 18px 0;
    }
    .tabs {
      display: flex;
      gap: 12px;
      border-bottom: 1px solid #d5ded7;
      padding: 18px 0 0;
    }
    .tabs button {
      border: 0;
      border-radius: 0;
      background: none;
    }
    .tabs .selected {
      border-bottom: 2px solid #195e4c;
      font-weight: 600;
    }
    .badge {
      background: #e8f0e9;
      padding: 5px 9px;
      border-radius: 6px;
      font-size: 12px;
      white-space: nowrap;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    label {
      display: block;
      font-weight: 600;
      margin: 20px 0 8px;
    }
    input,
    select,
    textarea {
      padding: 11px;
      border: 1px solid #bbc9be;
      border-radius: 7px;
      width: 100%;
      background: white;
      color: inherit;
    }
    textarea {
      min-height: 320px;
      resize: vertical;
      font:
        14px/1.5 ui-monospace,
        monospace;
      tab-size: 2;
    }
    .configuration-heading {
      margin-top: 24px;
      margin-bottom: 8px;
    }
    .configuration-heading label {
      margin: 0;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 25px 0;
    }
    th,
    td {
      text-align: left;
      padding: 20px 12px;
      border-bottom: 1px solid #d5ded7;
    }
    th {
      font-weight: 500;
      color: #647169;
      font-size: 13px;
    }
    td small {
      display: block;
      margin-top: 5px;
    }
    a {
      color: #195e4c;
      text-decoration: none;
      cursor: pointer;
    }
    code,
    pre {
      font:
        13px ui-monospace,
        monospace;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    pre {
      background: #f4f6f3;
      padding: 16px;
      border-radius: 7px;
    }
    .empty {
      text-align: center;
      padding: 65px 20px;
    }
    .overlay {
      position: fixed;
      inset: 0;
      background: #152b2466;
      display: flex;
      justify-content: flex-end;
      z-index: 3;
    }
    .drawer {
      width: 540px;
      max-width: 100%;
      background: white;
      padding: 26px;
      display: flex;
      flex-direction: column;
      overflow: auto;
    }
    .bottom {
      margin-top: auto;
      padding-top: 30px;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
    .modal {
      width: 510px;
      max-width: 95%;
      background: white;
      border-radius: 12px;
      padding: 28px;
      margin: auto;
    }
    .error {
      color: #9a2923;
    }
    .crumb {
      font-size: 13px;
      color: #195e4c;
    }
    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible {
      outline: 3px solid #689881;
      outline-offset: 2px;
    }
    @media (max-width: 760px) {
      .shell {
        grid-template-columns: 1fr;
      }
      aside {
        display: none;
      }
      main {
        padding: 20px;
      }
      .grid {
        grid-template-columns: 1fr;
      }
      .top {
        align-items: flex-start;
      }
      table {
        font-size: 13px;
      }
      th,
      td {
        padding: 12px 5px;
      }
      .row {
        flex-wrap: wrap;
      }
    }
  </style>
  <header>
    <strong>Agent management · Wireframes</strong>　<small
      >Sample data · Not connected to an API</small
    >
  </header>
  <nav class="states" aria-label="Wireframe states"></nav>
  <div id="screen"></div>
  <div id="overlay"></div>
  <script>
    const screen = document.querySelector("#screen"),
      overlay = document.querySelector("#overlay");
    let current = "list";
    const states = {
      list: "1 · Agent list",
      empty: "2 · Empty list",
      create: "3 · Create Agent",
      detail: "4 · Active revision",
      history: "5 · Past revision",
      channels: "6 · Channels",
      slack: "7 · Slack setup",
      teams: "8 · Teams setup",
      delete: "9 · Delete confirmation",
      failure: "10 · Delete error",
    };
    for (const [id, label] of Object.entries(states)) {
      const b = document.createElement("button");
      b.textContent = label;
      b.onclick = () => show(id);
      document.querySelector(".states").append(b);
    }
    const action = (label, to, cls = "") =>
      `<button class="${cls}" onclick="show('${to}')">${label}</button>`;
    const field = (label, value, hint = "") =>
      `<label>${label}<input value="${value}"></label><small>${hint}</small>`;
    function configurationTemplate(mode) {
      const harnessId = mode === "dedicated" ? "codex" : "openclaw";
      const providerId = mode === "dedicated" ? "codex" : "openai";
      const modelReference = `${providerId}/gpt-5.1`;
      return JSON.stringify(
        {
          gateway: {
            mode: "local",
            bind: "lan",
            controlUi: { enabled: false },
            auth: { mode: "token", token: "${OPENCLAW_GATEWAY_TOKEN}" },
            http: { endpoints: { chatCompletions: { enabled: true } } },
          },
          agents: {
            defaults: {
              model: modelReference,
              models: { [modelReference]: { agentRuntime: { id: harnessId } } },
            },
          },
          models: {
            providers: {
              [providerId]: {
                baseUrl: mode === "dedicated" ? "http://127.0.0.1:9" : "https://api.openai.com/v1",
                api: "openai-responses",
                models: [{ id: "gpt-5.1", name: "gpt-5.1" }],
              },
            },
          },
          ...(mode === "dedicated"
            ? {
                plugins: {
                  allow: ["codex"],
                  entries: {
                    codex: {
                      enabled: true,
                      config: {
                        appServer: {
                          mode: "guardian",
                          approvalPolicy: "on-request",
                          sandbox: "read-only",
                          transport: "websocket",
                          url: "${APP_SERVER_URL}",
                          authToken: "${APP_SERVER_TOKEN}",
                        },
                      },
                    },
                  },
                },
              }
            : {}),
        },
        null,
        2,
      );
    }
    let appliedTemplate = "";
    function resetConfigurationTemplate() {
      appliedTemplate = configurationTemplate(document.querySelector("#execution-mode").value);
      document.querySelector("#configuration-json").value = appliedTemplate;
    }
    function changeExecutionMode() {
      const editor = document.querySelector("#configuration-json");
      if (editor.value === appliedTemplate) resetConfigurationTemplate();
    }
    function shell(body, title = "Agents") {
      return `<div class="shell"><aside><strong>CONTROL PLANE</strong><p>◇　Agents</p><p>◈　Providers</p><p>▤　Namespaces</p><div style="margin-top:390px"><small>Namespace · Support</small><p class="account-toggle"><span class="account-label">OpenClaw Enterprise</span><span class="account-chevron" aria-hidden="true">▾</span></p></div></aside><main>${body}</main></div>`;
    }
    function heading(title, actions = "") {
      return `<div class="top"><div><h1>${title}</h1><p class="muted">Namespace · Support</p></div><div>${actions}</div></div>`;
    }
    function detailBase(history = false, channels = false) {
      return `<p class="crumb"><a onclick="show('list')">Agents</a> / Support Agent</p>${heading("Support Agent", action("Delete Agent", "delete", "danger"))}<p><code>agt_…7f29</code>　<span class="badge">Active revision · v3</span>　<span class="badge">Dedicated</span></p><section class="card"><div class="row"><div><small>Inspect configuration</small><h2>${history ? "AgentRevision v2" : "AgentRevision v3"}　<span class="badge">${history ? "Historical · read-only" : "Active · read-only"}</span></h2><small>${history ? "Aug 30, 2026 · cfg_support · generation 4" : "Sep 1, 2026 · cfg_support · generation 6"}</small></div><div>${action("‹ Older", "history")} ${action("Newer ›", "detail")}</div></div><label>AgentRevision<select onchange="show(this.value)"><option value="${history ? "history" : "detail"}">${history ? "v2 · Aug 30 · Not active" : "v3 · Sep 1 · Active"}</option><option value="${history ? "detail" : "history"}">${history ? "v3 · Sep 1 · Active" : "v2 · Aug 30 · Not active"}</option></select></label><p>${action("Saved draft", "channels")} ${history ? action("Return to active revision", "detail") : ""}</p></section>${history ? '<div class="notice">You are inspecting a historical snapshot. All values below belong to v2. Browsing does not change the running Agent.</div>' : ""}<div class="tabs">${action("Configuration", history ? "history" : "detail", channels ? "" : "selected")}${action("Channels", "channels", channels ? "selected" : "")}</div>`;
    }
    function show(id) {
      current = id;
      overlay.innerHTML = "";
      let body = "";
      if (id === "list" || id === "empty") {
        body =
          heading("Agents", action("Create Agent", "create", "primary")) +
          `<input aria-label="Search agents" placeholder="Search Agents" style="max-width:350px">`;
        body +=
          id === "empty"
            ? `<section class="card empty"><h2>No Agents yet</h2><p>Create your first Agent in Support with a starter configuration template.</p>${action("Create Agent", "create", "primary")}</section>`
            : `<table><thead><tr><th>Agent</th><th>Execution mode</th><th>Active revision</th><th>Created</th></tr></thead><tbody><tr><td><a onclick="show('detail')"><strong>Support Agent</strong></a><small>agt_…7f29</small></td><td>Dedicated</td><td><a onclick="show('detail')">rev_…9a42</a></td><td>Aug 29, 2026</td></tr><tr><td><a onclick="show('channels')"><strong>Triage Agent</strong></a><small>agt_…19b0</small></td><td>Dedicated</td><td>No active revision</td><td>Sep 1, 2026</td></tr></tbody></table>`;
      } else if (id === "create") {
        body = `<p class="crumb"><a onclick="show('list')">Agents</a> / Create</p>${heading("Create Agent")}<p class="muted">Save a named Agent in this Namespace. Creation does not deploy it.</p><section class="card" style="max-width:750px">${field("Agent name", "Support Agent", "Unique within Support.")}<label>Execution mode<select id="execution-mode" onchange="changeExecutionMode()"><option value="dedicated">Dedicated</option><option value="embedded">Embedded</option></select></label><small>Slack and Microsoft Teams require Dedicated execution.</small><div class="grid"><div><label>Provider (optional)<select><option value="">None</option><option value="openai-primary">OpenAI primary</option></select></label><small>Select an installed Provider.</small></div><div><label>Service account (optional)<select><option value="">None</option><option value="sa_support">Support account</option></select></label><small>Select a service account from this Namespace.</small></div></div><div class="row configuration-heading"><label for="configuration-json">Configuration JSON</label><button onclick="resetConfigurationTemplate()">Reset template</button></div><textarea id="configuration-json" rows="16" spellcheck="false" aria-describedby="configuration-hint"></textarea><small id="configuration-hint">A starter template is applied. Edit it for this Agent. Changing execution mode preserves your edits; Reset template replaces them with the selected mode's template.</small><div class="bottom">${action("Cancel", "list")}${action("Create Agent", "channels", "primary")}</div></section>`;
      } else if (id === "detail" || id === "history") {
        body =
          detailBase(id === "history") +
          `<section class="card"><h2>Configuration snapshot</h2><div class="grid"><div><small>Model</small><p>codex/${id === "history" ? "gpt-5.1" : "gpt-5.6-sol"}</p><small>Harness</small><p>Codex · Dedicated</p></div><div><small>Provider</small><p>openai-primary</p><small>Source generation</small><p>${id === "history" ? "4" : "6"}</p></div></div><details><summary>View admitted native configuration</summary><pre>{ "agents": { "defaults": { "model": "codex/gpt-5.6-sol" } },
  "channels": { "slack": { "enabled": true, "mode": "socket" } } }</pre></details></section>`;
      } else {
        body = `<p class="crumb"><a onclick="show('list')">Agents</a> / Support Agent</p>${heading("Support Agent", action("Delete Agent", "delete", "danger"))}<p><code>agt_…7f29</code>　<span class="badge">Active revision · v3</span>　<span class="badge">Dedicated</span></p><section class="card"><div class="row"><div><small>Inspect configuration</small><h2>Saved draft</h2><small>cfg_support · Generation 7</small></div>${action("View active AgentRevision v3", "detail")}</div></section><div class="notice">Changes here affect future deployments using this Configuration. Active and historical revisions stay unchanged.</div><div class="tabs">${action("Configuration", "detail")}${action("Channels", "channels", "selected")}</div><div class="row"><h2>Channels</h2><small>Live connection status unavailable</small></div><section class="card"><div class="row"><div><h2>Slack　<span class="badge">Configured · Enabled</span></h2><p>Socket mode · 2 selected channels · Mention required</p><small>C0123456789, C0987654321 · Credential references configured</small></div>${action("Edit Slack", "slack")}</div></section><section class="card"><div class="row"><div><h2>Microsoft Teams　<span class="badge">Not configured</span></h2><p>Application identity and password reference</p><small>Requires separately configured Bot Framework ingress.</small></div>${action("Configure Microsoft Teams", "teams")}</div></section>`;
      }
      screen.innerHTML = shell(body);
      if (id === "create") resetConfigurationTemplate();
      if (id === "slack" || id === "teams") {
        const slack = id === "slack";
        overlay.innerHTML = `<div class="overlay"><section class="drawer" role="dialog" aria-modal="true" aria-label="${slack ? "Edit Slack" : "Configure Microsoft Teams"}"><div class="row"><h2>${slack ? "Edit Slack" : "Configure Microsoft Teams"}</h2>${action("Close", "channels")}</div><p class="muted">Saved draft · cfg_support · Generation 7</p><div class="notice">Dedicated execution required. Credentials must be provisioned by your operator.</div><label><input type="checkbox" checked style="width:auto"> Enable ${slack ? "Slack" : "Microsoft Teams"}</label>${slack ? `${field("Slack channel IDs", "C0123456789, C0987654321", "Comma-separated IDs; only selected channels.")}${field("Allowed user IDs", "U0123456789", "Direct messages use an explicit allowlist.")}` : `${field("Application (client) ID", "00000000-0000-0000-0000-000000000000")}${field("Directory (tenant) ID", "11111111-1111-1111-1111-111111111111")}`}<label><input type="checkbox" checked style="width:auto"> Require a mention</label><h2>Credential references</h2><small>Unresolved references only. No token or password values are entered here.</small>${slack ? `${field("App token reference", "env / default / SLACK_APP_TOKEN")}${field("Bot token reference", "env / default / SLACK_BOT_TOKEN")}` : field("App password reference", "env / default / MSTEAMS_APP_PASSWORD")}<p class="muted">This Configuration may be shared by other Agents.</p><div class="bottom">${action("Cancel", "channels")}${action("Save configuration", "channels", "primary")}</div></section></div>`;
      }
      if (id === "delete" || id === "failure") {
        overlay.innerHTML = `<div class="overlay"><section class="modal" role="dialog" aria-modal="true" aria-label="Delete Agent"><h2>Delete Support Agent?</h2><p>Namespace · Support<br><code>agt_…7f29</code></p><div class="notice">Proposed interaction · Backend scope decision required.<br>The current API has no Agent deletion operation.</div><p>Deletion must coordinate workload cleanup and revision retention. Shared Configuration, service accounts, and Secrets are separate resources.</p>${id === "failure" ? '<p class="error" role="alert">Illustrative failure state: deletion could not be confirmed. Refresh Agent state before retrying.</p>' : ""}<div class="bottom">${action("Cancel", "channels")}<button class="danger" disabled>Delete unavailable</button></div><p><a onclick="show('failure')">Preview failure state</a></p></section></div>`;
      }
    }
    show("list");
  </script>
</html>
