<svg xmlns="http://www.w3.org/2000/svg" width="824" height="324" viewBox="0 0 824 324" role="img" aria-labelledby="title desc"><title id="title">Deploying a protected Agent revision</title><desc id="desc">Read down the three stages. The previous revision can serve until Compute verifies the original released workspace is serving.</desc><rect width="824" height="324" fill="#ffffff"/><rect width="824" height="50" fill="#21475b"/><text x="14" y="32" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#ffffff" font-weight="700">Stage</text><text x="144" y="32" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#ffffff" font-weight="700">Sandbox workspace</text><text x="483" y="32" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#ffffff" font-weight="700">Agent Gateway</text><rect y="50" width="824" height="91" fill="#f2f6f8"/><path d="M0 140H824" stroke="#bfced5"/><text x="14" y="92" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#182f42" font-weight="700">Prepare</text><text x="144" y="84" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#182f42" font-weight="400">Sandbox holds and identifies</text><text x="144" y="108" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#182f42" font-weight="400">the workspace.</text><text x="483" y="84" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#182f42" font-weight="400">Compute configures the new</text><text x="483" y="108" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#182f42" font-weight="400">Gateway for that workspace.</text><rect y="141" width="824" height="91" fill="#ffffff"/><path d="M0 231H824" stroke="#bfced5"/><text x="14" y="183" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#182f42" font-weight="700">Release</text><text x="144" y="175" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#182f42" font-weight="400">The original workspace</text><text x="144" y="199" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#182f42" font-weight="400">acknowledges release.</text><text x="483" y="175" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#182f42" font-weight="400">The previous revision</text><text x="483" y="199" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#182f42" font-weight="400">can keep serving.</text><rect y="232" width="824" height="91" fill="#f2f6f8"/><path d="M0 322H824" stroke="#bfced5"/><text x="14" y="274" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#182f42" font-weight="700">Activate</text><text x="144" y="266" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#182f42" font-weight="400">Compute separately verifies</text><text x="144" y="290" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#182f42" font-weight="400">the original is serving.</text><text x="483" y="255" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#182f42" font-weight="400">Traffic switches. The Gateway</text><text x="483" y="279" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#182f42" font-weight="400">checks the workspace on</text><text x="483" y="303" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#182f42" font-weight="400">each connection.</text><path d="M130 50v274 M469 50v274" stroke="#bfced5"/></svg>