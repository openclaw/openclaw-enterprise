routing:
  hostname: ""
  gatewayClassName: ""
  gatewayName: oce-harnesses
  envoyNamespace: envoy-gateway-system
  tlsSecretName: ""
  serviceType: ClusterIP
  # Source addresses observed by the DP ingress after any load-balancer NAT.
  controlPlaneCidrs: []
  envoyHttpsTargetPort: 10443
  envoyGatewayPodLabels:
    control-plane: envoy-gateway
    app.kubernetes.io/name: gateway-helm
dns:
  namespace: kube-system
  podLabels:
    k8s-app: kube-dns
# Container log and Event reads from Harness Pods by the control-plane API.
# Keep equal to the openclaw-enterprise chart's agentRuntimeLogs.enabled.
agentRuntimeLogs:
  enabled: true

# Additional namespace-scoped tenant role permissions for a selected Strands Credential Proxy.
# Enable only with a qualified enforcing network and trusted Pod/label writers in the execution namespace.
strandsBoxCredentialProxy:
  enabled: false
  # Same immutable sender image as drivers.credential_proxy.configuration.strandsBox.gatewayImage.
  gatewayImage: ""
