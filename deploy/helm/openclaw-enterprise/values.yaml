images:
  controller: ""

metrics:
  # Private listeners are available by default; paired selectors admit scrapers.
  enabled: true
  port: 9464
  scraperNamespaceLabels: {}
  scraperPodLabels: {}

logging:
  collector:
    # Keep disabled when an existing cluster Collector already owns CRI log files.
    enabled: false
    image: docker.io/otel/opentelemetry-collector-contrib:0.159.0@sha256:1f2c54a30e713fac6b3ae77a1ec84010c2007e29ced8ec666214fc2f6739c1cc
    configSecretName: occ-otel-collector-config
    envSecretName: occ-otel-collector-exporter
    metrics:
      enabled: true
      scraperNamespaceLabels: {}
      scraperPodLabels: {}
    exporter:
      cidr: ""
      namespaceLabels: {}
      podLabels: {}
      port: 443
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 384Mi
    state:
      sizeLimit: 128Mi
    tmp:
      sizeLimit: 64Mi

installation:
  name: openclaw-enterprise
  secretName: occ-installation-startup
  key: installation.yaml

auth:
  baseUrl: ""
  secretName: occ-auth
  secretKey: secret
  # Existing local password administrator's user ID. Required with auth.github,
  # auth.google or auth.oidc; it designates the recovery account when the API first starts with
  # external sign-in.
  recoveryUserId: ""
  # Who may sign in with a password once auth.github, auth.google or auth.oidc is enabled:
  # "all" (every enrolled account) or "recovery-only" (only the recovery account; everyone
  # else uses an external provider). Attach every ordinary account's external identity first:
  # accounts without one cannot sign in until an administrator attaches it.
  passwordSignIn: all
  # Optional GitHub browser sign-in for existing password accounts (API Pod only).
  # Needs an HTTPS baseUrl, auth.recoveryUserId and agentNativeAdmin.enabled: false.
  # Create the dedicated Secret first.
  github:
    enabled: false
    secretName: occ-github-login
    clientIdKey: client-id
    clientSecretKey: client-secret
    # Optional allowlist (RFC-0061): GitHub organization logins, and "org/team-slug" entries,
    # whose active members may sign in; at most 10 entries together. Empty admits any
    # attached GitHub identity. Set, the GitHub App needs the organization permission
    # Members: read and an installation on each listed organization; sign-in fails closed
    # when GitHub cannot answer the membership lookup.
    allowedOrgs: []
    allowedTeams: []
    # API Pod HTTPS egress for github.com and api.github.com. Empty allows TCP 443
    # to 0.0.0.0/0; list the web and api IPv4 ranges from api.github.com/meta to narrow it.
    egressCidrs: []
  # Optional Google sign-in (OpenID Connect) for existing password accounts (API Pod
  # only). Same requirements as auth.github; its Secret must differ from auth.github's.
  # Create the dedicated Secret first.
  google:
    enabled: false
    secretName: occ-google-login
    clientIdKey: client-id
    clientSecretKey: client-secret
    # Google Workspace hosted domains (the ID token's hd claim). Empty accepts any
    # Google account; set, it also requires a verified email address.
    allowedDomains: []
    # API Pod HTTPS egress for oauth2.googleapis.com and www.googleapis.com; browsers,
    # not the API, reach accounts.google.com. Empty allows TCP 443 to 0.0.0.0/0; Google
    # publishes no small stable range, so narrow it with an egress proxy.
    egressCidrs: []
  # Optional generic OpenID Connect sign-in (Keycloak, Okta, Entra ID, Auth0) for
  # existing password accounts (API Pod only). Same requirements as auth.github; its
  # Secret must differ from auth.github's and auth.google's. Copy issuer and the three URLs
  # from the IdP's discovery document: each must be https on port 443 on the issuer's
  # host, with no query or fragment. The API never runs discovery.
  oidc:
    enabled: false
    # The exact "iss" value, trailing slash included where the IdP uses one.
    issuer: ""
    authorizationUrl: ""
    tokenUrl: ""
    jwksUrl: ""
    secretName: occ-oidc-login
    clientIdKey: client-id
    clientSecretKey: client-secret
    # client_secret_post (default) or client_secret_basic.
    tokenAuth: client_secret_post
    # Console button label ("Continue with <displayName>"); empty means "single sign-on".
    displayName: ""
    # API Pod HTTPS egress for the token and JWKS URLs. Empty allows TCP 443 to any
    # address except link-local 169.254.0.0/16; list the IdP's IPv4 ranges to narrow it.
    egressCidrs: []

agentNativeAdmin:
  enabled: false
  domain: ""
  sharedCookieDomain: ""

# Console and API runtime status and container log reads (Agent administer for text).
# Grants pods/log get and events get,list to the tenant API and Gateway observer roles
# and sets OCC_AGENT_RUNTIME_LOGS_ENABLED. false removes both and the routes answer 501.
agentRuntimeLogs:
  enabled: true

bootstrap:
  adminEmail: ""
  password:
    claimName: ""
    mountPath: /var/lib/openclaw/bootstrap
    fileName: initial-admin-password
  serviceKey:
    fileName: initial-admin-service-key.json

backend:
  chatgpt:
    enabled: false
    secretName: occ-chatgpt-admin
    key: admin-key
    # IPv4 /32 destination seen by the pod network for api.chatgpt.com:443.
    # This permits network egress; it does not configure a forward proxy.
    providerCidr: ""

repositoryCredentials:
  enabled: false
  image: ""
  # Internal HTTPS Service name. Fresh installs default to git. Upgrades must
  # set this explicitly to the current Service name until repository sessions
  # drain, then switch it deliberately to git.
  serviceName: ""
  # Kubernetes cluster DNS suffix used to form the broker Service FQDN.
  clusterDomain: cluster.local
  # Optional exact Service hostname: <service>.<namespace>.svc or that name
  # followed by .<clusterDomain>. Empty selects the cluster-qualified name.
  # Preserve the current hostname during upgrades; it pins TLS and sessions.
  hostname: ""
  backendId: ""
  # Operator-created immutable, versioned ConfigMap shared by all three consumers.
  registryConfigMapName: ""
  registryKey: registry.json
  serviceConfigSecretName: ""
  serviceConfigKey: config.json
  appKeySecretName: ""
  appKeyKey: private-key.pem
  tlsSecretName: ""
  # Public trust only; must be separate from every private credential Secret.
  publicCaSecretName: ""
  publicCaKey: ca.crt
  upstreamCidrs: []

gatewayRouting:
  enabled: false
  # Empty derives the private Envoy Service DNS name:
  # occ-gateway-<route-hash>.<envoyNamespace>.svc.
  hostname: ""
  gatewayClassName: ""
  gatewayName: ""
  envoyNamespace: envoy-gateway-system
  apiKeySecretName: ""
  # Set caSecretName/caSecretKey only with an external issuerRef.name to mount
  # public CA trust into the API. Empty issuerRef.name generates a private CA.
  caSecretName: ""
  caSecretKey: ""
  tlsSecretName: ""
  serviceType: ClusterIP
  remoteNodeCidrs: []
  tenantGatewayPort: 8080
  envoyHttpsTargetPort: 10443
  sandbox:
    enabled: false
    # A dedicated wildcard domain outside the OCE session cookie domain.
    domain: ""
    # Existing wildcard HTTPS certificate in the release namespace.
    tlsSecretName: ""
    # Separate listener: public ingress must not admit the private admin port.
    listenerPort: 8443
    ingressPeers: []
  issuerRef:
    # Empty bootstraps a namespaced SelfSigned root and CA Issuer for the leaf.
    name: ""
    kind: ClusterIssuer
    group: cert-manager.io
  envoyGatewayPodLabels:
    control-plane: envoy-gateway
    app.kubernetes.io/name: gateway-helm

database:
  secretName: occ-database
  appUrlKey: application-url
  migrationUrlKey: migration-url
  caSecretName: ""
  caKey: ca.pem
  caMountPath: /etc/openclaw/database-ca
  cidrs: []
  port: 5432

api:
  port: 8080
  clients: []
  # Optional exact HTTP(S) proxy endpoint for API-side Slack directory lookup.
  # The proxy must allow CONNECT to slack.com:443; empty disables lookup in production.
  channelDirectoryProxyUrl: ""
  # Optional model-list discovery: API Pod HTTPS egress to provider IPv4 /32 hosts.
  # Codex device login (ChatGPT OAuth) also needs auth.openai.com here.
  # Operators maintain these addresses; Console model selection does not require it.
  modelDiscoveryCidrs: []
  # Trust client-address headers from a proxy in front of the API. Off by default:
  # the API then rejects forwarded headers and keys sign-in limits on the socket peer.
  # With a preset, requests whose socket peer is inside cidrs may carry forwarded
  # headers, and sign-in limits key on the client address from clientAddressHeader.
  # cidrs never include /0 and must match only proxies that overwrite or append it.
  #   ingress-nginx: cidrs = ingress controller Pod CIDR; header x-forwarded-for
  #     (x-real-ip also works). Keep use-forwarded-headers off in ingress-nginx.
  #   aws: ALB in front of the API; cidrs = ALB subnet CIDRs; header x-forwarded-for.
  #     An NLB preserves the client source address and needs no preset unless it
  #     forwards to ingress-nginx (then use ingress-nginx).
  #   generic: cidrs and clientAddressHeader are both required.
  trustedProxy:
    preset: ""
    cidrs: []
    # generic only; ingress-nginx and aws always read x-forwarded-for.
    clientAddressHeader: ""

slackProxy:
  # Optional chart-managed HTTP CONNECT proxy for Slack channel traffic. It is
  # inert until enabled. HTTPS egress excludes private and reserved IPv4 ranges.
  enabled: false
  serviceName: openclaw-enterprise-slack-proxy
  port: 3128
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

cluster:
  cidrs: []
  port: 443

controlPlane:
  nodeSelector: {}
  installationChecksum: ""

# Separate operator-provisioned DP credentials for the API and worker.
# The Installation selects /etc/openclaw/execution/kubeconfig explicitly.
executionCluster:
  enabled: false
  apiKubeconfigSecretName: ""
  workerKubeconfigSecretName: ""
  kubeconfigKey: kubeconfig
  apiCidrs: []
  apiPort: 6443

dns:
  namespace: kube-system
  podLabels:
    k8s-app: kube-dns

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

worker:
  pollIntervalMs: 250
  leaseDurationMs: 5000
  maxAttempts: 5
  convergenceTimeoutMs: 900000
