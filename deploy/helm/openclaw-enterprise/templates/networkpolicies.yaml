apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openclaw-enterprise-default-deny
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openclaw-enterprise
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openclaw-enterprise-api-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openclaw-enterprise
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- range .Values.api.clients }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .podLabels | nindent 14 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.api.port }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openclaw-enterprise-dependency-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openclaw-enterprise
      app.kubernetes.io/instance: {{ .Release.Name }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [api, worker, initialization]
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.dns.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.dns.podLabels | nindent 14 }}
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        {{- range .Values.database.cidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.database.port }}
    - to:
        {{- range .Values.cluster.cidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.cluster.port }}
{{- if not (kindIs "slice" .Values.api.modelDiscoveryCidrs) }}
{{- fail "api.modelDiscoveryCidrs must be a list of explicit IPv4 /32 hosts" }}
{{- end }}
{{- if .Values.api.modelDiscoveryCidrs }}
{{- range $cidr := .Values.api.modelDiscoveryCidrs }}
{{- if not (regexMatch "^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+/32$" (toString $cidr)) }}
{{- fail "api.modelDiscoveryCidrs entries must identify exactly one IPv4 host with /32" }}
{{- end }}
{{- range $octet := splitList "." (trimSuffix "/32" $cidr) }}
{{- if gt (int $octet) 255 }}
{{- fail "api.modelDiscoveryCidrs contains an invalid IPv4 address" }}
{{- end }}
{{- end }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openclaw-enterprise-api-model-discovery-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openclaw-enterprise
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  policyTypes: [Egress]
  egress:
    - to:
        {{- range .Values.api.modelDiscoveryCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 443
{{- end }}
{{- $directoryProxyUrl := .Values.api.channelDirectoryProxyUrl }}
{{- if not (kindIs "string" $directoryProxyUrl) }}
{{- fail "api.channelDirectoryProxyUrl must be an HTTP(S) literal IPv4 endpoint with an explicit port" }}
{{- end }}
{{- if $directoryProxyUrl }}
{{- if not (regexMatch "^https?://(0|[1-9][0-9]{0,2})(\\.(0|[1-9][0-9]{0,2})){3}:[1-9][0-9]{0,4}$" $directoryProxyUrl) }}
{{- fail "api.channelDirectoryProxyUrl must be an HTTP(S) literal IPv4 endpoint with an explicit port" }}
{{- end }}
{{- $proxyParts := splitList ":" (regexReplaceAll "^https?://" $directoryProxyUrl "") }}
{{- $proxyAddress := index $proxyParts 0 }}
{{- $proxyPort := int (index $proxyParts 1) }}
{{- range $octet := splitList "." $proxyAddress }}
{{- if gt (int $octet) 255 }}
{{- fail "api.channelDirectoryProxyUrl must contain valid IPv4 octets" }}
{{- end }}
{{- end }}
{{- if gt $proxyPort 65535 }}
{{- fail "api.channelDirectoryProxyUrl must contain a TCP port from 1 to 65535" }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openclaw-enterprise-api-channel-directory-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openclaw-enterprise
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: {{ $proxyAddress }}/32
      ports:
        - protocol: TCP
          port: {{ $proxyPort }}
{{- end }}
{{- if .Values.slackProxy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openclaw-enterprise-api-managed-slack-proxy-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openclaw-enterprise
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: openclaw-enterprise
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: slack-proxy
      ports:
        - protocol: TCP
          port: {{ .Values.slackProxy.port }}
{{- end }}
{{- if .Values.backend.chatgpt.enabled }}
{{- $providerCidr := .Values.backend.chatgpt.providerCidr }}
{{- if not (regexMatch "^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+/32$" $providerCidr) }}
{{- fail "backend.chatgpt.providerCidr must identify one IPv4 /32 destination for api.chatgpt.com:443; it does not configure a forward proxy" }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openclaw-enterprise-api-chatgpt-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openclaw-enterprise
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: {{ $providerCidr }}
      ports:
        - protocol: TCP
          port: 443
{{- end }}
{{- if and .Values.auth.github .Values.auth.github.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openclaw-enterprise-api-github-login-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openclaw-enterprise
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  policyTypes: [Egress]
  egress:
    # Empty egressCidrs permits HTTPS to any address for github.com and api.github.com.
    - to:
        {{- range (default (list "0.0.0.0/0") .Values.auth.github.egressCidrs) }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 443
{{- end }}
{{- if and .Values.auth.google .Values.auth.google.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openclaw-enterprise-api-google-login-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openclaw-enterprise
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  policyTypes: [Egress]
  egress:
    # The API calls only oauth2.googleapis.com and www.googleapis.com. Google publishes
    # no small stable range for them. Empty egressCidrs permits HTTPS to any address;
    # narrow it with an egress proxy.
    - to:
        {{- range (default (list "0.0.0.0/0") .Values.auth.google.egressCidrs) }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 443
{{- end }}

{{- if .Values.repositoryCredentials.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openclaw-enterprise-repository-credentials-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openclaw-enterprise
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: openclaw.dev/namespace
                operator: Exists
          podSelector:
            matchLabels:
              app.kubernetes.io/managed-by: openclaw-enterprise
              openclaw.dev/workload-role: gateway
            matchExpressions:
              - key: openclaw.dev/agent
                operator: Exists
        - namespaceSelector:
            matchExpressions:
              - key: openclaw.dev/namespace
                operator: Exists
          podSelector:
            matchLabels:
              app.kubernetes.io/managed-by: openclaw-enterprise
              openclaw.dev/workload-role: agent
            matchExpressions:
              - key: openclaw.dev/agent
                operator: Exists
              - key: openclaw.dev/revision
                operator: Exists
      ports:
        - protocol: TCP
          port: 8443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openclaw-enterprise-repository-provider-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openclaw-enterprise
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker
  policyTypes: [Egress]
  egress:
    - to:
        {{- range .Values.repositoryCredentials.upstreamCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 443
{{- end }}

{{- if .Values.executionCluster.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openclaw-enterprise-execution-api-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openclaw-enterprise
      app.kubernetes.io/instance: {{ .Release.Name }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [api, worker]
  policyTypes: [Egress]
  egress:
    - to:
        {{- range .Values.executionCluster.apiCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.executionCluster.apiPort }}
{{- end }}
