apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openclaw-enterprise-default-deny
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openclaw-enterprise
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
    # api-ingress isolates inbound API traffic. Operators own any API egress policy.
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: NotIn
        values: [api]
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openclaw-enterprise-api-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openclaw-enterprise
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
      app.kubernetes.io/component: api
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- range $index, $client := .Values.api.clients }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $client.namespace | quote }}
          podSelector:
            matchLabels:
              {{- include "openclaw.networkPolicy.matchLabels" (dict "name" (printf "api.clients[%d].podLabels" $index) "value" $client.podLabels) | nindent 14 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.api.port }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openclaw-enterprise-dependency-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openclaw-enterprise
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [worker, initialization]
  policyTypes: [Egress]
  egress:
    {{- include "openclaw.networkPolicy.dnsEgress" . | nindent 4 }}
    - to:
        {{- range .Values.database.cidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.database.port }}
    - to:
        {{- range .Values.cluster.cidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.cluster.port }}
{{- if include "openclaw.repositoryCredentials.gitEnabled" . }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openclaw-enterprise-repository-provider-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openclaw-enterprise
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
      app.kubernetes.io/component: worker
  policyTypes: [Egress]
  egress:
    - to:
        {{- range .Values.repositoryCredentials.upstreamCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          {{- $port := include "openclaw.positiveSafeInteger" (dict "name" "repositoryCredentials.upstreamPort" "value" .Values.repositoryCredentials.upstreamPort "port" true) | atoi }}
          {{- if and (ne $port 443) (or (ne .Values.repositoryCredentials.authority "prepared-git") (lt $port 1024) (gt $port 65535)) }}
          {{- fail "repositoryCredentials.upstreamPort must be 443 or a private prepared Git provider port" }}
          {{- end }}
          port: {{ $port }}
{{- end }}

{{- if .Values.executionCluster.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openclaw-enterprise-execution-api-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openclaw-enterprise
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
      app.kubernetes.io/component: worker
  policyTypes: [Egress]
  egress:
    - to:
        {{- range .Values.executionCluster.apiCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.executionCluster.apiPort }}
{{- end }}
{{- if .Values.preparedGitHub.custodySecretName }}
{{- if not .Values.preparedGitHub.issuerCidrs }}{{ fail "preparedGitHub.issuerCidrs requires exact GitHub API IPv4 destinations" }}{{ end }}
{{- $port := include "openclaw.positiveSafeInteger" (dict "name" "preparedGitHub.issuerPort" "value" .Values.preparedGitHub.issuerPort "port" true) | atoi }}
{{- if gt $port 65535 }}{{ fail "preparedGitHub.issuerPort must be a TCP port from 1 to 65535" }}{{ end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openclaw-enterprise-prepared-github-issuer-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openclaw-enterprise
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
      app.kubernetes.io/component: worker
  policyTypes: [Egress]
  egress:
    - to:
        {{- range .Values.preparedGitHub.issuerCidrs }}
        {{- if not (regexMatch (include "openclaw.ipv4Host32" .) (toString .)) }}{{ fail "preparedGitHub.issuerCidrs entries must be explicit IPv4 /32 hosts" }}{{ end }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      ports:
        - {protocol: TCP, port: {{ $port }}}
{{- end }}
