{{- $binding := .Values.preprovisionedNamespace }}
{{- if eq .Values.namedWorkspace.stage "runtime" }}{{- $binding = .Values.namedWorkspace }}{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-openclaw-namespace-observer
rules:
  - apiGroups: [""]
    resources: [namespaces]
    {{- with $binding }}
    resourceNames: [{{ printf "oce-%s" (.namespaceId | sha256sum | trunc 15) | quote }}]
    verbs: [get]
    {{- else }}
    verbs: [get, list]
    {{- end }}
  - nonResourceURLs: [/version]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-openclaw-namespace-worker
rules:
  - apiGroups: [""]
    resources: [namespaces]
    {{- with $binding }}
    resourceNames: [{{ printf "oce-%s" (.namespaceId | sha256sum | trunc 15) | quote }}]
    verbs: [get]
    {{- else }}
    verbs: [get, list, create, patch, delete]
    {{- end }}
  - nonResourceURLs: [/version]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-openclaw-worker-namespaces
subjects:
  - kind: ServiceAccount
    name: openclaw-enterprise-worker
    namespace: {{ .Release.Namespace | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-openclaw-namespace-worker
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-openclaw-api-namespaces
subjects:
  - kind: ServiceAccount
    name: openclaw-enterprise-api
    namespace: {{ .Release.Namespace | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-openclaw-namespace-observer
---
{{- if or (ne .Values.namedWorkspace.stage "runtime") (eq (toString .Values.worker.replicaCount) "1") }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-openclaw-tenant-worker
rules:
  # Read canonical control-plane sources and manage revision-owned runtime material.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, update, delete]
  {{- if .Values.repositoryCredentials.enabled }}
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, create, delete]
  {{- end }}
  - apiGroups: [""]
    resources: [configmaps, serviceaccounts, services, resourcequotas, limitranges]
    verbs: [get, list, create, patch, delete]
  # patch: an annotation on a running Harness or Gateway Pod syncs its workspace
  # node setup or binding volume at once.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, patch]
  - apiGroups: [""]
    resources: [pods/proxy]
    verbs: [get]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, create, patch, delete]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, create, patch, delete]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, create, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, create, patch, delete]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes]
    verbs: [get, create, patch, delete]
  - apiGroups: [gateway.envoyproxy.io]
    resources: [securitypolicies]
    verbs: [get, create, patch, delete]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-openclaw-tenant-api
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [list]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/proxy]
    verbs: [get]
  {{- if .Values.agentRuntimeLogs.enabled }}
  # Runtime log reads: OCC re-checks revision ownership of every named Pod.
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [events]
    verbs: [get, list]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-openclaw-tenant-configuration
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-openclaw-gateway-observer
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [list]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/proxy]
    verbs: [get]
  {{- if .Values.agentRuntimeLogs.enabled }}
  # Runtime log reads: OCC re-checks revision ownership of every named Pod.
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [events]
    verbs: [get, list]
  {{- end }}

{{- if eq .Values.namedWorkspace.stage "runtime" }}
{{- $components := list "api" }}
{{- if eq (toString .Values.worker.replicaCount) "1" }}{{- $components = append $components "worker" }}{{- end }}
{{- range $component := $components }}
{{- range $role := list $component "configuration" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $.Release.Name }}-openclaw-{{ $component }}-{{ $role }}
  namespace: {{ printf "oce-%s" ($.Values.namedWorkspace.namespaceId | sha256sum | trunc 15) | quote }}
subjects:
  - kind: ServiceAccount
    name: openclaw-enterprise-{{ $component }}
    namespace: {{ $.Release.Namespace | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $.Release.Name }}-openclaw-tenant-{{ $role }}
{{- end }}
{{- end }}
{{- end }}
