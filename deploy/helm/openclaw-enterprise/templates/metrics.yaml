{{- if not (kindIs "bool" .Values.metrics.enabled) }}
{{- fail "metrics.enabled must be a boolean" }}
{{- end }}
{{- if .Values.metrics.enabled }}
{{- /* Sprig int reads a leading zero as octal, while the API uses decimal Number(). */ -}}
{{- if not (regexMatch "^[1-9][0-9]*$" (toString .Values.metrics.port)) }}
{{- fail "metrics.port must be an integer" }}
{{- end }}
{{- if ne (empty .Values.metrics.scraperNamespaceLabels) (empty .Values.metrics.scraperPodLabels) }}
{{- fail "metrics requires both scraperNamespaceLabels and scraperPodLabels, or neither" }}
{{- end }}
{{- $port := int .Values.metrics.port }}
{{- /* The API and worker run as a non-root user without capabilities: no port below 1024. */ -}}
{{- if or (lt $port 1024) (gt $port 65535) (eq $port (int .Values.api.port)) }}
{{- fail "metrics.port must be a TCP port from 1024 to 65535, distinct from api.port" }}
{{- end }}
{{- if and .Values.repositoryCredentials.enabled (eq $port 8443) }}
{{- fail "metrics.port must be distinct from the repository credentials listener on port 8443" }}
{{- end }}
{{- if not (empty .Values.metrics.scraperNamespaceLabels) }}
{{- range $component := list "api" "worker" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openclaw-enterprise-{{ $component }}-metrics
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openclaw-enterprise
      app.kubernetes.io/instance: {{ $.Release.Name | quote }}
      app.kubernetes.io/component: {{ $component }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- include "openclaw.networkPolicy.matchLabels" (dict "name" "metrics.scraperNamespaceLabels" "value" $.Values.metrics.scraperNamespaceLabels) | nindent 14 }}
          podSelector:
            matchLabels:
              {{- include "openclaw.networkPolicy.matchLabels" (dict "name" "metrics.scraperPodLabels" "value" $.Values.metrics.scraperPodLabels) | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ $port }}
{{- end }}
{{- end }}
{{- end }}
