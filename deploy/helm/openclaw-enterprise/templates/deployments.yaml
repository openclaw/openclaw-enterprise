{{- range $component := list "api" "worker" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw-enterprise-{{ $component }}
  labels:
    {{- include "openclaw.labels" (dict "root" $ "component" $component) | nindent 4 }}
spec:
  replicas: 1
  {{- if eq $component "api" }}
  # One serving controller: sign-in limits and session admission are process-local.
  strategy:
    type: Recreate
  {{- else }}
  strategy:
    {{- if $.Values.repositoryCredentials.enabled }}
    type: Recreate
    {{- else }}
    type: RollingUpdate
    rollingUpdate:
      maxSurge: "25%"
      maxUnavailable: "25%"
    {{- end }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: openclaw-enterprise
      app.kubernetes.io/instance: {{ $.Release.Name | quote }}
      app.kubernetes.io/component: {{ $component }}
  template:
    metadata:
      labels:
        {{- include "openclaw.labels" (dict "root" $ "component" $component) | nindent 8 }}
      {{- with $.Values.controlPlane.installationChecksum }}
      annotations:
        openclaw.dev/installation-checksum: {{ . | quote }}
      {{- end }}
    spec:
      serviceAccountName: openclaw-enterprise-{{ $component }}
      {{- if and (eq $component "worker") $.Values.repositoryCredentials.enabled }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 75
      {{- else }}
      automountServiceAccountToken: true
      {{- end }}
      securityContext:
        {{- include "openclaw.podSecurity" $ | nindent 8 }}
      {{- with $.Values.controlPlane.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        {{- if $.Values.executionCluster.enabled }}
        - name: execution-kubeconfig
          secret:
            secretName: {{ ternary $.Values.executionCluster.apiKubeconfigSecretName $.Values.executionCluster.workerKubeconfigSecretName (eq $component "api") | quote }}
            defaultMode: 288
            items:
              - key: {{ $.Values.executionCluster.kubeconfigKey | quote }}
                path: kubeconfig
        {{- end }}
        {{- if $.Values.repositoryCredentials.enabled }}
        - name: repository-registry
          configMap:
            name: {{ $.Values.repositoryCredentials.registryConfigMapName | quote }}
            items:
              - key: {{ $.Values.repositoryCredentials.registryKey | quote }}
                path: registry.json
        - name: repository-public-ca
          secret:
            secretName: {{ $.Values.repositoryCredentials.publicCaSecretName | quote }}
            items:
              - key: {{ $.Values.repositoryCredentials.publicCaKey | quote }}
                path: ca.crt
        {{- if eq $component "worker" }}
        - name: worker-api-access
          projected:
            defaultMode: 288 # 0440: root and the Pod filesystem group only.
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        apiVersion: v1
                        fieldPath: metadata.namespace
        - name: repository-inputs
          projected:
            defaultMode: 288 # 0440: root and the Pod filesystem group only.
            sources:
              - secret:
                  name: {{ $.Values.repositoryCredentials.serviceConfigSecretName | quote }}
                  items:
                    - key: {{ $.Values.repositoryCredentials.serviceConfigKey | quote }}
                      path: config.json
              - secret:
                  name: {{ $.Values.repositoryCredentials.appKeySecretName | quote }}
                  items:
                    - key: {{ $.Values.repositoryCredentials.appKeyKey | quote }}
                      path: private-key.pem
              - secret:
                  name: {{ $.Values.repositoryCredentials.tlsSecretName | quote }}
                  items:
                    - key: tls.crt
                      path: tls.crt
                    - key: tls.key
                      path: tls.key
        - name: repository-private
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
        - name: repository-control
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        {{- end }}
        {{- end }}
        - name: installation-startup
          secret:
            secretName: {{ $.Values.installation.secretName | quote }}
            items:
              - key: {{ $.Values.installation.key | quote }}
                path: installation.yaml
        {{- if $.Values.database.caSecretName }}
        - name: database-ca
          secret:
            secretName: {{ $.Values.database.caSecretName | quote }}
            items:
              - key: {{ $.Values.database.caKey | quote }}
                path: {{ $.Values.database.caKey | quote }}
        {{- end }}
        {{- if $.Values.gatewayRouting.enabled }}
        - name: gateway-api-key
          secret:
            secretName: {{ $.Values.gatewayRouting.apiKeySecretName | quote }}
            items:
              - key: occ
                path: key
        {{- if or (not $.Values.gatewayRouting.issuerRef.name) $.Values.gatewayRouting.caSecretName }}
        - name: gateway-ca
          secret:
            secretName: {{ ternary (include "openclaw.gatewayRouting.rootSecretName" $) $.Values.gatewayRouting.caSecretName (not $.Values.gatewayRouting.issuerRef.name) | quote }}
            items:
              - key: {{ ternary "tls.crt" $.Values.gatewayRouting.caSecretKey (not $.Values.gatewayRouting.issuerRef.name) | quote }}
                path: ca.crt
        {{- end }}
        {{- end }}
        {{- if eq $component "api" }}
        {{- if $.Values.backend.chatgpt.enabled }}
        {{- $chatgpt := $.Values.backend.chatgpt }}
        {{- if or (not $chatgpt.secretName) (not $chatgpt.key) }}
        {{- fail "backend.chatgpt requires a dedicated admin Secret name and key" }}
        {{- end }}
        {{- if or (eq $chatgpt.secretName $.Values.installation.secretName) (eq $chatgpt.secretName $.Values.database.secretName) (eq $chatgpt.secretName $.Values.auth.secretName) }}
        {{- fail "backend.chatgpt admin credentials must use a dedicated Secret" }}
        {{- end }}
        - name: chatgpt-admin
          secret:
            secretName: {{ $chatgpt.secretName | quote }}
            items:
              - key: {{ $chatgpt.key | quote }}
                path: admin-key
        {{- end }}
        {{- else }}
        - name: worker-readiness
          emptyDir:
            sizeLimit: 1Mi
        {{- end }}
      {{- if and (eq $component "worker") $.Values.repositoryCredentials.enabled }}
      # The receipt server must remain available while the broker drains.
      initContainers:
      {{- else }}
      containers:
      {{- end }}
        - name: {{ $component }}
          {{- if and (eq $component "worker") $.Values.repositoryCredentials.enabled }}
          restartPolicy: Always
          {{- end }}
          image: {{ $.Values.images.controller | quote }}
          args:
            - apps/controller/src/{{ ternary "server" "worker" (eq $component "api") }}.mjs
          securityContext:
            {{- include "openclaw.containerSecurity" $ | nindent 12 }}
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          env:
            - name: NODE_ENV
              value: production
            {{- if $.Values.metrics.enabled }}
            - name: OCC_METRICS_ENABLED
              value: "true"
            - name: OCC_METRICS_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: OCC_METRICS_PORT
              value: {{ $.Values.metrics.port | quote }}
            {{- end }}
            - name: OCC_CONFIG_PATH
              value: /etc/openclaw/installation/installation.yaml
            {{- include "openclaw.secretEnv" (dict "name" "OCC_DATABASE_URL" "secretName" $.Values.database.secretName "key" $.Values.database.appUrlKey) | nindent 12 }}
            {{- if $.Values.gatewayRouting.enabled }}
            - name: OCC_GATEWAY_API_KEY_PATH
              value: /etc/openclaw/gateway-api-key/key
            {{- if or (not $.Values.gatewayRouting.issuerRef.name) $.Values.gatewayRouting.caSecretName }}
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/openclaw/gateway-ca/ca.crt
            {{- end }}
            {{- end }}
            {{- if eq $component "api" }}
            - name: OCC_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: OCC_PORT
              value: {{ $.Values.api.port | quote }}
            {{- include "openclaw.secretEnv" (dict "name" "OCC_AUTH_SECRET" "secretName" $.Values.auth.secretName "key" $.Values.auth.secretKey) | nindent 12 }}
            - name: OCC_AUTH_BASE_URL
              value: {{ $.Values.auth.baseUrl | quote }}
            {{- if $.Values.auth.github.enabled }}
            {{- include "openclaw.secretEnv" (dict "name" "OCC_AUTH_GITHUB_CLIENT_ID" "secretName" $.Values.auth.github.secretName "key" $.Values.auth.github.clientIdKey) | nindent 12 }}
            {{- include "openclaw.secretEnv" (dict "name" "OCC_AUTH_GITHUB_CLIENT_SECRET" "secretName" $.Values.auth.github.secretName "key" $.Values.auth.github.clientSecretKey) | nindent 12 }}
            {{- if $.Values.auth.github.allowedOrgs }}
            - name: OCC_AUTH_GITHUB_ALLOWED_ORGS
              value: {{ join "," $.Values.auth.github.allowedOrgs | quote }}
            {{- end }}
            {{- if $.Values.auth.github.allowedTeams }}
            - name: OCC_AUTH_GITHUB_ALLOWED_TEAMS
              value: {{ join "," $.Values.auth.github.allowedTeams | quote }}
            {{- end }}
            {{- end }}
            {{- if and $.Values.auth.google $.Values.auth.google.enabled }}
            {{- include "openclaw.secretEnv" (dict "name" "OCC_AUTH_GOOGLE_CLIENT_ID" "secretName" $.Values.auth.google.secretName "key" $.Values.auth.google.clientIdKey) | nindent 12 }}
            {{- include "openclaw.secretEnv" (dict "name" "OCC_AUTH_GOOGLE_CLIENT_SECRET" "secretName" $.Values.auth.google.secretName "key" $.Values.auth.google.clientSecretKey) | nindent 12 }}
            {{- if $.Values.auth.google.allowedDomains }}
            - name: OCC_AUTH_GOOGLE_ALLOWED_DOMAINS
              value: {{ join "," $.Values.auth.google.allowedDomains | quote }}
            {{- end }}
            {{- end }}
            {{- if and $.Values.auth.oidc $.Values.auth.oidc.enabled }}
            - name: OCC_AUTH_OIDC_ISSUER
              value: {{ $.Values.auth.oidc.issuer | quote }}
            - name: OCC_AUTH_OIDC_AUTHORIZATION_URL
              value: {{ $.Values.auth.oidc.authorizationUrl | quote }}
            - name: OCC_AUTH_OIDC_TOKEN_URL
              value: {{ $.Values.auth.oidc.tokenUrl | quote }}
            - name: OCC_AUTH_OIDC_JWKS_URL
              value: {{ $.Values.auth.oidc.jwksUrl | quote }}
            {{- include "openclaw.secretEnv" (dict "name" "OCC_AUTH_OIDC_CLIENT_ID" "secretName" $.Values.auth.oidc.secretName "key" $.Values.auth.oidc.clientIdKey) | nindent 12 }}
            {{- include "openclaw.secretEnv" (dict "name" "OCC_AUTH_OIDC_CLIENT_SECRET" "secretName" $.Values.auth.oidc.secretName "key" $.Values.auth.oidc.clientSecretKey) | nindent 12 }}
            {{- if and $.Values.auth.oidc.tokenAuth (ne $.Values.auth.oidc.tokenAuth "client_secret_post") }}
            - name: OCC_AUTH_OIDC_TOKEN_AUTH
              value: {{ $.Values.auth.oidc.tokenAuth | quote }}
            {{- end }}
            {{- if $.Values.auth.oidc.displayName }}
            - name: OCC_AUTH_OIDC_DISPLAY_NAME
              value: {{ $.Values.auth.oidc.displayName | quote }}
            {{- end }}
            {{- end }}
            {{- if $.Values.auth.recoveryUserId }}
            - name: OCC_AUTH_GITHUB_RECOVERY_USER_ID
              value: {{ $.Values.auth.recoveryUserId | quote }}
            {{- end }}
            {{- if eq (toString (default "all" $.Values.auth.passwordSignIn)) "recovery-only" }}
            - name: OCC_AUTH_PASSWORD_SIGN_IN
              value: recovery-only
            {{- end }}
            {{- if $.Values.api.trustedProxy.preset }}
            - name: OCC_AUTH_TRUSTED_PROXY_CIDRS
              value: {{ join "," $.Values.api.trustedProxy.cidrs | quote }}
            - name: OCC_AUTH_TRUSTED_PROXY_PRESET
              value: {{ $.Values.api.trustedProxy.preset | quote }}
            {{- if eq $.Values.api.trustedProxy.preset "generic" }}
            - name: OCC_AUTH_CLIENT_IP_HEADER
              value: {{ include "openclaw.trustedProxy.header" $ | quote }}
            {{- end }}
            {{- end }}
            {{- if $.Values.slackProxy.enabled }}
            - name: OCC_CHANNEL_DIRECTORY_PROXY_URL
              value: {{ include "openclaw.slackProxy.url" $ | quote }}
            - name: OCC_CHANNEL_DIRECTORY_MANAGED_PROXY_HOST
              value: {{ printf "%s.%s.svc" (include "openclaw.slackProxy.serviceName" $) $.Release.Namespace | quote }}
            {{- else if $.Values.api.channelDirectoryProxyUrl }}
            - name: OCC_CHANNEL_DIRECTORY_PROXY_URL
              value: {{ $.Values.api.channelDirectoryProxyUrl | quote }}
            {{- end }}
            - name: OCC_AGENT_NATIVE_ADMIN_ENABLED
              value: {{ ternary "true" "false" $.Values.agentNativeAdmin.enabled | quote }}
            - name: OCC_AGENT_RUNTIME_LOGS_ENABLED
              value: {{ ternary "true" "false" $.Values.agentRuntimeLogs.enabled | quote }}
            {{- if $.Values.agentNativeAdmin.enabled }}
            - name: OCC_AGENT_NATIVE_ADMIN_DOMAIN
              value: {{ $.Values.agentNativeAdmin.domain | quote }}
            - name: OCC_AUTH_COOKIE_DOMAIN
              value: {{ $.Values.agentNativeAdmin.sharedCookieDomain | quote }}
            {{- end }}
            {{- else }}
            - name: OCC_WORKER_READINESS_PATH
              value: /run/openclaw-worker/ready
            - name: OCC_WORKER_LIVENESS_PATH
              value: /run/openclaw-worker/alive
            - name: OCC_WORKER_POLL_INTERVAL_MS
              value: {{ $.Values.worker.pollIntervalMs | quote }}
            - name: OCC_WORKER_LEASE_DURATION_MS
              value: {{ $.Values.worker.leaseDurationMs | quote }}
            - name: OCC_WORKER_MAX_ATTEMPTS
              value: {{ $.Values.worker.maxAttempts | quote }}
            - name: OCC_WORKER_CONVERGENCE_TIMEOUT_MS
              value: {{ $.Values.worker.convergenceTimeoutMs | quote }}
            {{- end }}
          volumeMounts:
            {{- if $.Values.executionCluster.enabled }}
            - name: execution-kubeconfig
              mountPath: /etc/openclaw/execution
              readOnly: true
            {{- end }}
            {{- if $.Values.repositoryCredentials.enabled }}
            - name: repository-registry
              mountPath: /etc/openclaw/repository-registry
              readOnly: true
            - name: repository-public-ca
              mountPath: /etc/openclaw/repository-ca
              readOnly: true
            {{- if eq $component "worker" }}
            - name: worker-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            - name: repository-control
              mountPath: /run/openclaw/repository-control
            {{- end }}
            {{- end }}
            - name: installation-startup
              mountPath: /etc/openclaw/installation
              readOnly: true
            {{- if $.Values.database.caSecretName }}
            - name: database-ca
              mountPath: {{ $.Values.database.caMountPath | quote }}
              readOnly: true
            {{- end }}
            {{- if $.Values.gatewayRouting.enabled }}
            - name: gateway-api-key
              mountPath: /etc/openclaw/gateway-api-key
              readOnly: true
            {{- if or (not $.Values.gatewayRouting.issuerRef.name) $.Values.gatewayRouting.caSecretName }}
            - name: gateway-ca
              mountPath: /etc/openclaw/gateway-ca
              readOnly: true
            {{- end }}
            {{- end }}
            {{- if eq $component "api" }}
            {{- if $.Values.backend.chatgpt.enabled }}
            - name: chatgpt-admin
              mountPath: /etc/openclaw/chatgpt
              readOnly: true
            {{- end }}
            {{- else }}
            - name: worker-readiness
              mountPath: /run/openclaw-worker
            {{- end }}
          {{- if or (eq $component "api") $.Values.metrics.enabled }}
          ports:
            {{- if $.Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ $.Values.metrics.port }}
            {{- end }}
            {{- if eq $component "api" }}
            - name: http
              containerPort: {{ $.Values.api.port }}
            {{- end }}
          {{- end }}
          {{- if eq $component "api" }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          # Liveness starts only once the API answers, so a slow boot (module loading,
          # database, Kubernetes preflight) gets 2 min before the kubelet restarts it.
          # Readiness also waits for the first success: a 1 s period lets the API take
          # traffic about when it listens rather than at a later probe tick.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 1
            failureThreshold: 120
          {{- else }}
          readinessProbe:
            exec:
              command: [node, scripts/production-healthcheck.mjs, worker, ready]
          livenessProbe:
            exec:
              command: [node, scripts/production-healthcheck.mjs, worker]
          {{- end }}
        {{- if and (eq $component "worker") $.Values.repositoryCredentials.enabled }}
      containers:
        - name: repository-credentials
          image: {{ $.Values.repositoryCredentials.image | quote }}
          command: [node, /app/dist/composition/repository-credentials/projected-inputs.js]
          args:
            - --public-origin
            - {{ include "openclaw.repositoryCredentials.origin" $ | quote }}
            - --backend-id
            - {{ $.Values.repositoryCredentials.backendId | quote }}
          securityContext:
            {{- include "openclaw.containerSecurity" $ | nindent 12 }}
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          ports:
            - name: repository-tls
              containerPort: 8443
          volumeMounts:
            - name: repository-registry
              mountPath: /etc/openclaw/repository-registry
              readOnly: true
            - name: repository-inputs
              mountPath: /etc/openclaw/repository-inputs
              readOnly: true
            - name: repository-private
              mountPath: /run/openclaw/repository-private
            - name: repository-control
              mountPath: /run/openclaw/repository-control
          readinessProbe:
            exec:
              command: [node, /app/dist/composition/repository-credentials/probe.js]
          livenessProbe:
            exec:
              command: [node, /app/dist/composition/repository-credentials/probe.js]
          startupProbe:
            exec:
              command: [node, /app/dist/composition/repository-credentials/probe.js]
            periodSeconds: 5
            failureThreshold: 12
        {{- end }}
{{- end }}
