{{- include "openclaw.validate" . -}}
{{- range $component := list "api" "worker" "initialization" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openclaw-enterprise-{{ $component }}
  labels:
    {{- include "openclaw.labels" (dict "root" $ "component" $component) | nindent 4 }}
  {{- if eq $component "initialization" }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation
  {{- end }}
automountServiceAccountToken: {{ or (eq $component "api") (eq $component "worker") }}
{{- end }}
{{- if .Values.gatewayProxy.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openclaw-enterprise-gateway-proxy
  labels:
    {{- include "openclaw.labels" (dict "root" $ "component" "gateway-proxy") | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
