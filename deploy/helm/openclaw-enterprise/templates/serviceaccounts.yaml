{{- include "openclaw.validate" . -}}
{{- range $component := list "api" "worker" "initialization" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openclaw-enterprise-{{ $component }}
  labels:
    {{- include "openclaw.labels" (dict "root" $ "component" $component) | nindent 4 }}
  {{- if eq $component "initialization" }}
  annotations:
    {{- if and $.Release.IsUpgrade $.Values.installation.upgradeAttemptId }}
    openclaw.dev/upgrade-attempt: {{ $.Values.installation.upgradeAttemptId | quote }}
    {{- end }}
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation
  {{- end }}
automountServiceAccountToken: {{ or (eq $component "api") (eq $component "worker") }}
{{- end }}
{{- if .Values.slackProxy.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openclaw-enterprise-slack-proxy
  labels:
    {{- include "openclaw.labels" (dict "root" $ "component" "slack-proxy") | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
