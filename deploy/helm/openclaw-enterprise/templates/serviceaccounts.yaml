{{- include "openclaw.validate" . -}}
{{- $components := list "api" "worker" "initialization" }}
{{- if eq .Values.namedWorkspace.stage "runtime" }}
{{- $components = list "api" "worker" }}
{{- end }}
{{- range $component := $components }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openclaw-enterprise-{{ $component }}
  labels:
    {{- include "openclaw.labels" (dict "root" $ "component" $component) | nindent 4 }}
  {{- if eq $component "initialization" }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation
  {{- end }}
automountServiceAccountToken: {{ or (eq $component "api") (eq $component "worker") }}
{{- end }}
{{- if .Values.slackProxy.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openclaw-enterprise-slack-proxy
  labels:
    {{- include "openclaw.labels" (dict "root" $ "component" "slack-proxy") | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
