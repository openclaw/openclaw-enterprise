{{- $namespace := include "openclaw.installationSecretNamespace" . -}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $namespace }}
  annotations:
    helm.sh/resource-policy: keep
---
{{- range $component, $verbs := dict "api" (list "get" "create" "update" "delete") "worker" (list "get" "delete") }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: occ-{{ $component }}-installation-secrets
  namespace: {{ $namespace }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: {{ $verbs | toJson }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: occ-{{ $component }}-installation-secrets
  namespace: {{ $namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: occ-{{ $component }}-installation-secrets
subjects:
  - kind: ServiceAccount
    name: openclaw-enterprise-{{ $component }}
    namespace: {{ $.Release.Namespace | quote }}
---
{{- end }}
