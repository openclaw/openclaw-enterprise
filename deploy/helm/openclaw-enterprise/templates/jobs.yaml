{{- if not .Values.preprovisionedNamespace }}
{{- $repositoryGit := include "openclaw.repositoryCredentials.gitEnabled" . -}}
{{- $jobName := printf "%s-initialization" .Release.Name | trunc 63 | trimSuffix "-" -}}
{{- /* On install, preserve evidence from an earlier attempt before Helm runs any hooks.
      This is a point-in-time lookup, not a lock or proof the installation is new. */ -}}
{{- if .Release.IsInstall -}}
{{- if lookup "batch/v1" "Job" .Release.Namespace $jobName -}}
{{- fail (printf "initialization Job %s/%s already exists; preserve it and reconcile the original installation attempt before another install. Its presence does not establish whether migration or bootstrap completed." .Release.Namespace $jobName) -}}
{{- end -}}
{{- end -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $jobName | quote }}
  labels:
    {{- include "openclaw.labels" (dict "root" . "component" "initialization") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        {{- include "openclaw.labels" (dict "root" . "component" "initialization") | nindent 8 }}
    spec:
      serviceAccountName: openclaw-enterprise-initialization
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        {{- include "openclaw.podSecurity" . | nindent 8 }}
        fsGroupChangePolicy: OnRootMismatch
      {{- with .Values.controlPlane.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        {{- if .Release.IsUpgrade }}
        # The installation-check container reads what API startup reads from these.
        - name: installation-startup
          secret:
            secretName: {{ .Values.installation.secretName | quote }}
            items:
              - key: {{ .Values.installation.key | quote }}
                path: installation.yaml
        {{- if .Values.api.consoleTheme.configMapName }}
        - name: console-theme
          configMap:
            name: {{ .Values.api.consoleTheme.configMapName | quote }}
        {{- end }}
        {{- if $repositoryGit }}
        - name: repository-registry
          configMap:
            name: {{ .Values.repositoryCredentials.registryConfigMapName | quote }}
            items:
              - key: {{ .Values.repositoryCredentials.registryKey | quote }}
                path: registry.json
        {{- end }}
        {{- if .Values.repositoryCredentials.enabled }}
        - name: repository-public-ca
          secret:
            secretName: {{ .Values.repositoryCredentials.publicCaSecretName | quote }}
            items:
              - key: {{ .Values.repositoryCredentials.publicCaKey | quote }}
                path: ca.crt
        {{- end }}
        {{- if and .Values.preparedGitHub.custodySecretName .Values.preparedGitHub.issuerCaConfigMapName }}
        # Loading the Installation reads preparedGitHub.issuerCaPath. Public CA only, never custody.
        - name: prepared-github-issuer-ca
          configMap:
            name: {{ .Values.preparedGitHub.issuerCaConfigMapName | quote }}
            items:
              - {key: ca.crt, path: ca.crt}
        {{- end }}
        {{- end }}
        - name: bootstrap-password-output
          persistentVolumeClaim:
            claimName: {{ .Values.bootstrap.password.claimName | quote }}
        {{- if .Values.database.caSecretName }}
        - name: database-ca
          secret:
            secretName: {{ .Values.database.caSecretName | quote }}
            items:
              - key: {{ .Values.database.caKey | quote }}
                path: {{ .Values.database.caKey | quote }}
        {{- end }}
      initContainers:
        {{- if .Release.IsUpgrade }}
        # Refuses an Installation the API would refuse at startup, before migration and
        # before Helm replaces the API Pod, so a bad change leaves the old Pods serving.
        - name: installation-check
          image: {{ .Values.images.controller | quote }}
          command: ["node"]
          args:
            - --input-type=module
            - -e
            - {{ required "chart is missing files/check-installation.mjs" (.Files.Get "files/check-installation.mjs") | quote }}
          securityContext:
            {{- include "openclaw.containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            - name: NODE_ENV
              value: production
            - name: OCC_CONFIG_PATH
              value: /etc/openclaw/installation/installation.yaml
            {{- if .Values.api.consoleTheme.configMapName }}
            - name: OCC_CONSOLE_THEME_DIR
              value: /etc/openclaw/console-theme
            {{- end }}
          volumeMounts:
            - name: installation-startup
              mountPath: /etc/openclaw/installation
              readOnly: true
            {{- if .Values.api.consoleTheme.configMapName }}
            - name: console-theme
              mountPath: /etc/openclaw/console-theme
              readOnly: true
            {{- end }}
            {{- if $repositoryGit }}
            - name: repository-registry
              mountPath: /etc/openclaw/repository-registry
              readOnly: true
            {{- end }}
            {{- if .Values.repositoryCredentials.enabled }}
            - name: repository-public-ca
              mountPath: /etc/openclaw/repository-ca
              readOnly: true
            {{- end }}
            {{- if and .Values.preparedGitHub.custodySecretName .Values.preparedGitHub.issuerCaConfigMapName }}
            - name: prepared-github-issuer-ca
              mountPath: /etc/openclaw/prepared-github-issuer
              readOnly: true
            {{- end }}
        {{- end }}
        - name: migration
          image: {{ .Values.images.controller | quote }}
          args:
            - scripts/migrate-production.mjs
            {{- if .Release.IsInstall }}
            - --expect-empty
            {{- end }}
          securityContext:
            {{- include "openclaw.containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            - name: NODE_ENV
              value: production
            {{- include "openclaw.secretEnv" (dict "name" "OCC_MIGRATION_DATABASE_URL" "secretName" .Values.database.secretName "key" .Values.database.migrationUrlKey) | nindent 12 }}
          {{- if .Values.database.caSecretName }}
          volumeMounts:
            - name: database-ca
              mountPath: {{ .Values.database.caMountPath | quote }}
              readOnly: true
          {{- end }}
      containers:
        - name: bootstrap
          image: {{ .Values.images.controller | quote }}
          args: ["scripts/bootstrap-installation.mjs"]
          securityContext:
            {{- include "openclaw.containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            - name: NODE_ENV
              value: production
            {{- include "openclaw.secretEnv" (dict "name" "OCC_DATABASE_URL" "secretName" .Values.database.secretName "key" .Values.database.appUrlKey) | nindent 12 }}
            {{- include "openclaw.secretEnv" (dict "name" "OCC_AUTH_SECRET" "secretName" .Values.auth.secretName "key" .Values.auth.secretKey) | nindent 12 }}
            - name: OCC_AUTH_BASE_URL
              value: {{ .Values.auth.baseUrl | quote }}
            - name: OCC_BOOTSTRAP_ADMIN_EMAIL
              value: {{ .Values.bootstrap.adminEmail | quote }}
            - name: OCC_BOOTSTRAP_PASSWORD_FILE
              value: {{ printf "%s/%s" .Values.bootstrap.password.mountPath .Values.bootstrap.password.fileName | quote }}
            - name: OCC_BOOTSTRAP_SERVICE_KEY_FILE
              value: {{ printf "%s/%s" .Values.bootstrap.password.mountPath .Values.bootstrap.serviceKey.fileName | quote }}
            - name: OCC_BOOTSTRAP_INSTALLATION_NAME
              value: {{ .Values.installation.name | quote }}
          volumeMounts:
            - name: bootstrap-password-output
              mountPath: {{ .Values.bootstrap.password.mountPath | quote }}
            {{- if .Values.database.caSecretName }}
            - name: database-ca
              mountPath: {{ .Values.database.caMountPath | quote }}
              readOnly: true
            {{- end }}
{{- end }}
