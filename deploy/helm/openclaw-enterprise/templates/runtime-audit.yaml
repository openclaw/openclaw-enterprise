{{- if and .Values.controlPlaneAudit.enabled .Values.gatewayRouting.enabled }}
{{- $port := include "openclaw.runtimeAuditPort" . }}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: openclaw-enterprise-runtime-audit-bootstrap
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openclaw-enterprise-runtime-audit-root
spec:
  isCA: true
  commonName: openclaw-enterprise-runtime-audit-root
  secretName: openclaw-enterprise-runtime-audit-root
  duration: 87600h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Never
  issuerRef:
    name: openclaw-enterprise-runtime-audit-bootstrap
    kind: Issuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: openclaw-enterprise-runtime-audit-ca
spec:
  ca:
    secretName: openclaw-enterprise-runtime-audit-root
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openclaw-enterprise-runtime-audit-tls
spec:
  secretName: openclaw-enterprise-runtime-audit-tls
  dnsNames:
    - {{ printf "openclaw-enterprise-runtime-audit.%s.svc" .Release.Namespace | quote }}
  issuerRef:
    name: openclaw-enterprise-runtime-audit-ca
    kind: Issuer
    group: cert-manager.io
---
apiVersion: v1
kind: Service
metadata:
  name: openclaw-enterprise-runtime-audit
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: openclaw-enterprise
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/component: api
  ports:
    - name: runtime-audit
      port: {{ $port }}
      targetPort: runtime-audit
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openclaw-enterprise-runtime-audit-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openclaw-enterprise
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
      app.kubernetes.io/component: api
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              openclaw-enterprise.io/gateway: {{ include "openclaw.gatewayRouting.routeNamespaceLabel" . | quote }}
            matchExpressions:
              - key: openclaw.dev/gateway-namespace
                operator: Exists
          podSelector:
            matchLabels:
              app.kubernetes.io/managed-by: openclaw-enterprise
              openclaw.dev/runtime-audit-sender: "true"
      ports:
        - protocol: TCP
          port: {{ $port }}
{{- end }}
