{{- if .Values.gatewayRouting.enabled }}
{{- $routing := .Values.gatewayRouting }}
{{- $gatewayName := include "openclaw.gatewayRouting.gatewayName" . }}
{{- $serviceName := include "openclaw.gatewayRouting.serviceName" . }}
{{- $hostname := default (printf "%s.%s.svc" $serviceName $routing.envoyNamespace) $routing.hostname }}
{{- $tlsSecretName := include "openclaw.gatewayRouting.tlsSecretName" . }}
{{- $routeNamespaceLabel := include "openclaw.gatewayRouting.routeNamespaceLabel" . }}
{{- $rootSecretName := include "openclaw.gatewayRouting.rootSecretName" . }}
{{- $bootstrapIssuerName := printf "%s-bootstrap" $serviceName }}
{{- $caIssuerName := printf "%s-ca" $serviceName }}
{{- if not $routing.issuerRef.name }}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ $bootstrapIssuerName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openclaw.labels" (dict "root" . "component" "gateway-routing") | nindent 4 }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $rootSecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openclaw.labels" (dict "root" . "component" "gateway-routing") | nindent 4 }}
spec:
  isCA: true
  commonName: {{ $rootSecretName | quote }}
  secretName: {{ $rootSecretName }}
  duration: 87600h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Never
  issuerRef:
    name: {{ $bootstrapIssuerName }}
    kind: Issuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ $caIssuerName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openclaw.labels" (dict "root" . "component" "gateway-routing") | nindent 4 }}
spec:
  ca:
    secretName: {{ $rootSecretName }}
{{- end }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: {{ $gatewayName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openclaw.labels" (dict "root" . "component" "gateway-routing") | nindent 4 }}
spec:
  provider:
    type: Kubernetes
    kubernetes:
      {{- with .Values.controlPlane.nodeSelector }}
      envoyDeployment:
        pod:
          nodeSelector:
            {{- toYaml . | nindent 12 }}
      {{- end }}
      envoyService:
        name: {{ $serviceName }}
        type: {{ $routing.serviceType }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $gatewayName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openclaw.labels" (dict "root" . "component" "gateway-routing") | nindent 4 }}
spec:
  gatewayClassName: {{ $routing.gatewayClassName | quote }}
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: {{ $gatewayName }}
  listeners:
    - name: https
      hostname: {{ $hostname | quote }}
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: {{ $tlsSecretName }}
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              openclaw-enterprise.io/gateway: {{ $routeNamespaceLabel | quote }}
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
    {{- if $routing.sandbox.enabled }}
    - name: sandbox
      hostname: {{ printf "*.%s" $routing.sandbox.domain | quote }}
      port: {{ $routing.sandbox.listenerPort }}
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: {{ $routing.sandbox.tlsSecretName }}
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              openclaw-enterprise.io/gateway: {{ $routeNamespaceLabel | quote }}
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
    {{- end }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $tlsSecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openclaw.labels" (dict "root" . "component" "gateway-routing") | nindent 4 }}
spec:
  secretName: {{ $tlsSecretName }}
  duration: 2160h
  renewBefore: 720h
  dnsNames:
    - {{ $hostname | quote }}
  issuerRef:
    {{- if $routing.issuerRef.name }}
    name: {{ $routing.issuerRef.name | quote }}
    kind: {{ $routing.issuerRef.kind | quote }}
    group: {{ $routing.issuerRef.group | quote }}
    {{- else }}
    name: {{ $caIssuerName | quote }}
    kind: Issuer
    group: cert-manager.io
    {{- end }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: {{ $gatewayName }}-api-key
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openclaw.labels" (dict "root" . "component" "gateway-routing") | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $gatewayName }}
  apiKeyAuth:
    credentialRefs:
      - group: ""
        kind: Secret
        name: {{ $routing.apiKeySecretName | quote }}
    extractFrom:
      - headers:
          - x-api-key
    sanitize: true
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openclaw-enterprise-controller-envoy-egress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openclaw-enterprise
      app.kubernetes.io/instance: {{ .Release.Name }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [api, worker]
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $routing.envoyNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/component: proxy
              app.kubernetes.io/managed-by: envoy-gateway
              app.kubernetes.io/name: envoy
              gateway.envoyproxy.io/owning-gateway-namespace: {{ .Release.Namespace }}
              gateway.envoyproxy.io/owning-gateway-name: {{ $gatewayName }}
      ports:
        - protocol: TCP
          port: {{ $routing.envoyHttpsTargetPort }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "openclaw.gatewayRouting.envoyNetworkPolicyName" . }}
  namespace: {{ $routing.envoyNamespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: proxy
      app.kubernetes.io/managed-by: envoy-gateway
      app.kubernetes.io/name: envoy
      gateway.envoyproxy.io/owning-gateway-namespace: {{ .Release.Namespace }}
      gateway.envoyproxy.io/owning-gateway-name: {{ $gatewayName }}
  policyTypes: [Ingress, Egress]
  ingress:
    {{- if $routing.sandbox.enabled }}
    - from:
        {{- toYaml $routing.sandbox.ingressPeers | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ $routing.sandbox.listenerPort }}
    {{- end }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: openclaw-enterprise
              app.kubernetes.io/instance: {{ .Release.Name }}
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [api, worker]
        - namespaceSelector:
            matchLabels:
              openclaw-enterprise.io/gateway: {{ $routeNamespaceLabel }}
          podSelector:
            matchLabels:
              openclaw.dev/workload-role: agent
        {{- range $routing.remoteNodeCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}

        - namespaceSelector:
            matchLabels:
              openclaw-enterprise.io/gateway: {{ $routeNamespaceLabel }}
          podSelector:
            matchLabels:
              openshell.ai/boundary-role: supervisor
      ports:
        - protocol: TCP
          port: {{ $routing.envoyHttpsTargetPort }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.dns.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.dns.podLabels | nindent 14 }}
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
        # Allow port 5353 for compatibility with OpenShift DNS backends.
        - { protocol: UDP, port: 5353 }
        - { protocol: TCP, port: 5353 }
    - to:
        - namespaceSelector:
            matchLabels:
              openclaw-enterprise.io/gateway: {{ $routeNamespaceLabel | quote }}
          podSelector:
            matchLabels:
              openclaw.dev/workload-role: gateway
      ports:
        - protocol: TCP
          port: {{ $routing.tenantGatewayPort }}
        {{- if $routing.sandbox.enabled }}
        - protocol: TCP
          port: {{ add1 (int $routing.tenantGatewayPort) }}
        {{- end }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $routing.envoyNamespace }}
          podSelector:
            matchLabels:
              {{- toYaml $routing.envoyGatewayPodLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: 18000
{{- end }}
