{{- $collector := .Values.logging.collector -}}
{{- if $collector.enabled -}}
{{- if not (regexMatch "^[^[:space:]@]+@sha256:[a-f0-9]{64}$" $collector.image) -}}
{{- fail "logging.collector.image must be an approved immutable SHA-256 image reference" -}}
{{- end -}}
{{- if or (not $collector.configSecretName) (not $collector.envSecretName) -}}
{{- fail "logging.collector requires dedicated operator-created config and environment Secrets" -}}
{{- end -}}
{{- $protected := dict "installation" .Values.installation.secretName "database" .Values.database.secretName "auth" .Values.auth.secretName "chatgpt" .Values.backend.chatgpt.secretName -}}
{{- if and .Values.auth.github .Values.auth.github.enabled -}}{{- $_ := set $protected "GitHub sign-in" .Values.auth.github.secretName -}}{{- end -}}
{{- if and .Values.auth.google .Values.auth.google.enabled -}}{{- $_ := set $protected "Google sign-in" .Values.auth.google.secretName -}}{{- end -}}
{{- if and .Values.auth.oidc .Values.auth.oidc.enabled -}}{{- $_ := set $protected "OIDC sign-in" .Values.auth.oidc.secretName -}}{{- end -}}
{{- if .Values.gatewayRouting.enabled -}}{{- $_ := set $protected "gateway API key" .Values.gatewayRouting.apiKeySecretName -}}{{- end -}}
{{- if .Values.repositoryCredentials.enabled -}}
{{- range $key := list "serviceConfigSecretName" "appKeySecretName" "tlsSecretName" "publicCaSecretName" -}}
{{- $_ := set $protected (printf "repositoryCredentials.%s" $key) (index $.Values.repositoryCredentials $key) -}}
{{- end -}}
{{- end -}}
{{- if .Values.executionCluster.enabled -}}
{{- $_ := set $protected "execution API kubeconfig" .Values.executionCluster.apiKubeconfigSecretName -}}
{{- $_ := set $protected "execution worker kubeconfig" .Values.executionCluster.workerKubeconfigSecretName -}}
{{- end -}}
{{- range $name, $secret := $protected -}}
{{- if and $secret (or (eq $collector.configSecretName $secret) (and $collector.envSecretName (eq $collector.envSecretName $secret))) -}}
{{- fail (printf "logging.collector Secrets must be dedicated and cannot reuse the %s Secret" $name) -}}
{{- end -}}
{{- end -}}
{{- $exporter := $collector.exporter -}}
{{- if ne (empty $exporter.namespaceLabels) (empty $exporter.podLabels) -}}
{{- fail "logging.collector.exporter requires both namespaceLabels and podLabels" -}}
{{- end -}}
{{- if and $exporter.cidr (not (empty $exporter.namespaceLabels)) -}}
{{- fail "logging.collector.exporter requires either cidr or paired selectors, not both" -}}
{{- end -}}
{{- if empty $exporter.namespaceLabels -}}
{{- if not (regexMatch "^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+/32$" $exporter.cidr) -}}
{{- fail "logging.collector.exporter.cidr must identify exactly one approved IPv4 exporter or proxy host with /32" -}}
{{- end -}}
{{- end -}}
{{- if or (not (regexMatch "^[0-9]+$" (toString $exporter.port))) (lt (int $exporter.port) 1) (gt (int $exporter.port) 65535) -}}
{{- fail "logging.collector.exporter.port must be an integer TCP port from 1 to 65535" -}}
{{- end -}}
{{- if not (kindIs "bool" $collector.metrics.enabled) -}}
{{- fail "logging.collector.metrics.enabled must be a boolean" -}}
{{- end -}}
{{- if ne (empty $collector.metrics.scraperNamespaceLabels) (empty $collector.metrics.scraperPodLabels) -}}
{{- fail "logging.collector.metrics requires both scraperNamespaceLabels and scraperPodLabels, or neither" -}}
{{- end -}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openclaw-enterprise-collector
  labels:
    {{- include "openclaw.labels" (dict "root" . "component" "collector") | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-openclaw-log-metadata
rules:
  - apiGroups: [""]
    # Namespace and node names come from Pod fields; no other object reads are needed.
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-openclaw-log-metadata
subjects:
  - kind: ServiceAccount
    name: openclaw-enterprise-collector
    namespace: {{ .Release.Namespace | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-openclaw-log-metadata
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: openclaw-enterprise-collector
  labels:
    {{- include "openclaw.labels" (dict "root" . "component" "collector") | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: openclaw-enterprise
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
      app.kubernetes.io/component: collector
  template:
    metadata:
      labels:
        {{- include "openclaw.labels" (dict "root" . "component" "collector") | nindent 8 }}
    spec:
      serviceAccountName: openclaw-enterprise-collector
      automountServiceAccountToken: true
      securityContext:
        {{- include "openclaw.podSecurity" . | nindent 8 }}
        fsGroupChangePolicy: OnRootMismatch
        # CRI log directories commonly use root:root 0750 and files 0640.
        # Supplementary read access keeps the Collector UID non-root.
        supplementalGroups: [0]
      volumes:
        - name: collector-config
          secret:
            secretName: {{ $collector.configSecretName | quote }}
            items:
              - key: collector.yaml
                path: collector.yaml
              - key: kubernetes.yaml
                path: receiver.yaml
              - key: exporter.yaml
                path: exporter.yaml
        - name: pod-logs
          hostPath:
            path: /var/log/pods
            type: Directory
        - name: collector-state
          emptyDir:
            sizeLimit: {{ $collector.state.sizeLimit | quote }}
        - name: collector-tmp
          emptyDir:
            sizeLimit: {{ $collector.tmp.sizeLimit | quote }}
      containers:
        - name: collector
          image: {{ $collector.image | quote }}
          args:
            - --config=/etc/otel/collector.yaml
            - --config=/etc/otel/receiver.yaml
            - --config=/etc/otel/exporter.yaml
          securityContext:
            {{- include "openclaw.containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml $collector.resources | nindent 12 }}
          env:
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          {{- if $collector.envSecretName }}
          envFrom:
            - secretRef:
                name: {{ $collector.envSecretName | quote }}
          {{- end }}
          {{- if $collector.metrics.enabled }}
          ports:
            - name: metrics
              containerPort: 8888
          {{- end }}
          volumeMounts:
            - name: collector-config
              mountPath: /etc/otel
              readOnly: true
            - name: pod-logs
              mountPath: /var/log/pods
              readOnly: true
            - name: collector-state
              mountPath: /var/lib/otelcol
            - name: collector-tmp
              mountPath: /tmp
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openclaw-enterprise-collector-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openclaw-enterprise
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
      app.kubernetes.io/component: collector
  policyTypes: [Egress]
  egress:
    {{- include "openclaw.networkPolicy.dnsEgress" . | nindent 4 }}
    - to:
        {{- range .Values.cluster.cidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.cluster.port }}
    - to:
        {{- if $exporter.cidr }}
        - ipBlock:
            cidr: {{ $exporter.cidr }}
        {{- else }}
        - namespaceSelector:
            matchLabels:
              {{- toYaml $exporter.namespaceLabels | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml $exporter.podLabels | nindent 14 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ $collector.exporter.port }}
{{- if and $collector.metrics.enabled (not (empty $collector.metrics.scraperNamespaceLabels)) }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openclaw-enterprise-collector-metrics
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openclaw-enterprise
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
      app.kubernetes.io/component: collector
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml $collector.metrics.scraperNamespaceLabels | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml $collector.metrics.scraperPodLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8888
{{- end }}
{{- end }}
