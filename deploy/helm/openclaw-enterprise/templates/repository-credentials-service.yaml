{{- if .Values.repositoryCredentials.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "openclaw.repositoryCredentials.serviceName" . | quote }}
  {{- if eq .Values.repositoryCredentials.authority "prepared-git" }}
  annotations:
    openclaw.dev/repository-credentials-hostname: {{ include "openclaw.repositoryCredentials.hostname" . | quote }}
  {{- end }}
  labels:
    {{- include "openclaw.labels" (dict "root" . "component" "repository-credentials") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: openclaw-enterprise
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/component: worker
  ports:
    - name: https
      port: 443
      targetPort: 8443
      protocol: TCP
{{- end }}
