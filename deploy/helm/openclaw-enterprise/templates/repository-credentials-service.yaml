{{- if .Values.repositoryCredentials.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "openclaw.repositoryCredentials.serviceName" . }}
  labels:
    {{- include "openclaw.labels" (dict "root" . "component" "repository-credentials") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: openclaw-enterprise
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: worker
  ports:
    - name: https
      port: 443
      targetPort: 8443
      protocol: TCP
{{- end }}
