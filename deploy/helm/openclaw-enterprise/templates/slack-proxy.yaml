{{- if .Values.slackProxy.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw-enterprise-slack-proxy
  labels:
    {{- include "openclaw.labels" (dict "root" . "component" "slack-proxy") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openclaw-enterprise
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
      app.kubernetes.io/component: slack-proxy
  template:
    metadata:
      labels:
        {{- include "openclaw.labels" (dict "root" . "component" "slack-proxy") | nindent 8 }}
      {{- with .Values.controlPlane.installationChecksum }}
      annotations:
        openclaw.dev/installation-checksum: {{ . | quote }}
      {{- end }}
    spec:
      serviceAccountName: openclaw-enterprise-slack-proxy
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        {{- include "openclaw.podSecurity" . | nindent 8 }}
      {{- with .Values.controlPlane.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: slack-proxy
          image: {{ .Values.images.controller | quote }}
          args:
            - apps/controller/src/slack-proxy.mjs
          securityContext:
            {{- include "openclaw.containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml .Values.slackProxy.resources | nindent 12 }}
          env:
            - name: NODE_ENV
              value: production
            - name: OCC_SLACK_PROXY_PORT
              value: {{ .Values.slackProxy.port | quote }}
          ports:
            - name: proxy
              containerPort: {{ .Values.slackProxy.port }}
          readinessProbe:
            tcpSocket:
              port: proxy
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "openclaw.slackProxy.serviceName" . | quote }}
  labels:
    {{- include "openclaw.labels" (dict "root" . "component" "slack-proxy") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: openclaw-enterprise
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/component: slack-proxy
  ports:
    - name: proxy
      port: {{ .Values.slackProxy.port }}
      targetPort: proxy
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openclaw-enterprise-slack-proxy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openclaw-enterprise
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
      app.kubernetes.io/component: slack-proxy
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace | quote }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: openclaw-enterprise
              app.kubernetes.io/instance: {{ .Release.Name | quote }}
              app.kubernetes.io/component: api
        {{- if .Values.gatewayRouting.enabled }}
        - namespaceSelector:
            matchLabels:
              openclaw-enterprise.io/gateway: {{ include "openclaw.gatewayRouting.routeNamespaceLabel" . | quote }}
            matchExpressions:
              - key: openclaw.dev/gateway-namespace
                operator: Exists
          podSelector:
            matchLabels:
              app.kubernetes.io/managed-by: openclaw-enterprise
              openclaw.dev/workload-role: gateway
            matchExpressions:
              - key: openclaw.dev/agent
                operator: Exists
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.slackProxy.port }}
  egress:
    {{- include "openclaw.networkPolicy.dnsEgress" . | nindent 4 }}
    - to:
        # Slack rotates public endpoints; hostname authorization stays in the proxy.
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.0.2.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 198.51.100.0/24
              - 203.0.113.0/24
              - 224.0.0.0/4
              - 240.0.0.0/4
      ports:
        - protocol: TCP
          port: 443
{{- end }}
