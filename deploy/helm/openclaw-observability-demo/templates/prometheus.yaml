{{- include "demo.validate" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-prometheus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-prometheus-discovery
  namespace: {{ .Values.occ.namespace }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-prometheus-discovery
  namespace: {{ .Values.occ.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-prometheus-discovery
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-prometheus
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-prometheus
data:
  prometheus.yaml: |
    global:
      scrape_interval: 5s
      scrape_timeout: 4s
    scrape_configs:
      {{- range $component := list "api" "worker" "collector" }}
      - job_name: {{ if eq $component "collector" }}collector{{ else }}occ-{{ $component }}{{ end }}
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [{{ $.Values.occ.namespace | quote }}]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            regex: openclaw-enterprise
            action: keep
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_instance]
            regex: {{ $.Values.occ.release | regexQuoteMeta | quote }}
            action: keep
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            regex: {{ $component }}
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: metrics
            action: keep
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Running
            action: keep
          - target_label: cluster
            replacement: demonstration
          - target_label: installation
            replacement: {{ $.Values.occ.release | quote }}
      {{- end }}
