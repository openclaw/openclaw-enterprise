{
  "apiVersion": "apiextensions.k8s.io/v1",
  "kind": "CustomResourceDefinition",
  "metadata": {
    "name": "oceconnections.enterprise.openclaw.ai"
  },
  "spec": {
    "group": "enterprise.openclaw.ai",
    "scope": "Namespaced",
    "names": {
      "kind": "OCEConnection",
      "singular": "oceconnection",
      "plural": "oceconnections"
    },
    "versions": [
      {
        "name": "v1alpha1",
        "served": true,
        "storage": true,
        "subresources": {
          "status": {}
        },
        "additionalPrinterColumns": [
          {
            "name": "Ready",
            "type": "string",
            "jsonPath": ".status.conditions[?(@.type==\"Ready\")].status"
          },
          {
            "name": "Revision",
            "type": "string",
            "jsonPath": ".status.activeRevisionId"
          },
          {
            "name": "Age",
            "type": "date",
            "jsonPath": ".metadata.creationTimestamp"
          }
        ],
        "schema": {
          "openAPIV3Schema": {
            "type": "object",
            "required": [
              "spec"
            ],
            "properties": {
              "apiVersion": {
                "type": "string"
              },
              "kind": {
                "type": "string"
              },
              "metadata": {
                "type": "object"
              },
              "spec": {
                "type": "object",
                "required": [
                  "endpoint",
                  "installationId",
                  "serviceKeyRef",
                  "namespaceScope"
                ],
                "properties": {
                  "endpoint": {
                    "type": "string",
                    "pattern": "^https://",
                    "x-kubernetes-validations": [
                      {
                        "rule": "self == oldSelf",
                        "message": "Reference is immutable"
                      }
                    ]
                  },
                  "address": {
                    "type": "string",
                    "maxLength": 45,
                    "pattern": "^[0-9a-fA-F:.]+$"
                  },
                  "installationId": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 256,
                    "x-kubernetes-validations": [
                      {
                        "rule": "self == oldSelf",
                        "message": "Reference is immutable"
                      }
                    ]
                  },
                  "serviceKeyRef": {
                    "type": "object",
                    "required": [
                      "name",
                      "key"
                    ],
                    "properties": {
                      "name": {
                        "type": "string",
                        "minLength": 1,
                        "maxLength": 253
                      },
                      "key": {
                        "type": "string",
                        "minLength": 1,
                        "maxLength": 253
                      }
                    }
                  },
                  "caSecretKeyRef": {
                    "type": "object",
                    "required": [
                      "name",
                      "key"
                    ],
                    "properties": {
                      "name": {
                        "type": "string",
                        "minLength": 1,
                        "maxLength": 253
                      },
                      "key": {
                        "type": "string",
                        "minLength": 1,
                        "maxLength": 253
                      }
                    }
                  },
                  "namespaceScope": {
                    "type": "object",
                    "required": [
                      "existingIds",
                      "allowCreate"
                    ],
                    "properties": {
                      "existingIds": {
                        "type": "array",
                        "items": {
                          "type": "string",
                          "minLength": 1,
                          "maxLength": 256
                        },
                        "maxItems": 1000
                      },
                      "allowCreate": {
                        "type": "boolean",
                        "default": false
                      }
                    }
                  },
                  "approvedSecretKeys": {
                    "type": "array",
                    "items": {
                      "type": "object",
                      "required": [
                        "name",
                        "key"
                      ],
                      "properties": {
                        "name": {
                          "type": "string",
                          "minLength": 1,
                          "maxLength": 253
                        },
                        "key": {
                          "type": "string",
                          "minLength": 1,
                          "maxLength": 253
                        }
                      }
                    },
                    "maxItems": 1000
                  }
                }
              },
              "status": {
                "type": "object",
                "properties": {
                  "observedGeneration": {
                    "type": "integer",
                    "format": "int64",
                    "minimum": 0
                  },
                  "namespaceId": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 256
                  },
                  "secretId": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 256
                  },
                  "agentId": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 256
                  },
                  "configurationId": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 256
                  },
                  "activeRevisionId": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 256
                  },
                  "requestedRevisionId": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 256
                  },
                  "operationId": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 256
                  },
                  "provisioningRequestId": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 256
                  },
                  "provisioningWorkId": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 256
                  },
                  "managementVersion": {
                    "type": "integer",
                    "format": "int64",
                    "minimum": 1
                  },
                  "lastObservedTime": {
                    "type": "string",
                    "format": "date-time"
                  },
                  "conditions": {
                    "type": "array",
                    "x-kubernetes-list-type": "map",
                    "x-kubernetes-list-map-keys": [
                      "type"
                    ],
                    "items": {
                      "type": "object",
                      "required": [
                        "type",
                        "status",
                        "reason",
                        "message",
                        "lastTransitionTime",
                        "observedGeneration"
                      ],
                      "properties": {
                        "type": {
                          "type": "string",
                          "minLength": 1,
                          "maxLength": 253
                        },
                        "status": {
                          "type": "string",
                          "enum": [
                            "True",
                            "False",
                            "Unknown"
                          ]
                        },
                        "reason": {
                          "type": "string",
                          "minLength": 1,
                          "maxLength": 253
                        },
                        "message": {
                          "type": "string",
                          "maxLength": 1024
                        },
                        "lastTransitionTime": {
                          "type": "string",
                          "format": "date-time"
                        },
                        "observedGeneration": {
                          "type": "integer",
                          "format": "int64",
                          "minimum": 0
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    ]
  }
}
