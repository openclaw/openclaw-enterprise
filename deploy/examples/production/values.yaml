# Production Helm values for an OpenClaw Enterprise control plane.
# Replace example domains, selectors, CIDRs, Secret names, node selectors, and image digests
# with reviewed site-specific values before installing.
# The [local image build](../../../docs/guides/deploy/local-operations.md#build-images-for-local-kubernetes) fills a real local digest.
images:
  controller: registry.example.invalid/openclaw-enterprise/controller@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

auth:
  baseUrl: https://console.oce.example.internal
  # GitHub sign-in is a later helm upgrade, never the first install; it requires
  # agentNativeAdmin.enabled: false. See the "Enable GitHub browser sign-in" guide.
  # recoveryUserId: <recovery administrator user ID>
  # github:
  #   enabled: true
  #   secretName: occ-github-login
  #   egressCidrs: []  # empty allows HTTPS to any non-link-local address; or api.github.com/meta ranges

# Route wildcard DNS/TLS to OCC; the shared parent must contain only trusted OCE ingress hosts.
# See docs/guides/deploy/native-admin.md before installing.
agentNativeAdmin:
  enabled: true
  domain: agents.oce.example.internal
  sharedCookieDomain: oce.example.internal

bootstrap:
  adminEmail: admin@example.invalid
  password:
    claimName: occ-bootstrap-admin-password

database:
  caSecretName: occ-rds-ca
  caKey: ca.pem
  caMountPath: /etc/openclaw/database-ca
  cidrs:
    - 10.45.0.12/32
    - 10.45.0.13/32

api:
  # For Slack directory lookup, set the approved proxy independently of the
  # gateway proxy in installation.yaml, or enable slackProxy below.
  # See docs/guides/integrations/slack.md.
  # channelDirectoryProxyUrl: http://198.51.100.25:3128
  # Optional; see model discovery in docs/reference/console/create-and-deploy.md.
  modelDiscoveryCidrs: []
  # Optional: trust client-address headers from ingress-nginx, an AWS ALB, or a
  # generic proxy. See docs/reference/settings/production.md.
  # trustedProxy:
  #   preset: ingress-nginx
  #   cidrs: [10.42.0.0/16]
  clients:
    - namespace: operator-tools
      podLabels:
        app: occ-operator

cluster:
  cidrs:
    - 10.43.0.1/32
    - 10.43.0.2/32

controlPlane:
  nodeSelector:
    oce-role: control

# Required by dedicated Harness storage; install Envoy Gateway and cert-manager,
# and create this service-key Secret before deployment. See workspace-routing.md.
gatewayRouting:
  enabled: true
  gatewayClassName: eg
  apiKeySecretName: occ-private-gateway-key

# Opt in only after provisioning Namespace IDs and the referenced immutable registry,
# protected service configuration, App key, TLS certificate and separate public CA.
# The matching Installation must select repo and its Compute peer.
repositoryCredentials:
  enabled: false
  # image: registry.example.invalid/openclaw-enterprise/repository-credentials@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
  # backendId: github-primary
  # registryConfigMapName: occ-repository-registry-v1
  # serviceConfigSecretName: occ-repository-service-config
  # appKeySecretName: occ-repository-app-key
  # tlsSecretName: occ-repository-tls
  # publicCaSecretName: occ-repository-public-ca
  # serviceName: git
  # upstreamCidrs: [198.51.100.0/24]

# Optional chart-managed CONNECT proxy for Slack directory lookup and future
# gateway channel traffic. Public HTTPS egress excludes private/reserved ranges.
slackProxy:
  enabled: false

# Metrics listeners are enabled privately. Set both selectors to admit your scraper.
metrics:
  enabled: true
  scraperNamespaceLabels: {}
  scraperPodLabels: {}
