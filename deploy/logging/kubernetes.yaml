receivers:
  filelog:
    include:
      - /var/log/pods/*_openclaw-enterprise-*_*/*/*.log
      # The initialization Job's Pods are named by generateName from
      # `<release>-initialization-`, which Kubernetes cuts to 58 characters
      # before adding 5 random ones: a 53-character release name keeps only
      # `-init` of the suffix. Match that remainder and the Job's container names.
      # Records are classified by Pod labels, not by file name.
      - /var/log/pods/*_*-init*_*/migration/*.log
      - /var/log/pods/*_*-init*_*/bootstrap/*.log
      - /var/log/pods/*_gateway-*_*/*/*.log
      - /var/log/pods/*_agent-*_*/*/*.log
    exclude:
      - /var/log/pods/*_openclaw-enterprise-collector-*_*/*/*.log
    include_file_path: true
    start_at: beginning
    storage: file_storage
    max_log_size: 32KiB
    max_log_size_behavior: truncate
    max_concurrent_files: 64
    operators:
      - type: container
        max_log_size: 32KiB
        on_error: drop

processors:
  k8sattributes:
    auth_type: serviceAccount
    # filelog reads existing CRI files as soon as the pipeline starts. A record
    # processed before the Pod cache syncs gets no service identity, is dropped
    # as unclassified, and its offset is still committed, so it is lost for good.
    # Block pipeline start until the Pod cache syncs; the reflector retries while
    # the API server is unreachable. The timeout is deliberately very long:
    # Collector 0.159 hangs rather than exits when this wait times out, so a
    # short bound would turn a slow API into a stuck Collector.
    wait_for_metadata: true
    wait_for_metadata_timeout: 8760h
    filter:
      node_from_env_var: K8S_NODE_NAME
    pod_association:
      - sources:
          - from: resource_attribute
            name: k8s.pod.uid
    extract:
      metadata:
        [
          k8s.pod.name,
          k8s.pod.uid,
          k8s.namespace.name,
          k8s.node.name,
          container.id,
          container.image.name,
          container.image.tag,
          container.image.repo_digests,
        ]
      labels:
        - { tag_name: occ.component, key: app.kubernetes.io/component, from: pod }
        - { tag_name: occ.application, key: app.kubernetes.io/name, from: pod }
        - { tag_name: occ.managed_by, key: app.kubernetes.io/managed-by, from: pod }
        - { tag_name: occ.role, key: openclaw.dev/workload-role, from: pod }
        - { tag_name: openclaw.namespace.id, key: openclaw.dev/namespace, from: pod }
        - { tag_name: openclaw.agent.id, key: openclaw.dev/agent, from: pod }
        - { tag_name: openclaw.revision.id, key: openclaw.dev/revision, from: pod }
  transform/kubernetes:
    error_mode: silent
    log_statements:
      - context: log
        statements:
          - set(attributes["container.id"], resource.attributes["container.id"])
          - set(attributes["service.instance.id"], resource.attributes["k8s.pod.uid"])
          - set(attributes["service.version"], resource.attributes["container.image.tag"])
          - set(attributes["service.version"], resource.attributes["container.image.repo_digests"][0]) where resource.attributes["container.image.repo_digests"] != nil
          - set(attributes["service.name"], "occ-api") where resource.attributes["occ.application"] == "openclaw-enterprise" and (resource.attributes["occ.component"] == "api" or resource.attributes["occ.component"] == "bootstrap" or resource.attributes["occ.component"] == "migrate" or resource.attributes["occ.component"] == "initialization")
          - set(attributes["service.name"], "occ-worker") where resource.attributes["occ.application"] == "openclaw-enterprise" and resource.attributes["occ.component"] == "worker"
          - set(attributes["service.name"], "openclaw-gateway") where resource.attributes["occ.managed_by"] == "openclaw-enterprise" and resource.attributes["occ.role"] == "gateway"
          - set(attributes["service.name"], "codex-app-server") where resource.attributes["occ.managed_by"] == "openclaw-enterprise" and resource.attributes["occ.role"] == "agent"
          - set(attributes["openclaw.namespace.id"], resource.attributes["openclaw.namespace.id"])
          - set(attributes["openclaw.agent.id"], resource.attributes["openclaw.agent.id"])
          - set(attributes["openclaw.revision.id"], resource.attributes["openclaw.revision.id"])
  transform/kubernetes-resource:
    error_mode: silent
    log_statements:
      - context: resource
        statements:
          # k8sattributes reports "latest" for a digest-only Pod image. The repo
          # digest is the identity, and a real "latest" tag is mutable, so drop it.
          - delete_key(attributes, "container.image.tag") where attributes["container.image.tag"] == "latest" and attributes["container.image.repo_digests"] != nil
          - keep_keys(attributes, ["k8s.pod.name", "k8s.pod.uid", "k8s.namespace.name", "k8s.node.name", "container.image.name", "container.image.tag", "container.image.repo_digests"])

service:
  pipelines:
    logs:
      receivers: [filelog]
      processors:
        [
          memory_limiter,
          k8sattributes,
          transform/kubernetes,
          transform/kubernetes-resource,
          transform/operational,
          filter/operational,
          groupbyattrs/identity,
          batch,
        ]
      exporters: [otlp_http]
