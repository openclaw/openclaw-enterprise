# Shared operational-log policy. Receivers and exporter configuration are separate
# native Collector files; no application reads exporter credentials.
extensions:
  file_storage:
    directory: /var/lib/otelcol
    create_directory: true

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 96
    spike_limit_mib: 16
  transform/operational:
    error_mode: silent
    log_statements:
      - context: log
        statements:
          # Retain only transport-derived identity before examining untrusted JSON.
          - keep_keys(attributes, ["service.name", "service.instance.id", "service.version", "container.id", "openclaw.namespace.id", "openclaw.agent.id", "openclaw.revision.id", "log.iostream"])
          - set(cache["record"], ParseJSON(body)) where IsString(body) and Len(body) <= 32768
          - set(attributes["event.name"], cache["record"]["event"]) where IsMap(cache["record"]) and (attributes["service.name"] == "occ-api" or attributes["service.name"] == "occ-worker") and IsString(cache["record"]["event"]) and IsMatch(cache["record"]["event"], "^(listening|startup-error|http[.]completed|http[.]unexpected_error|compute[.]preflight-warning|worker[.](started|stopped|health|completed|error|startup-error)|installation[.](bootstrapped|already-bootstrapped|bootstrap-failed)|migration[.](completed|failed))$$")
          - set(attributes["event.name"], "gateway.operational") where IsMap(cache["record"]) and attributes["service.name"] == "openclaw-gateway" and IsString(cache["record"]["subsystem"]) and IsMatch(cache["record"]["subsystem"], "^gateway(/|$$)")
          - set(attributes["event.name"], "codex.operational") where IsMap(cache["record"]) and attributes["service.name"] == "codex-app-server" and attributes["log.iostream"] == "stderr" and IsString(cache["record"]["target"]) and IsMatch(cache["record"]["target"], "^codex_app_server(::|$$)")
          - set(attributes["request.id"], cache["record"]["requestId"]) where attributes["event.name"] != nil and (attributes["service.name"] == "occ-api" or attributes["service.name"] == "occ-worker") and IsString(cache["record"]["requestId"]) and IsMatch(cache["record"]["requestId"], "^([a-z_]+_)?[a-f0-9-]{36}$$")
          - set(attributes["occ.namespace.id"], cache["record"]["namespaceId"]) where attributes["event.name"] != nil and (attributes["service.name"] == "occ-api" or attributes["service.name"] == "occ-worker") and IsString(cache["record"]["namespaceId"]) and IsMatch(cache["record"]["namespaceId"], "^([a-z_]+_)?[a-f0-9-]{36}$$")
          - set(attributes["occ.agent.id"], cache["record"]["agentId"]) where attributes["event.name"] != nil and (attributes["service.name"] == "occ-api" or attributes["service.name"] == "occ-worker") and IsString(cache["record"]["agentId"]) and IsMatch(cache["record"]["agentId"], "^([a-z_]+_)?[a-f0-9-]{36}$$")
          - set(attributes["occ.revision.id"], cache["record"]["revisionId"]) where attributes["event.name"] != nil and (attributes["service.name"] == "occ-api" or attributes["service.name"] == "occ-worker") and IsString(cache["record"]["revisionId"]) and IsMatch(cache["record"]["revisionId"], "^([a-z_]+_)?[a-f0-9-]{36}$$")
          - set(attributes["occ.code"], cache["record"]["code"]) where attributes["event.name"] != nil and (attributes["service.name"] == "occ-api" or attributes["service.name"] == "occ-worker") and IsString(cache["record"]["code"]) and IsMatch(cache["record"]["code"], "^[A-Z][A-Z0-9_]{0,63}$$")
          - set(attributes["http.request.method"], cache["record"]["method"]) where attributes["event.name"] == "http.completed" and IsString(cache["record"]["method"]) and IsMatch(cache["record"]["method"], "^(GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS)$$")
          - set(attributes["http.response.status_code"], Int(cache["record"]["status"])) where attributes["event.name"] == "http.completed" and (IsInt(cache["record"]["status"]) or IsDouble(cache["record"]["status"])) and cache["record"]["status"] >= 100 and cache["record"]["status"] <= 599
          - set(attributes["duration_ms"], cache["record"]["durationMs"]) where attributes["event.name"] == "http.completed" and (IsInt(cache["record"]["durationMs"]) or IsDouble(cache["record"]["durationMs"])) and cache["record"]["durationMs"] >= 0 and cache["record"]["durationMs"] <= 600000
          - set(attributes["work.attempt"], Int(cache["record"]["attempt"])) where attributes["service.name"] == "occ-worker" and (IsInt(cache["record"]["attempt"]) or IsDouble(cache["record"]["attempt"])) and cache["record"]["attempt"] >= 0 and cache["record"]["attempt"] <= 1000
          - set(attributes["work.outcome"], cache["record"]["outcome"]) where attributes["service.name"] == "occ-worker" and IsString(cache["record"]["outcome"]) and IsMatch(cache["record"]["outcome"], "^(success|failure|ready|activated|pending|retry|permanent|superseded)$$")
          - set(attributes["work.id"], cache["record"]["workId"]) where attributes["service.name"] == "occ-worker" and IsString(cache["record"]["workId"]) and IsMatch(cache["record"]["workId"], "^((namespace|agent_revision):[a-z_]+_[a-f0-9-]{36}:[a-z_]+(:(ready|deleted|[0-9]+))?|agent:agt_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}:reconcile:(deleted|stopped:[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}))$$")
          - set(attributes["work.operation"], cache["record"]["operation"]) where attributes["service.name"] == "occ-worker" and IsString(cache["record"]["operation"]) and IsMatch(cache["record"]["operation"], "^(agent_revision[.]reconcile|agent[.](stop|delete)|namespace[.](ensure|delete)|work[.]reconcile)$$")
          - set(cache["level"], cache["record"]["severity"]) where IsMap(cache["record"])
          - set(cache["level"], cache["record"]["level"]) where IsMap(cache["record"]) and cache["level"] == nil
          - set(severity_number, SEVERITY_NUMBER_DEBUG) where cache["level"] == "debug" or cache["level"] == "DEBUG" or cache["level"] == 20
          - set(severity_number, SEVERITY_NUMBER_INFO) where cache["level"] == "info" or cache["level"] == "INFO" or cache["level"] == 30
          - set(severity_number, SEVERITY_NUMBER_WARN) where cache["level"] == "warn" or cache["level"] == "WARN" or cache["level"] == 40
          - set(severity_number, SEVERITY_NUMBER_ERROR) where cache["level"] == "error" or cache["level"] == "ERROR" or cache["level"] == 50
          - set(severity_text, "DEBUG") where severity_number == SEVERITY_NUMBER_DEBUG
          - set(severity_text, "INFO") where severity_number == SEVERITY_NUMBER_INFO
          - set(severity_text, "WARN") where severity_number == SEVERITY_NUMBER_WARN
          - set(severity_text, "ERROR") where severity_number == SEVERITY_NUMBER_ERROR
          # Time comes from the Engine/CRI envelope; arbitrary runtime message text
          # and fields never become the remote body or resource identity.
          - set(body, attributes["event.name"])
  filter/operational:
    error_mode: propagate
    logs:
      log_record:
        - 'attributes["event.name"] == nil'
        - "severity_number == SEVERITY_NUMBER_UNSPECIFIED"
        - 'attributes["service.name"] == "codex-app-server" and attributes["log.iostream"] != "stderr"'
  groupbyattrs/identity:
    keys:
      - service.name
      - service.instance.id
      - service.version
      - container.id
      - openclaw.namespace.id
      - openclaw.agent.id
      - openclaw.revision.id
  batch:
    timeout: 1s
    send_batch_size: 128
    send_batch_max_size: 256

service:
  extensions: [file_storage]
  telemetry:
    logs:
      level: error
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
