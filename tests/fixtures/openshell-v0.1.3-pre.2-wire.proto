// Independent wire oracle extracted from NVIDIA OpenShell commit
// 021400be8af471f8669369e679de3e18cf0bd672. Keep this fixture pinned to that
// upstream contract; do not derive it from the production client proto.
syntax = "proto3";

package openshell.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

service OpenShell {
  rpc ExecSandbox(ExecSandboxRequest) returns (stream ExecSandboxEvent);
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc CreateSandbox(CreateSandboxRequest) returns (SandboxResponse);
  rpc GetSandbox(GetSandboxRequest) returns (SandboxResponse);
  rpc GetService(GetServiceRequest) returns (ServiceEndpointResponse);
  rpc DeleteSandbox(DeleteSandboxRequest) returns (DeleteSandboxResponse);
  rpc GetSandboxLogs(GetSandboxLogsRequest) returns (GetSandboxLogsResponse);
  rpc GetSandboxProviderStatus(GetSandboxProviderStatusRequest)
      returns (GetSandboxProviderStatusResponse);
  rpc CreateProvider(CreateProviderRequest) returns (ProviderResponse);
  rpc UpdateProvider(UpdateProviderRequest) returns (ProviderResponse);
  rpc DetachSandboxProvider(DetachSandboxProviderRequest)
      returns (DetachSandboxProviderResponse);
  rpc ImportProviderProfiles(ImportProviderProfilesRequest)
      returns (ImportProviderProfilesResponse);
  rpc GetProviderRefreshStatus(GetProviderRefreshStatusRequest)
      returns (GetProviderRefreshStatusResponse);
  rpc ConfigureProviderRefresh(ConfigureProviderRefreshRequest)
      returns (ConfigureProviderRefreshResponse);
  rpc RotateProviderCredential(RotateProviderCredentialRequest)
      returns (RotateProviderCredentialResponse);
  rpc DeleteProviderRefresh(DeleteProviderRefreshRequest)
      returns (DeleteProviderRefreshResponse);
}

message HealthRequest {}

message HealthResponse {
  ServiceStatus status = 1;
  string version = 2;
}

enum ServiceStatus {
  SERVICE_STATUS_UNSPECIFIED = 0;
  SERVICE_STATUS_HEALTHY = 1;
}

message WorkspaceSelector {
  oneof selection {
    string workspace = 1;
  }
}

message CreateSandboxRequest {
  SandboxSpec spec = 1;
  string name = 2;
  map<string, string> labels = 3;
  map<string, string> annotations = 4;
  WorkspaceSelector workspace_scope = 7;
  string request_id = 8;
  repeated SandboxServiceExposure service_exposures = 9;
}

message SandboxServiceExposure {
  string service = 1;
  uint32 target_port = 2;
  ServiceAuthorizationMode authorization_mode = 3;
}

enum ServiceAuthorizationMode {
  SERVICE_AUTHORIZATION_MODE_UNSPECIFIED = 0;
  SERVICE_AUTHORIZATION_MODE_STRIP = 1;
  SERVICE_AUTHORIZATION_MODE_BEARER_PASSTHROUGH = 2;
}

message DeleteSandboxRequest {
  string name = 1;
  WorkspaceSelector workspace_scope = 2;
}

message GetSandboxRequest {
  string name = 1;
  WorkspaceSelector workspace_scope = 2;
}

message GetServiceRequest {
  string sandbox = 1;
  // Empty selects the unnamed endpoint.
  string name = 2;
  WorkspaceSelector workspace_scope = 3;
}

message SandboxSpec {
  SandboxPolicy policy = 7;
  repeated string providers = 8;
}

message SandboxPolicy {
  map<string, NetworkPolicyRule> network_policies = 5;
}

message NetworkPolicyRule {
  string name = 1;
  repeated NetworkEndpoint endpoints = 2;
  repeated NetworkBinary binaries = 3;
}

message NetworkBinary {
  string path = 1;
  reserved 2;
  reserved "harness";
}

message NetworkEndpoint {
  string host = 1;
  uint32 port = 2;
  string protocol = 3;
  NetworkTlsMode tls = 4;
  NetworkEnforcementMode enforcement = 5;
  NetworkAccessPreset access = 6;
  repeated uint32 ports = 9;
  string path = 15;
  bool websocket_credential_rewrite = 16;
  NetworkCredentialBinding credential_binding = 24;
}

message NetworkCredentialBinding { string provider = 1; }

enum NetworkTlsMode {
  NETWORK_TLS_MODE_UNSPECIFIED = 0;
  NETWORK_TLS_MODE_SKIP = 1;
  NETWORK_TLS_MODE_TERMINATE = 2 [deprecated = true];
  NETWORK_TLS_MODE_PASSTHROUGH = 3 [deprecated = true];
}

enum NetworkEnforcementMode {
  NETWORK_ENFORCEMENT_MODE_UNSPECIFIED = 0;
  NETWORK_ENFORCEMENT_MODE_ENFORCE = 1;
  NETWORK_ENFORCEMENT_MODE_AUDIT = 2;
}

enum NetworkAccessPreset {
  NETWORK_ACCESS_PRESET_UNSPECIFIED = 0;
  NETWORK_ACCESS_PRESET_READ_ONLY = 1;
  NETWORK_ACCESS_PRESET_READ_WRITE = 2;
  NETWORK_ACCESS_PRESET_FULL = 3;
}

message SandboxResponse {
  Sandbox sandbox = 1;
  map<string, string> service_urls = 2;
}

message ServiceEndpoint {
  ObjectMeta metadata = 1;
  string sandbox_id = 2;
  string sandbox = 3;
  string name = 4;
  uint32 target_port = 5;
  bool domain = 6;
  ServiceAuthorizationMode authorization_mode = 7;
}

message ServiceEndpointResponse {
  ServiceEndpoint endpoint = 1;
  string url = 2;
}

message Sandbox {
  ObjectMeta metadata = 1;
  SandboxSpec spec = 2;
}

message ObjectMeta {
  string id = 1;
  string name = 2;
  map<string, string> labels = 4;
  uint64 resource_version = 5;
  map<string, string> annotations = 6;
  string workspace = 7;
}

message DeleteSandboxResponse {
  reserved 1;
  reserved "deleted";
  DeletionOutcome outcome = 2;
  string sandbox_id = 3;
}

enum DeletionOutcome {
  DELETION_OUTCOME_UNSPECIFIED = 0;
  DELETION_OUTCOME_COMPLETED = 1;
  DELETION_OUTCOME_ACCEPTED = 2;
  DELETION_OUTCOME_ALREADY_ABSENT = 3;
}

// openshell.datamodel.v1.Provider
message Provider {
  reserved 5;
  reserved "credential_expires_at_ms";
  ObjectMeta metadata = 1;
  string type = 2;
  map<string, string> credentials = 3;
  map<string, string> config = 4;
  map<string, google.protobuf.Timestamp> credential_expiration_times = 105;
  string profile_workspace = 6;
}

message CreateProviderRequest {
  WorkspaceSelector workspace_scope = 2;
  Provider provider = 1;
  string request_id = 3;
}

message ProviderResponse {
  Provider provider = 1;
  string mutation_id = 3;
}

message UpdateProviderRequest {
  WorkspaceSelector workspace_scope = 3;
  reserved 2;
  reserved "credential_expires_at_ms";
  Provider provider = 1;
  map<string, google.protobuf.Timestamp> credential_expiration_times = 102;
  repeated string clear_credential_expiration_keys = 103;
  string request_id = 4;
}

message DetachSandboxProviderRequest {
  WorkspaceSelector workspace_scope = 4;
  string sandbox = 1;
  string provider = 2;
  uint64 expected_resource_version = 3;
  string request_id = 5;
}

message DetachSandboxProviderResponse {
  Sandbox sandbox = 1;
  bool detached = 2;
  ProviderMutationReceipt receipt = 3;
}

enum ProviderMutationKind {
  PROVIDER_MUTATION_KIND_UNSPECIFIED = 0;
  PROVIDER_MUTATION_KIND_ATTACH = 1;
  PROVIDER_MUTATION_KIND_DETACH = 2;
  PROVIDER_MUTATION_KIND_UPDATE = 3;
}

message ProviderMutationReceipt {
  string receipt_id = 1;
  string mutation_id = 2;
  string provider = 3;
  string workspace = 4;
  ProviderMutationKind kind = 5;
}

enum ProviderProfileCategory {
  PROVIDER_PROFILE_CATEGORY_UNSPECIFIED = 0;
  PROVIDER_PROFILE_CATEGORY_OTHER = 1;
  PROVIDER_PROFILE_CATEGORY_INFERENCE = 2;
  PROVIDER_PROFILE_CATEGORY_AGENT = 3;
  PROVIDER_PROFILE_CATEGORY_SOURCE_CONTROL = 4;
  PROVIDER_PROFILE_CATEGORY_MESSAGING = 5;
  PROVIDER_PROFILE_CATEGORY_DATA = 6;
  PROVIDER_PROFILE_CATEGORY_KNOWLEDGE = 7;
}

message ProviderProfileCredential {
  string name = 1;
  string description = 2;
  repeated string env_vars = 3;
  bool required = 4;
  string auth_style = 5;
  string header_name = 6;
  string query_param = 7;
  ProviderCredentialRefresh refresh = 8;
  string path_template = 9;
}

message ProviderProfile {
  string id = 1;
  string display_name = 2;
  string description = 3;
  ProviderProfileCategory category = 4;
  repeated ProviderProfileCredential credentials = 5;
  repeated NetworkEndpoint endpoints = 6;
  repeated NetworkBinary binaries = 7;
  bool inference_capable = 8;
  uint64 resource_version = 10;
  map<string, string> annotations = 11;
  string source = 12;
  string scope = 13;
  repeated ProviderProfileFile files = 14;
}

message ProviderProfileFile {
  string path = 1;
  string content = 2;
  string env_var = 3;
}

message ProviderProfileImportItem {
  ProviderProfile profile = 1;
  string source = 2;
}

message ProviderProfileDiagnostic {
  string source = 1;
  string profile_id = 2;
  string field = 3;
  string message = 4;
  string severity = 5;
}

message ImportProviderProfilesRequest {
  WorkspaceSelector workspace_scope = 2;
  repeated ProviderProfileImportItem profiles = 1;
  string request_id = 3;
}

message ImportProviderProfilesResponse {
  repeated ProviderProfileDiagnostic diagnostics = 1;
  repeated ProviderProfile profiles = 2;
  bool imported = 3;
}

message GetSandboxProviderStatusRequest {
  WorkspaceSelector workspace_scope = 4;
  string sandbox = 1;
  string provider = 2;
  string receipt_id = 3;
}

message GetSandboxProviderStatusResponse {
  ProviderReadinessStatus status = 1;
}

message ProviderReadinessStatus {
  ProviderMutationReceipt receipt = 1;
  ProviderReadinessState state = 2;
  ProviderReadinessReason reason = 3;
  string network_instance_id = 5;
}

enum ProviderReadinessState {
  PROVIDER_READINESS_STATE_UNSPECIFIED = 0;
  PROVIDER_READINESS_STATE_PERSISTED = 1;
  PROVIDER_READINESS_STATE_PENDING = 2;
  PROVIDER_READINESS_STATE_READY = 3;
  PROVIDER_READINESS_STATE_WITHHELD = 4;
  PROVIDER_READINESS_STATE_REVOKED = 5;
  PROVIDER_READINESS_STATE_FAILED = 6;
  PROVIDER_READINESS_STATE_SUPERSEDED = 7;
}

enum ProviderReadinessReason {
  PROVIDER_READINESS_REASON_UNSPECIFIED = 0;
  PROVIDER_READINESS_REASON_WAITING_FOR_SUPERVISOR = 1;
  PROVIDER_READINESS_REASON_WAITING_FOR_CREDENTIALS = 2;
  PROVIDER_READINESS_REASON_WAITING_FOR_POLICY = 3;
  PROVIDER_READINESS_REASON_WAITING_FOR_PROCESS = 4;
  PROVIDER_READINESS_REASON_UNSUPPORTED_SUPERVISOR = 5;
  PROVIDER_READINESS_REASON_CREDENTIALS_WITHHELD = 6;
}

// Get sandbox logs request (one-shot fetch).
message GetSandboxLogsRequest {
  // Workspace scope. Only a named workspace selection is accepted.
  WorkspaceSelector workspace_scope = 6;
  reserved 3;
  reserved "since_ms";
  // Canonical sandbox name.
  string sandbox = 1;
  // Maximum number of log lines to return. 0 means use default (2000).
  uint32 lines = 2;
  // Only include logs at or after this time. Absence means no filter.
  google.protobuf.Timestamp since_time = 103;
  // Filter by log source (e.g. "gateway", "sandbox"). Empty means all sources.
  repeated string sources = 4;
  // Minimum log level to include (e.g. "INFO", "WARN", "ERROR"). Empty means all levels.
  string min_level = 5;
}

// Get sandbox logs response.
message GetSandboxLogsResponse {
  // Log lines in chronological order.
  repeated SandboxLogLine logs = 1;
  // Total number of lines in the server's buffer for this sandbox.
  uint32 buffer_total = 2;
}

// Log line correlated to a sandbox.
message SandboxLogLine {
  reserved 2;
  reserved "timestamp_ms";
  string sandbox_id = 1;
  google.protobuf.Timestamp event_time = 102;
  string level = 3;
  string target = 4;
  string message = 5;
  // Log source: "gateway" (server-side) or "sandbox" (supervisor).
  // Empty is treated as "gateway" for backward compatibility.
  string source = 6;
  // Structured key-value fields from the tracing event (e.g. dst_host, action).
  map<string, string> fields = 7;
}

enum ProviderCredentialRefreshStrategy {
  PROVIDER_CREDENTIAL_REFRESH_STRATEGY_UNSPECIFIED = 0;
  PROVIDER_CREDENTIAL_REFRESH_STRATEGY_STATIC = 1;
  PROVIDER_CREDENTIAL_REFRESH_STRATEGY_EXTERNAL = 2;
  PROVIDER_CREDENTIAL_REFRESH_STRATEGY_OAUTH2_REFRESH_TOKEN = 3;
  PROVIDER_CREDENTIAL_REFRESH_STRATEGY_OAUTH2_CLIENT_CREDENTIALS = 4;
  PROVIDER_CREDENTIAL_REFRESH_STRATEGY_GOOGLE_SERVICE_ACCOUNT_JWT = 5;
  PROVIDER_CREDENTIAL_REFRESH_STRATEGY_AWS_STS_ASSUME_ROLE = 6;
}

message ProviderCredentialRefreshMaterial {
  string name = 1;
  string description = 2;
  bool required = 3;
  bool secret = 4;
}

// Declares that a single refresh operation mints more than one credential.
// The refresh is attached to a primary credential; each additional output
// maps a strategy-defined semantic output id to a sibling credential whose
// env_vars receive the minted value.
message ProviderCredentialRefreshOutput {
  string output = 1;      // strategy-defined semantic output id (e.g. "session_token")
  string credential = 2;  // sibling credential name whose env_vars receive this output
}

message ProviderCredentialRefresh {
  reserved 4, 5;
  reserved "refresh_before_seconds", "max_lifetime_seconds";
  ProviderCredentialRefreshStrategy strategy = 1;
  string token_url = 2;
  repeated string scopes = 3;
  google.protobuf.Duration refresh_before = 104;
  google.protobuf.Duration max_lifetime = 105;
  repeated ProviderCredentialRefreshMaterial material = 6;
  repeated ProviderCredentialRefreshOutput additional_outputs = 7;
}

// Stable recovery action for the most recent provider credential refresh
// failure. Kept after the pre-existing enums so adding it does not renumber
// their generated descriptors. Clients should use this field instead of
// parsing last_error.
enum ProviderCredentialRefreshRecoveryAction {
  PROVIDER_CREDENTIAL_REFRESH_RECOVERY_ACTION_UNSPECIFIED = 0;
  PROVIDER_CREDENTIAL_REFRESH_RECOVERY_ACTION_RETRY = 1;
  PROVIDER_CREDENTIAL_REFRESH_RECOVERY_ACTION_REAUTHORIZE = 2;
  PROVIDER_CREDENTIAL_REFRESH_RECOVERY_ACTION_FIX_CONFIGURATION = 3;
  PROVIDER_CREDENTIAL_REFRESH_RECOVERY_ACTION_INVESTIGATE = 4;
}

message ProviderCredentialRefreshStatus {
  reserved 6, 7, 8, 13;
  reserved "expires_at_ms", "next_refresh_at_ms", "last_refresh_at_ms", "last_error_at_ms";
  string provider = 1;
  string provider_id = 2;
  string credential_key = 3;
  ProviderCredentialRefreshStrategy strategy = 4;
  string status = 5;
  google.protobuf.Timestamp expiration_time = 106;
  // Next automatic refresh time. Absence means no automatic retry is scheduled;
  // use recovery_action to determine the required recovery workflow.
  google.protobuf.Timestamp next_refresh_time = 107;
  google.protobuf.Timestamp last_refresh_time = 108;
  string last_error = 9;
  ProviderCredentialRefreshRecoveryAction recovery_action = 10;
  // Stable gateway-owned failure identifier, for example
  // "oauth_invalid_grant". This is not provider-controlled prose and
  // incorporates any recognized top-level OAuth error classification.
  string failure_code = 11;
  // A bounded, recognized provider subtype that refines failure_code; clients
  // do not need a separate provider_error field. Unknown provider-controlled
  // values are not persisted or returned.
  string provider_error_subtype = 12;
  google.protobuf.Timestamp last_error_time = 113;
}

message GetProviderRefreshStatusRequest {
  // Workspace scope. Only a named workspace selection is accepted.
  WorkspaceSelector workspace_scope = 3;
  string provider = 1;
  string credential_key = 2;
}

message GetProviderRefreshStatusResponse {
  repeated ProviderCredentialRefreshStatus credentials = 1;
}

message ConfigureProviderRefreshRequest {
  // Workspace scope. Only a named workspace selection is accepted.
  WorkspaceSelector workspace_scope = 7;
  reserved 6;
  reserved "expires_at_ms";
  string provider = 1;
  string credential_key = 2;
  ProviderCredentialRefreshStrategy strategy = 3;
  map<string, string> material = 4;
  // Additional material names the caller requests be stored as secrets. Every
  // name must be present in material. The server also classifies secrets from
  // the authoritative provider profile and refresh strategy.
  repeated string secret_material_keys = 5;
  google.protobuf.Timestamp expiration_time = 106;
  // Optional nonzero UUID for durable at-most-once admission. Successful results
  // can be replayed for 24 hours; see the API errors and retries reference.
  string request_id = 8;
}

message ConfigureProviderRefreshResponse {
  ProviderCredentialRefreshStatus status = 1;
}

message RotateProviderCredentialRequest {
  // Workspace scope. Only a named workspace selection is accepted.
  WorkspaceSelector workspace_scope = 3;
  string provider = 1;
  string credential_key = 2;
  // Optional nonzero UUID for durable at-most-once admission. Successful results
  // can be replayed for 24 hours; see the API errors and retries reference.
  string request_id = 4;
}

message RotateProviderCredentialResponse {
  ProviderCredentialRefreshStatus status = 1;
}

message DeleteProviderRefreshRequest {
  // Workspace scope. Only a named workspace selection is accepted.
  WorkspaceSelector workspace_scope = 4;
  string provider = 1;
  string credential_key = 2;
  bool allow_missing = 5;
  // Optional nonzero UUID for durable at-most-once admission. Successful results
  // can be replayed for 24 hours; see the API errors and retries reference.
  string request_id = 6;
}

message DeleteProviderRefreshResponse {
  reserved 1;
  reserved "deleted";
  DeletionOutcome outcome = 2;
}

message ExecSandboxRequest {
  // Workspace scope. Only a named workspace selection is accepted.
  WorkspaceSelector workspace_scope = 12;
  reserved 5;
  reserved "timeout_seconds";
  // Canonical sandbox name.
  string sandbox = 1;
  // Command and arguments.
  repeated string command = 2;

  // Optional working directory.
  string workdir = 3;

  // Optional environment overrides.
  map<string, string> environment = 4;

  // Optional execution timeout. Absence means no timeout.
  google.protobuf.Duration execution_timeout = 105;

  // Optional stdin payload passed to the command.
  bytes stdin = 6;

  // Request a pseudo-terminal for the remote command.
  bool tty = 7;

  // Initial terminal columns (used when tty=true, 0 = use default).
  uint32 cols = 8;

  // Initial terminal rows (used when tty=true, 0 = use default).
  uint32 rows = 9;

  // Skip sourcing shell login/profile startup files before running the command.
  // When false (the default), the command runs through a login shell
  // (`bash -lc`) so user startup files (.bash_profile/.profile, and .bashrc if
  // sourced by them) are applied. When true, the command runs without those
  // files (`bash -c`), for automation that needs predictable startup behavior.
  bool no_login_shell = 10;

  // Optional nonzero UUID for durable launch admission. Also applies to the
  // initial ExecSandboxInteractive start message. Duplicates never relaunch,
  // reattach, or replay output/stdin. Unconfirmed executions remain fenced;
  // confirmed terminal executions retain the fence for 24 hours.
  string request_id = 11;
}

message ExecSandboxStdout {
  bytes data = 1;
}

message ExecSandboxStderr {
  bytes data = 1;
}

message ExecSandboxExit {
  int32 exit_code = 1;
}

message ExecSandboxEvent {
  oneof payload {
    ExecSandboxStdout stdout = 1;
    ExecSandboxStderr stderr = 2;
    ExecSandboxExit exit = 3;
  }
}
