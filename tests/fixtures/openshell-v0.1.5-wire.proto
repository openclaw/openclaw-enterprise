// Independent wire oracle extracted from NVIDIA OpenShell commit
// bdb956f2cd65a635f1294fccf1d138d263bf650f. Keep this fixture pinned to that
// upstream contract; do not derive it from the production client proto.
syntax = "proto3";

package openshell.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

service OpenShell {
  rpc GetDraftPolicy(GetDraftPolicyRequest) returns (GetDraftPolicyResponse);
  rpc GetSandboxPolicyStatus(GetSandboxPolicyStatusRequest) returns (GetSandboxPolicyStatusResponse);
  rpc UpdateConfig(UpdateConfigRequest) returns (UpdateConfigResponse);
  rpc ExecSandbox(ExecSandboxRequest) returns (stream ExecSandboxEvent);
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc CreateSandbox(CreateSandboxRequest) returns (SandboxResponse);
  rpc GetSandbox(GetSandboxRequest) returns (SandboxResponse);
  rpc GetService(GetServiceRequest) returns (ServiceEndpointResponse);
  rpc DeleteService(DeleteServiceRequest) returns (DeleteServiceResponse);
  rpc DeleteSandbox(DeleteSandboxRequest) returns (DeleteSandboxResponse);
  rpc GetWorkspace(GetWorkspaceRequest) returns (GetWorkspaceResponse);
  rpc GetSandboxLogs(GetSandboxLogsRequest) returns (GetSandboxLogsResponse);
  rpc GetSandboxProviderStatus(GetSandboxProviderStatusRequest)
      returns (GetSandboxProviderStatusResponse);
  rpc CreateProvider(CreateProviderRequest) returns (ProviderResponse);
  rpc UpdateProvider(UpdateProviderRequest) returns (ProviderResponse);
  rpc DetachSandboxProvider(DetachSandboxProviderRequest)
      returns (DetachSandboxProviderResponse);
  rpc ImportProviderProfiles(ImportProviderProfilesRequest)
      returns (ImportProviderProfilesResponse);
  rpc GetProviderRefreshStatus(GetProviderRefreshStatusRequest)
      returns (GetProviderRefreshStatusResponse);
  rpc ConfigureProviderRefresh(ConfigureProviderRefreshRequest)
      returns (ConfigureProviderRefreshResponse);
  rpc RotateProviderCredential(RotateProviderCredentialRequest)
      returns (RotateProviderCredentialResponse);
  rpc DeleteProviderRefresh(DeleteProviderRefreshRequest)
      returns (DeleteProviderRefreshResponse);
}

message HealthRequest {}

message HealthResponse {
  ServiceStatus status = 1;
  string version = 2;
}

enum ServiceStatus {
  SERVICE_STATUS_UNSPECIFIED = 0;
  SERVICE_STATUS_HEALTHY = 1;
}

message WorkspaceSelector {
  oneof selection {
    string workspace = 1;
  }
}

message CreateSandboxRequest {
  SandboxSpec spec = 1;
  string name = 2;
  map<string, string> labels = 3;
  map<string, string> annotations = 4;
  WorkspaceSelector workspace_scope = 7;
  string request_id = 8;
  repeated SandboxServiceExposure service_exposures = 9;
}

message SandboxServiceExposure {
  string service = 1;
  uint32 target_port = 2;
  ServiceAuthorizationMode authorization_mode = 3;
}

enum ServiceAuthorizationMode {
  SERVICE_AUTHORIZATION_MODE_UNSPECIFIED = 0;
  SERVICE_AUTHORIZATION_MODE_STRIP = 1;
  SERVICE_AUTHORIZATION_MODE_BEARER_PASSTHROUGH = 2;
}

message DeleteSandboxRequest {
  string name = 1;
  WorkspaceSelector workspace_scope = 2;
}

message GetSandboxRequest {
  string name = 1;
  WorkspaceSelector workspace_scope = 2;
}

message GetServiceRequest {
  string sandbox = 1;
  // Empty selects the unnamed endpoint.
  string name = 2;
  WorkspaceSelector workspace_scope = 3;
}

message SandboxSpec {
  SandboxPolicy policy = 7;
  repeated string providers = 8;
  SandboxRestartPolicy restart_policy = 15;
}

enum SandboxRestartPolicy {
  SANDBOX_RESTART_POLICY_UNSPECIFIED = 0;
  SANDBOX_RESTART_POLICY_NEVER = 1;
  SANDBOX_RESTART_POLICY_ON_FAILURE = 2;
  SANDBOX_RESTART_POLICY_ALWAYS = 3;
}

message SandboxPolicy {
  // Policy version.
  uint32 version = 1;
  // Filesystem access policy.
  FilesystemPolicy filesystem = 2;
  // Landlock configuration.
  LandlockPolicy landlock = 3;
  // Process execution policy.
  ProcessPolicy process = 4;
  // Network access policies keyed by name (e.g. "claude_code", "gitlab").
  map<string, NetworkPolicyRule> network_policies = 5;
  // Reusable supervisor middleware configs for network egress, keyed by their
  // policy-local names. At most 10 configs are accepted, and at most 10 stages
  // can be selected per request.
  map<string, NetworkMiddlewareConfig> network_middlewares = 6;
}

// Filesystem access policy.
message FilesystemPolicy {
  // Automatically include the workdir as read-write.
  bool include_workdir = 1;
  // Read-only directory allow list.
  repeated string read_only = 2;
  // Read-write directory allow list.
  repeated string read_write = 3;
}

// Landlock policy configuration.
message LandlockPolicy {
  // Compatibility mode (e.g. "best_effort", "hard_requirement").
  string compatibility = 1;
}

// Process execution policy.
message ProcessPolicy {
  // User name to run the sandboxed process as.
  string run_as_user = 1;
  // Group name to run the sandboxed process as.
  string run_as_group = 2;
}

// A named network access policy rule.
message NetworkPolicyRule {
  // Human-readable name for this policy rule.
  string name = 1;
  // Allowed endpoint (host:port) pairs.
  repeated NetworkEndpoint endpoints = 2;
  // Allowed binary identities.
  repeated NetworkBinary binaries = 3;
}

// A reusable middleware config selected for admitted egress by host.
message NetworkMiddlewareConfig {
  // Human-readable name for this middleware config.
  string name = 1;
  // Built-in middleware name or operator-owned registration name.
  string middleware = 2;
  // Service-specific configuration.
  google.protobuf.Struct config = 3;
  // Failure behavior: "fail_closed" (default) or "fail_open".
  string on_error = 4;
  // Host selector controlling which admitted destinations use this config.
  MiddlewareEndpointSelector endpoints = 5;
  // Execution order. Values must be unique within a policy; lower values run first.
  int32 order = 6;
}

// Host selector controlling which admitted destinations use a middleware config.
message MiddlewareEndpointSelector {
  // Exact host or DNS glob patterns included in the selection. Include and
  // exclude accept at most 32 combined patterns.
  repeated string include = 1;
  // Exact host or DNS glob patterns removed from the selection.
  // Exclusions take precedence over inclusions.
  repeated string exclude = 2;
}

// Binds a policy endpoint to static credentials from a sandbox provider.
message NetworkCredentialBinding {
  // Name of the provider attached to this sandbox whose static credentials
  // may be resolved for requests admitted by this endpoint.
  string provider = 1;
}

// TLS handling for a network endpoint.
enum NetworkTlsMode {
  // Auto-detect TLS and terminate it when inspection is configured.
  NETWORK_TLS_MODE_UNSPECIFIED = 0;
  // Disable TLS detection and relay the connection without inspection.
  NETWORK_TLS_MODE_SKIP = 1;
  // Rejected by policy validation; use NETWORK_TLS_MODE_UNSPECIFIED.
  NETWORK_TLS_MODE_TERMINATE = 2 [deprecated = true];
  // Rejected by policy validation; use NETWORK_TLS_MODE_UNSPECIFIED.
  NETWORK_TLS_MODE_PASSTHROUGH = 3 [deprecated = true];
}

// Enforcement behavior for inspected network traffic.
enum NetworkEnforcementMode {
  // Preserve the existing default: log violations and allow traffic.
  NETWORK_ENFORCEMENT_MODE_UNSPECIFIED = 0;
  // Deny traffic that does not satisfy the endpoint policy.
  NETWORK_ENFORCEMENT_MODE_ENFORCE = 1;
  // Log policy violations and allow the traffic.
  NETWORK_ENFORCEMENT_MODE_AUDIT = 2;
}

// Shorthand access policy for an inspected network endpoint.
enum NetworkAccessPreset {
  // No access preset; explicit rules may define allowed traffic.
  NETWORK_ACCESS_PRESET_UNSPECIFIED = 0;
  // Allow read-only operations for the selected protocol.
  NETWORK_ACCESS_PRESET_READ_ONLY = 1;
  // Allow read and write operations for the selected protocol.
  NETWORK_ACCESS_PRESET_READ_WRITE = 2;
  // Allow every operation supported by the selected protocol.
  NETWORK_ACCESS_PRESET_FULL = 3;
}

// A network endpoint (host + port) with optional L7 inspection config.
message NetworkEndpoint {
  // Hostname or host glob pattern. Exact match is case-insensitive.
  // Glob patterns use "." as delimiter: "*.example.com" matches a single
  // subdomain label, "**.example.com" matches across labels.
  string host = 1;
  // Single port (backwards compat). Use `ports` for multiple ports.
  // Mutually exclusive with `ports` — if both are set, `ports` takes precedence.
  uint32 port = 2;
  // Endpoint protocol. "tcp" and "" select L4-only handling; "rest",
  // "websocket", "graphql", "sql", "json-rpc", and "mcp" select L7 inspection.
  string protocol = 3;
  // TLS handling. Unspecified enables automatic detection and termination.
  NetworkTlsMode tls = 4;
  // Enforcement mode. Unspecified preserves the audit default.
  NetworkEnforcementMode enforcement = 5;
  // Access preset shorthand. Unspecified means no preset.
  // Mutually exclusive with rules.
  NetworkAccessPreset access = 6;
  // Explicit L7 rules (mutually exclusive with access).
  repeated L7Rule rules = 7;
  // Allowed resolved IP addresses or CIDR ranges for this endpoint.
  // When non-empty, the SSRF internal-IP check is replaced by an allowlist check:
  //   - If host is also set: domain must resolve to an IP in this list.
  //   - If host is empty: any domain is allowed as long as it resolves to an IP in this list.
  // Supports exact IPs ("10.0.5.20") and CIDR notation ("10.0.5.0/24").
  // Loopback (127.0.0.0/8) and link-local (169.254.0.0/16) are always blocked
  // regardless of this field.
  repeated string allowed_ips = 8;
  // Multiple ports. When non-empty, this endpoint covers all listed ports.
  // If `port` is set and `ports` is empty, `port` is normalized to `ports: [port]`.
  // If both are set, `ports` takes precedence.
  repeated uint32 ports = 9;
  // Explicit L7 deny rules. When present, requests matching any deny rule
  // are blocked even if they match an allow rule or access preset.
  // Deny rules take precedence over allow rules.
  repeated L7DenyRule deny_rules = 10;
  // When true, percent-encoded '/' (%2F) is preserved in path segments
  // rather than rejected by the L7 path canonicalizer. Required for
  // upstreams like GitLab that embed %2F in namespaced resource paths.
  // Defaults to false (strict).
  bool allow_encoded_slash = 11;
  // GraphQL persisted-query behavior for hash-only/saved-query requests:
  // "deny" (default) or "allow_registered".
  string persisted_queries = 12;
  // Trusted GraphQL persisted-query registry keyed by hash or service-specific ID.
  // Only used when persisted_queries is "allow_registered".
  map<string, GraphqlOperation> graphql_persisted_queries = 13;
  // Maximum GraphQL request body bytes to buffer for inspection.
  // Defaults to 65536 when unset.
  uint32 graphql_max_body_bytes = 14;
  // Optional HTTP path glob that scopes this L7 endpoint on shared host:port APIs.
  // Example: use path "/graphql" for protocol "graphql" and "/repos/**" for
  // protocol "rest" when both surfaces live under api.example.com:443.
  // Empty means all paths.
  string path = 15;
  // When true on a "rest" endpoint, OpenShell rewrites credential placeholders
  // inside client-to-server WebSocket text messages after an allowed HTTP 101
  // upgrade. Defaults to false.
  bool websocket_credential_rewrite = 16;
  // When true on a "rest" endpoint, OpenShell rewrites credential placeholders
  // inside supported textual HTTP request bodies before forwarding upstream.
  // Defaults to false.
  bool request_body_credential_rewrite = 17;
  // Internal provenance marker for policy-advisor generated endpoints.
  // Advisor-proposed endpoints must not satisfy exact-host SSRF trust unless
  // they are converted through an explicit user-authored policy path.
  bool advisor_proposed = 18;
  // Proxy-side credential signing mode: "sigv4" for AWS SigV4 re-signing.
  // When set, the proxy strips the client's Authorization header and computes
  // a fresh SigV4 signature using real credentials from the provider.
  string credential_signing = 19;
  // AWS signing service name override. Required when credential_signing is
  // "sigv4" — e.g. "bedrock" for bedrock-runtime endpoints.
  string signing_service = 20;
  // AWS region override for SigV4 signing. When set, takes precedence over
  // hostname-based region extraction. Required for non-standard endpoints.
  string signing_region = 21;
  // Maximum JSON-RPC-over-HTTP request body bytes to buffer for inspection.
  // Defaults to 65536 when unset.
  uint32 json_rpc_max_body_bytes = 22;
  // MCP-only policy and inspection options. Only used when protocol is "mcp".
  McpOptions mcp = 23;
  // Explicit binding authority for static credentials from an attached
  // endpointless provider profile. Profiles that already define endpoints
  // continue to use those profile endpoints as their credential boundary.
  NetworkCredentialBinding credential_binding = 24;
  // Explicitly permits credential-bearing traffic to use paths that OpenShell
  // cannot inspect or rewrite. Defaults to false. This is a security-sensitive
  // escape hatch and must be explicitly approved.
  bool allow_uninspected_credentials = 25;
  // Internal gateway-derived marker indicating that this endpoint belongs to
  // an attached credentialed provider. User-authored values are ignored.
  bool provider_credentialed = 26;
}

// MCP options are grouped so MCP-specific policy can grow without adding more
// top-level NetworkEndpoint fields. OpenShell owns the supported revision
// profiles instead of treating dependency enums as the policy contract.
//
// Sources:
// - https://modelcontextprotocol.io/specification/2025-03-26/basic/transports
// - https://modelcontextprotocol.io/specification/2025-06-18/basic/transports
// - https://modelcontextprotocol.io/specification/2025-11-25/basic/transports
message McpOptions {
  // Hardening boundary for tools/call params.name. When unset or true, the
  // supervisor enforces the MCP recommended tool-name syntax
  // ^[A-Za-z0-9_.-]{1,128}$ before policy evaluation. Set false only for
  // compatibility with servers that intentionally use non-recommended names.
  //
  // Source:
  // - https://modelcontextprotocol.io/specification/2025-11-25/server/tools#tool-names
  optional bool strict_tool_names = 1;
  // Method-layer default for MCP endpoints. When true, OpenShell allows parsed
  // MCP-family methods at the method layer unless a tool-name policy narrows
  // tools/call. When unset or false, explicit method rules are required.
  optional bool allow_all_known_mcp_methods = 2;
  // Exact MCP protocol revisions accepted by the endpoint's policy schema.
  // Authors may omit this field. Because proto3 repeated fields do not retain
  // presence, omission reaches protobuf ingress as an empty list. Checked
  // normalization materializes OpenShell's pinned default revision
  // "2025-11-25" before producing canonical downstream state, which is always
  // nonempty.
  //
  // An explicit nonempty list remains an exact allowlist. Duplicates, moving
  // aliases such as "draft" and "latest", and unknown dates are invalid.
  // Normalization stores valid values in canonical semantic order. These
  // values identify core revisions; they do not enable separate SEP overlays
  // or select runtime parsing and forwarding behavior.
  repeated string versions = 3;
}

// Trusted GraphQL operation classification.
message GraphqlOperation {
  // Operation type: "query", "mutation", or "subscription".
  string operation_type = 1;
  // Operation name, if known.
  string operation_name = 2;
  // Root field names selected by the operation.
  repeated string fields = 3;
}

// An L7 deny rule that blocks specific requests.
// Mirrors L7Allow — same fields, same matching semantics, inverted effect.
// Deny rules are evaluated after allow rules and take precedence.
message L7DenyRule {
  // Protocol method: HTTP method (REST/WebSocket), JSON-RPC method name, or
  // "*" for any when supported by the protocol.
  string method = 1;
  // URL path glob pattern (REST): "/repos/*/pulls/*/reviews", "**" for any.
  string path = 2;
  // SQL command (SQL): SELECT, INSERT, etc. or "*" for any.
  string command = 3;
  // Query parameter matcher map (REST).
  // Same semantics as L7Allow.query.
  map<string, L7QueryMatcher> query = 4;
  // GraphQL operation type: "query", "mutation", "subscription", or "*" for any.
  string operation_type = 5;
  // GraphQL operation name glob. "*" matches any operation name.
  string operation_name = 6;
  // GraphQL root field globs. Deny rules match when any selected root field
  // matches any configured glob.
  repeated string fields = 7;
  reserved 8;
  // MCP params matcher map. Currently only params.name is supported for
  // tools/call filtering. Generic protocol "json-rpc" rejects params matchers.
  map<string, L7QueryMatcher> params = 9;
}

// An L7 policy rule (allow-only).
message L7Rule {
  L7Allow allow = 1;
}

// Allowed action definition for L7 rules.
message L7Allow {
  // Protocol method: HTTP method (REST/WebSocket), JSON-RPC method name, or
  // "*" for any when supported by the protocol.
  string method = 1;
  // URL path glob pattern (REST): "/repos/**", "**" for any.
  string path = 2;
  // SQL command (SQL): SELECT, INSERT, etc. or "*" for any.
  string command = 3;
  // Query parameter matcher map (REST).
  // Key is the decoded query parameter name (case-sensitive).
  // Value supports either a single glob (`glob`) or a list (`any`).
  map<string, L7QueryMatcher> query = 4;
  // GraphQL operation type: "query", "mutation", "subscription", or "*" for any.
  string operation_type = 5;
  // GraphQL operation name glob. "*" matches any operation name.
  string operation_name = 6;
  // GraphQL root field globs. Allow rules match only when every selected root
  // field matches one of the configured globs. Omit to match all fields.
  repeated string fields = 7;
  reserved 8;
  // MCP params matcher map. Currently only params.name is supported for
  // tools/call filtering. Generic protocol "json-rpc" rejects params matchers.
  map<string, L7QueryMatcher> params = 9;
}

// Query value matcher for one query parameter key.
message L7QueryMatcher {
  // Single glob pattern.
  string glob = 1;
  // Any-of glob patterns.
  repeated string any = 2;
}

// A binary identity for network policy matching.
message NetworkBinary {
  string path = 1;
  reserved 2;
  reserved "harness";
}

// Request to get sandbox settings by sandbox name.
message SandboxResponse {
  Sandbox sandbox = 1;
  map<string, string> service_urls = 2;
}

message ServiceEndpoint {
  ObjectMeta metadata = 1;
  string sandbox_id = 2;
  string sandbox = 3;
  string name = 4;
  uint32 target_port = 5;
  bool domain = 6;
  ServiceAuthorizationMode authorization_mode = 7;
}

message ServiceEndpointResponse {
  ServiceEndpoint endpoint = 1;
  string url = 2;
}

message Sandbox {
  ObjectMeta metadata = 1;
  SandboxSpec spec = 2;
  SandboxStatus status = 3;
}

message SandboxStatus {
  SandboxPhase phase = 6;
  optional int32 exit_code = 9;
  uint32 restart_count = 14;
}

enum SandboxPhase {
  SANDBOX_PHASE_UNSPECIFIED = 0;
  SANDBOX_PHASE_PROVISIONING = 1;
  SANDBOX_PHASE_READY = 2;
  SANDBOX_PHASE_ERROR = 3;
  SANDBOX_PHASE_DELETING = 4;
  SANDBOX_PHASE_UNKNOWN = 5;
  SANDBOX_PHASE_STOPPING = 6;
  SANDBOX_PHASE_STOPPED = 7;
  SANDBOX_PHASE_STARTING = 8;
  SANDBOX_PHASE_COMPLETED = 9;
  reserved 10;
  reserved "SANDBOX_PHASE_RESTARTING";
}

message ObjectMeta {
  string id = 1;
  string name = 2;
  map<string, string> labels = 4;
  uint64 resource_version = 5;
  map<string, string> annotations = 6;
  string workspace = 7;
}

message GetWorkspaceRequest {
  string name = 1;
}

message GetWorkspaceResponse {
  Workspace workspace = 1;
}

message Workspace {
  ObjectMeta metadata = 1;
  WorkspaceStatus status = 2;
}

message WorkspaceStatus {
  WorkspacePhase phase = 1;
}

enum WorkspacePhase {
  WORKSPACE_PHASE_UNSPECIFIED = 0;
  WORKSPACE_PHASE_ACTIVE = 1;
  WORKSPACE_PHASE_TERMINATING = 2;
}

message DeleteSandboxResponse {
  reserved 1;
  reserved "deleted";
  DeletionOutcome outcome = 2;
  string sandbox_id = 3;
}

message DeleteServiceRequest {
  string sandbox = 1;
  string name = 2;
  WorkspaceSelector workspace_scope = 3;
  bool allow_missing = 4;
  string request_id = 5;
}

message DeleteServiceResponse {
  reserved 1;
  reserved "deleted";
  DeletionOutcome outcome = 2;
}

enum DeletionOutcome {
  DELETION_OUTCOME_UNSPECIFIED = 0;
  DELETION_OUTCOME_COMPLETED = 1;
  DELETION_OUTCOME_ACCEPTED = 2;
  DELETION_OUTCOME_ALREADY_ABSENT = 3;
}

// openshell.datamodel.v1.Provider
message Provider {
  reserved 5;
  reserved "credential_expires_at_ms";
  ObjectMeta metadata = 1;
  string type = 2;
  map<string, string> credentials = 3;
  map<string, string> config = 4;
  map<string, google.protobuf.Timestamp> credential_expiration_times = 105;
  string profile_workspace = 6;
}

message CreateProviderRequest {
  WorkspaceSelector workspace_scope = 2;
  Provider provider = 1;
  string request_id = 3;
}

message ProviderResponse {
  Provider provider = 1;
  string mutation_id = 3;
}

message UpdateProviderRequest {
  WorkspaceSelector workspace_scope = 3;
  reserved 2;
  reserved "credential_expires_at_ms";
  Provider provider = 1;
  map<string, google.protobuf.Timestamp> credential_expiration_times = 102;
  repeated string clear_credential_expiration_keys = 103;
  string request_id = 4;
}

message DetachSandboxProviderRequest {
  WorkspaceSelector workspace_scope = 4;
  string sandbox = 1;
  string provider = 2;
  uint64 expected_resource_version = 3;
  string request_id = 5;
}

message DetachSandboxProviderResponse {
  Sandbox sandbox = 1;
  bool detached = 2;
  ProviderMutationReceipt receipt = 3;
}

enum ProviderMutationKind {
  PROVIDER_MUTATION_KIND_UNSPECIFIED = 0;
  PROVIDER_MUTATION_KIND_ATTACH = 1;
  PROVIDER_MUTATION_KIND_DETACH = 2;
  PROVIDER_MUTATION_KIND_UPDATE = 3;
}

message ProviderMutationReceipt {
  string receipt_id = 1;
  string mutation_id = 2;
  string provider = 3;
  string workspace = 4;
  ProviderMutationKind kind = 5;
}

enum ProviderProfileCategory {
  PROVIDER_PROFILE_CATEGORY_UNSPECIFIED = 0;
  PROVIDER_PROFILE_CATEGORY_OTHER = 1;
  PROVIDER_PROFILE_CATEGORY_INFERENCE = 2;
  PROVIDER_PROFILE_CATEGORY_AGENT = 3;
  PROVIDER_PROFILE_CATEGORY_SOURCE_CONTROL = 4;
  PROVIDER_PROFILE_CATEGORY_MESSAGING = 5;
  PROVIDER_PROFILE_CATEGORY_DATA = 6;
  PROVIDER_PROFILE_CATEGORY_KNOWLEDGE = 7;
}

message ProviderProfileCredential {
  string name = 1;
  string description = 2;
  repeated string env_vars = 3;
  bool required = 4;
  string auth_style = 5;
  string header_name = 6;
  string query_param = 7;
  ProviderCredentialRefresh refresh = 8;
  string path_template = 9;
}

message ProviderProfile {
  string id = 1;
  string display_name = 2;
  string description = 3;
  ProviderProfileCategory category = 4;
  repeated ProviderProfileCredential credentials = 5;
  repeated NetworkEndpoint endpoints = 6;
  repeated NetworkBinary binaries = 7;
  bool inference_capable = 8;
  uint64 resource_version = 10;
  map<string, string> annotations = 11;
  string source = 12;
  string scope = 13;
  repeated ProviderProfileFile files = 14;
}

message ProviderProfileFile {
  string path = 1;
  string content = 2;
  string env_var = 3;
}

message ProviderProfileImportItem {
  ProviderProfile profile = 1;
  string source = 2;
}

message ProviderProfileDiagnostic {
  string source = 1;
  string profile_id = 2;
  string field = 3;
  string message = 4;
  string severity = 5;
}

message ImportProviderProfilesRequest {
  WorkspaceSelector workspace_scope = 2;
  repeated ProviderProfileImportItem profiles = 1;
  string request_id = 3;
}

message ImportProviderProfilesResponse {
  repeated ProviderProfileDiagnostic diagnostics = 1;
  repeated ProviderProfile profiles = 2;
  bool imported = 3;
}

message GetSandboxProviderStatusRequest {
  WorkspaceSelector workspace_scope = 4;
  string sandbox = 1;
  string provider = 2;
  string receipt_id = 3;
}

message GetSandboxProviderStatusResponse {
  ProviderReadinessStatus status = 1;
}

message ProviderReadinessStatus {
  ProviderMutationReceipt receipt = 1;
  ProviderReadinessState state = 2;
  ProviderReadinessReason reason = 3;
  string network_instance_id = 5;
}

enum ProviderReadinessState {
  PROVIDER_READINESS_STATE_UNSPECIFIED = 0;
  PROVIDER_READINESS_STATE_PERSISTED = 1;
  PROVIDER_READINESS_STATE_PENDING = 2;
  PROVIDER_READINESS_STATE_READY = 3;
  PROVIDER_READINESS_STATE_WITHHELD = 4;
  PROVIDER_READINESS_STATE_REVOKED = 5;
  PROVIDER_READINESS_STATE_FAILED = 6;
  PROVIDER_READINESS_STATE_SUPERSEDED = 7;
}

enum ProviderReadinessReason {
  PROVIDER_READINESS_REASON_UNSPECIFIED = 0;
  PROVIDER_READINESS_REASON_WAITING_FOR_SUPERVISOR = 1;
  PROVIDER_READINESS_REASON_WAITING_FOR_CREDENTIALS = 2;
  PROVIDER_READINESS_REASON_WAITING_FOR_POLICY = 3;
  PROVIDER_READINESS_REASON_WAITING_FOR_PROCESS = 4;
  PROVIDER_READINESS_REASON_UNSUPPORTED_SUPERVISOR = 5;
  PROVIDER_READINESS_REASON_CREDENTIALS_WITHHELD = 6;
}

// Get sandbox logs request (one-shot fetch).
message GetSandboxLogsRequest {
  // Workspace scope. Only a named workspace selection is accepted.
  WorkspaceSelector workspace_scope = 6;
  reserved 3;
  reserved "since_ms";
  // Canonical sandbox name.
  string sandbox = 1;
  // Maximum number of log lines to return. 0 means use default (2000).
  uint32 lines = 2;
  // Only include logs at or after this time. Absence means no filter.
  google.protobuf.Timestamp since_time = 103;
  // Filter by log source (e.g. "gateway", "sandbox"). Empty means all sources.
  repeated string sources = 4;
  // Minimum log level to include (e.g. "INFO", "WARN", "ERROR"). Empty means all levels.
  string min_level = 5;
}

// Get sandbox logs response.
message GetSandboxLogsResponse {
  // Log lines in chronological order.
  repeated SandboxLogLine logs = 1;
  // Total number of lines in the server's buffer for this sandbox.
  uint32 buffer_total = 2;
}

// Log line correlated to a sandbox.
message SandboxLogLine {
  reserved 2;
  reserved "timestamp_ms";
  string sandbox_id = 1;
  google.protobuf.Timestamp event_time = 102;
  string level = 3;
  string target = 4;
  string message = 5;
  // Log source: "gateway" (server-side) or "sandbox" (supervisor).
  // Empty is treated as "gateway" for backward compatibility.
  string source = 6;
  // Structured key-value fields from the tracing event (e.g. dst_host, action).
  map<string, string> fields = 7;
}

enum ProviderCredentialRefreshStrategy {
  PROVIDER_CREDENTIAL_REFRESH_STRATEGY_UNSPECIFIED = 0;
  PROVIDER_CREDENTIAL_REFRESH_STRATEGY_STATIC = 1;
  PROVIDER_CREDENTIAL_REFRESH_STRATEGY_EXTERNAL = 2;
  PROVIDER_CREDENTIAL_REFRESH_STRATEGY_OAUTH2_REFRESH_TOKEN = 3;
  PROVIDER_CREDENTIAL_REFRESH_STRATEGY_OAUTH2_CLIENT_CREDENTIALS = 4;
  PROVIDER_CREDENTIAL_REFRESH_STRATEGY_GOOGLE_SERVICE_ACCOUNT_JWT = 5;
  PROVIDER_CREDENTIAL_REFRESH_STRATEGY_AWS_STS_ASSUME_ROLE = 6;
}

message ProviderCredentialRefreshMaterial {
  string name = 1;
  string description = 2;
  bool required = 3;
  bool secret = 4;
}

// Declares that a single refresh operation mints more than one credential.
// The refresh is attached to a primary credential; each additional output
// maps a strategy-defined semantic output id to a sibling credential whose
// env_vars receive the minted value.
message ProviderCredentialRefreshOutput {
  string output = 1;      // strategy-defined semantic output id (e.g. "session_token")
  string credential = 2;  // sibling credential name whose env_vars receive this output
}

message ProviderCredentialRefresh {
  reserved 4, 5;
  reserved "refresh_before_seconds", "max_lifetime_seconds";
  ProviderCredentialRefreshStrategy strategy = 1;
  string token_url = 2;
  repeated string scopes = 3;
  google.protobuf.Duration refresh_before = 104;
  google.protobuf.Duration max_lifetime = 105;
  repeated ProviderCredentialRefreshMaterial material = 6;
  repeated ProviderCredentialRefreshOutput additional_outputs = 7;
}

// Stable recovery action for the most recent provider credential refresh
// failure. Kept after the pre-existing enums so adding it does not renumber
// their generated descriptors. Clients should use this field instead of
// parsing last_error.
enum ProviderCredentialRefreshRecoveryAction {
  PROVIDER_CREDENTIAL_REFRESH_RECOVERY_ACTION_UNSPECIFIED = 0;
  PROVIDER_CREDENTIAL_REFRESH_RECOVERY_ACTION_RETRY = 1;
  PROVIDER_CREDENTIAL_REFRESH_RECOVERY_ACTION_REAUTHORIZE = 2;
  PROVIDER_CREDENTIAL_REFRESH_RECOVERY_ACTION_FIX_CONFIGURATION = 3;
  PROVIDER_CREDENTIAL_REFRESH_RECOVERY_ACTION_INVESTIGATE = 4;
}

message ProviderCredentialRefreshStatus {
  reserved 6, 7, 8, 13;
  reserved "expires_at_ms", "next_refresh_at_ms", "last_refresh_at_ms", "last_error_at_ms";
  string provider = 1;
  string provider_id = 2;
  string credential_key = 3;
  ProviderCredentialRefreshStrategy strategy = 4;
  string status = 5;
  google.protobuf.Timestamp expiration_time = 106;
  // Next automatic refresh time. Absence means no automatic retry is scheduled;
  // use recovery_action to determine the required recovery workflow.
  google.protobuf.Timestamp next_refresh_time = 107;
  google.protobuf.Timestamp last_refresh_time = 108;
  string last_error = 9;
  ProviderCredentialRefreshRecoveryAction recovery_action = 10;
  // Stable gateway-owned failure identifier, for example
  // "oauth_invalid_grant". This is not provider-controlled prose and
  // incorporates any recognized top-level OAuth error classification.
  string failure_code = 11;
  // A bounded, recognized provider subtype that refines failure_code; clients
  // do not need a separate provider_error field. Unknown provider-controlled
  // values are not persisted or returned.
  string provider_error_subtype = 12;
  google.protobuf.Timestamp last_error_time = 113;
}

message GetProviderRefreshStatusRequest {
  // Workspace scope. Only a named workspace selection is accepted.
  WorkspaceSelector workspace_scope = 3;
  string provider = 1;
  string credential_key = 2;
}

message GetProviderRefreshStatusResponse {
  repeated ProviderCredentialRefreshStatus credentials = 1;
}

message ConfigureProviderRefreshRequest {
  // Workspace scope. Only a named workspace selection is accepted.
  WorkspaceSelector workspace_scope = 7;
  reserved 6;
  reserved "expires_at_ms";
  string provider = 1;
  string credential_key = 2;
  ProviderCredentialRefreshStrategy strategy = 3;
  map<string, string> material = 4;
  // Additional material names the caller requests be stored as secrets. Every
  // name must be present in material. The server also classifies secrets from
  // the authoritative provider profile and refresh strategy.
  repeated string secret_material_keys = 5;
  google.protobuf.Timestamp expiration_time = 106;
  // Optional nonzero UUID for durable at-most-once admission. Successful results
  // can be replayed for 24 hours; see the API errors and retries reference.
  string request_id = 8;
}

message ConfigureProviderRefreshResponse {
  ProviderCredentialRefreshStatus status = 1;
}

message RotateProviderCredentialRequest {
  // Workspace scope. Only a named workspace selection is accepted.
  WorkspaceSelector workspace_scope = 3;
  string provider = 1;
  string credential_key = 2;
  // Optional nonzero UUID for durable at-most-once admission. Successful results
  // can be replayed for 24 hours; see the API errors and retries reference.
  string request_id = 4;
}

message RotateProviderCredentialResponse {
  ProviderCredentialRefreshStatus status = 1;
}

message DeleteProviderRefreshRequest {
  // Workspace scope. Only a named workspace selection is accepted.
  WorkspaceSelector workspace_scope = 4;
  string provider = 1;
  string credential_key = 2;
  bool allow_missing = 5;
  // Optional nonzero UUID for durable at-most-once admission. Successful results
  // can be replayed for 24 hours; see the API errors and retries reference.
  string request_id = 6;
}

message DeleteProviderRefreshResponse {
  reserved 1;
  reserved "deleted";
  DeletionOutcome outcome = 2;
}

message GetDraftPolicyRequest {
  // Workspace scope. Only a named workspace selection is accepted.
  WorkspaceSelector workspace_scope = 3;
  // Optional status filter: "pending", "approved", "rejected", or "" for all.
  string status_filter = 2;
  string sandbox = 1;
}

message GetDraftPolicyResponse {
  reserved 4;
  reserved "last_analyzed_at_ms";
  // Draft policy chunks.
  repeated PolicyChunk chunks = 1;
  // LLM-generated summary of all analysis (empty in mechanistic mode).
  string rolling_summary = 2;
  // Current draft version.
  uint64 draft_version = 3;
  // Time when the last analysis completed.
  google.protobuf.Timestamp last_analyzed_time = 104;
}

message PolicyChunk {
  reserved 9, 10, 14, 15;
  reserved "created_at_ms", "decided_at_ms", "first_seen_ms", "last_seen_ms";
  // Unique chunk identifier.
  string id = 1;
  // Approval status: "pending", "approved", "rejected".
  string status = 2;
  // Proposed network_policies map key.
  string rule_name = 3;
  // The proposed network policy rule.
  NetworkPolicyRule proposed_rule = 4;
  // Human-readable explanation of why this rule is proposed.
  string rationale = 5;
  // Security concerns flagged by analysis (empty if none).
  string security_notes = 6;
  // Analysis confidence (0.0-1.0). 0 for mechanistic mode.
  float confidence = 7;
  // IDs of denial summaries that led to this chunk.
  repeated string denial_summary_ids = 8;
  // Time when this chunk was created.
  google.protobuf.Timestamp created_time = 109;
  // Time when the user approved or rejected the chunk. Absent if undecided.
  google.protobuf.Timestamp decided_time = 110;
  // Recommendation stage: "initial" or "refined" (progressive L7 visibility).
  string stage = 11;
  // For stage="refined": the initial chunk this replaces.
  string supersedes_chunk_id = 12;
  // How many times this endpoint has been seen across denial flush cycles.
  int32 hit_count = 13;
  // First time this endpoint was proposed.
  google.protobuf.Timestamp first_seen_time = 114;
  // Most recent time this endpoint was proposed again.
  google.protobuf.Timestamp last_seen_time = 115;
  // Binary path that triggered the denial (denormalized for display convenience).
  string binary = 16;
  // Validation verdict from gateway-side static checks (prover output).
  // Free-form summary string for human consumption in the inbox card.
  // Empty until the prover has run for this chunk.
  string validation_result = 17;
  // Operator-supplied free-form text accompanying a rejection. Populated
  // when the reviewer rejects via `RejectDraftChunkRequest.reason`; surfaced
  // back to the in-sandbox agent so it can revise the proposal.
  // Empty for non-rejected chunks.
  string rejection_reason = 18;
  // Gateway-side merge/application preflight failure. Kept separate from
  // prover output and operator rejection so clients can explain why a
  // prover-clean proposal is not currently applicable.
  string application_error = 19;
  // Opaque digest binding review to the exact live inputs and complete
  // effective candidate evaluated by the gateway.
  string review_token = 20;
  // Deterministic hashes for compact candidate display and diagnostics.
  string current_effective_policy_hash = 21;
  string candidate_effective_policy_hash = 22;
  // Complete effective policies used for review. These contain policy
  // configuration only; credential secret values are never materialized.
  SandboxPolicy current_effective_policy = 23;
  SandboxPolicy candidate_effective_policy = 24;
}

message GetSandboxPolicyStatusRequest {
  // Workspace scope. Omit for global queries; otherwise select one named workspace.
  WorkspaceSelector workspace_scope = 4;
  // The specific policy version to query. 0 means latest.
  uint32 version = 2;
  // Query global policy revisions instead of a sandbox-scoped one.
  bool global = 3;
  string sandbox = 1;
}

message GetSandboxPolicyStatusResponse {
  // The queried policy revision.
  SandboxPolicyRevision revision = 1;
  // The currently active (loaded) policy version for this sandbox.
  uint32 active_version = 2;
}

message SandboxPolicyRevision {
  reserved 5, 6;
  reserved "created_at_ms", "loaded_at_ms";
  // Policy version (monotonically increasing per sandbox).
  uint32 version = 1;
  // SHA-256 hash of the canonical serialized policy payload. Empty in a
  // ListSandboxPolicies projection when the stored payload is invalid under
  // the current schema and therefore has no trusted canonical identity.
  string policy_hash = 2;
  // Load status of this revision. ListSandboxPolicies reports FAILED when a
  // stored historical payload is invalid under the current schema, regardless
  // of its persisted sandbox load status.
  PolicyStatus status = 3;
  // Sandbox load error, or the schema-validation diagnostic for an invalid
  // historical row returned by ListSandboxPolicies.
  string load_error = 4;
  // Time when this revision was created.
  google.protobuf.Timestamp created_time = 105;
  // Time when this revision was loaded by the sandbox. Absent if not loaded.
  google.protobuf.Timestamp loaded_time = 106;
  // The full policy (only populated when explicitly requested).
  SandboxPolicy policy = 7;
  // Immutable provenance supplied with this policy revision.
  map<string, string> provenance = 8;
}

enum PolicyStatus {
  POLICY_STATUS_UNSPECIFIED = 0;
  // Server received the update; sandbox has not yet loaded it.
  POLICY_STATUS_PENDING = 1;
  // Sandbox successfully applied this policy version.
  POLICY_STATUS_LOADED = 2;
  // Sandbox attempted to apply but failed; LKG policy remains active.
  // ListSandboxPolicies also uses FAILED for historical payloads that are
  // invalid under the current schema; load_error contains the diagnostic.
  POLICY_STATUS_FAILED = 3;
  // A newer version was persisted before the sandbox loaded this one.
  POLICY_STATUS_SUPERSEDED = 4;
}

// Selected UpdateConfig fields from the same upstream source; unexercised settings omitted.
message UpdateConfigRequest {
  string sandbox = 1;
  SandboxPolicy policy = 2;
  uint64 expected_resource_version = 8;
  map<string, string> annotations = 9;
  WorkspaceSelector workspace_scope = 10;
  string request_id = 11;
}
message UpdateConfigResponse { uint32 version = 1; string policy_hash = 2; }
message ExecSandboxRequest {
  // Workspace scope. Only a named workspace selection is accepted.
  WorkspaceSelector workspace_scope = 12;
  reserved 5;
  reserved "timeout_seconds";
  // Canonical sandbox name.
  string sandbox = 1;
  // Command and arguments.
  repeated string command = 2;

  // Optional working directory.
  string workdir = 3;

  // Optional environment overrides.
  map<string, string> environment = 4;

  // Optional execution timeout. Absence means no timeout.
  google.protobuf.Duration execution_timeout = 105;

  // Optional stdin payload passed to the command.
  bytes stdin = 6;

  // Request a pseudo-terminal for the remote command.
  bool tty = 7;

  // Initial terminal columns (used when tty=true, 0 = use default).
  uint32 cols = 8;

  // Initial terminal rows (used when tty=true, 0 = use default).
  uint32 rows = 9;

  // Skip sourcing shell login/profile startup files before running the command.
  // When false (the default), the command runs through a login shell
  // (`bash -lc`) so user startup files (.bash_profile/.profile, and .bashrc if
  // sourced by them) are applied. When true, the command runs without those
  // files (`bash -c`), for automation that needs predictable startup behavior.
  bool no_login_shell = 10;

  // Optional nonzero UUID for durable launch admission. Also applies to the
  // initial ExecSandboxInteractive start message. Duplicates never relaunch,
  // reattach, or replay output/stdin. Unconfirmed executions remain fenced;
  // confirmed terminal executions retain the fence for 24 hours.
  string request_id = 11;
}

message ExecSandboxStdout {
  bytes data = 1;
}

message ExecSandboxStderr {
  bytes data = 1;
}

message ExecSandboxExit {
  int32 exit_code = 1;
}

message ExecSandboxEvent {
  oneof payload {
    ExecSandboxStdout stdout = 1;
    ExecSandboxStderr stderr = 2;
    ExecSandboxExit exit = 3;
  }
}
